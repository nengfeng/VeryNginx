<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
        <meta http-equiv="Pragma" content="no-cache">
        <meta http-equiv="Expires" content="0">
        <script type="text/javascript">
            var data = {
                'cookie' : "INFOCOOKIE",
                'uri' : "INFOURI",
            };

            function getCookie(c_name){
                if (document.cookie.length>0){ 
                    c_start=document.cookie.indexOf(c_name + "=")
                    if (c_start!=-1){ 
                        c_start=c_start + c_name.length+1 
                        c_end=document.cookie.indexOf(";",c_start)
                        if (c_end==-1) c_end=document.cookie.length
                            return unescape(document.cookie.substring(c_start,c_end))
                    } 
                }
                return "";
            }

            function setCookie(c_name, value, maxAge){
                document.cookie = c_name + "=" + escape(value) + "; Path=/; SameSite=Strict; Max-Age=" + (maxAge || 600);
            }

            function jump(){
                var target = data['uri'];
                if (target.indexOf('http://') !== 0 && target.indexOf('https://') !== 0 && target.indexOf('/') !== 0) {
                    target = '/';
                }
                setCookie('COOKIEPREFIX_sign_javascript', data['cookie'], 600);
                window.location = target;
            }
        </script>
    </head>
    <body onLoad="javascript:jump()">
    </body>
</html>
