# VeryNginx v2 - server block configuration
# This file should be included inside each server {} block

set $vn_proxy_scheme "http";
set $vn_proxy_host $host;
set $vn_proxy_port "80";
set $vn_proxy_sni '';
set $vn_static_root '';
set $vn_static_expires 'epoch';

# Main location - all traffic flows through Lua processing.
# VeryNginx runs the WAF/redirect/rewrite logic in rewrite + access phases.
# Default content handler is try_files for static sites.
# When a proxy_pass rule matches, VeryNginx redirects to @vn_proxy.
location / {
    rewrite_by_lua_file /opt/verynginx/verynginx/on_rewrite.lua;
    access_by_lua_file /opt/verynginx/verynginx/on_access.lua;

    # Serve static files when no VeryNginx rule took action
    try_files $uri $uri/ /index.html;

    log_by_lua_file /opt/verynginx/verynginx/on_log.lua;
}

# Named location for dynamic proxy_pass (invoked via ngx.exec("@vn_proxy")
# from on_access.lua when a proxy rule matches)
location @vn_proxy {
    proxy_http_version 1.1;
    proxy_set_header Host $vn_proxy_host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_ssl_name $vn_proxy_sni;
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_pass http://vn_dynamic_upstream;
}

# Static files for admin dashboard (served via Lua by router plugin;
# this is a fallback for internal redirects)
location /verynginx/static/ {
    alias /opt/verynginx/verynginx/dashboard/;
    expires epoch;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' https://unpkg.com; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;
}