# VeryNginx v2 - server block configuration
# This file should be included inside each server {} block
#
# NOTE: Lua handlers (rewrite/access/log_by_lua_file) are at server level,
# so WAF and plugins run for ALL requests to this server block, including
# dashboard static assets (do NOT add location-level lua_block directives —
# they would REPLACE these server-level handlers).

set $vn_proxy_scheme "http";
set $vn_proxy_host $host;
set $vn_proxy_port "80";
set $vn_proxy_sni '';
set $vn_static_root '';
set $vn_static_expires 'epoch';

# Server-level VeryNginx handlers — WAF + plugins for ALL requests
rewrite_by_lua_file /opt/verynginx/on_rewrite.lua;
access_by_lua_file /opt/verynginx/on_access.lua;
log_by_lua_file /opt/verynginx/on_log.lua;

# Main location — fallback content handler for non-proxied requests
location / {
    try_files $uri $uri/ /index.html;
}

# Named location for dynamic proxy_pass (invoked via ngx.exec("@vn_proxy")
# from on_access.lua when a proxy rule matches)
location @vn_proxy {
    proxy_http_version 1.1;
    proxy_set_header Host $vn_proxy_host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_ssl_name $vn_proxy_sni;
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_pass http://vn_dynamic_upstream;
}

# Dashboard static files. No lua_block directives here on purpose: a
# location-level access/log_by_lua_block (even empty) REPLACES the server-level
# access_by_lua_file/log_by_lua_file, which previously disabled the entire
# WAF/plugin chain and request accounting for this path. Static assets now go
# through the same rewrite/access/log Lua handlers as everything else.
location /verynginx/static/ {
    alias /opt/verynginx/dashboard/;
    expires epoch;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;
}

# VeryNginx API & dashboard — handled by router plugin in access phase
location /verynginx/ {
    # Managed by router plugin; no content handler needed
}