# VeryNginx v2 - http block configuration
# This file should be included inside each http {} block

# Lua package paths (must be inside http {} — NOT valid at main level)
# v2 modules live under verynginx/ (e.g. core/config.lua, api/auth.lua)
# v1.x modules are reused from lua_script/ (util, cookie, json, dkjson)
lua_package_path '/opt/verynginx/?.lua;/opt/verynginx/lua_script/?.lua;/opt/verynginx/lua_script/module/?.lua;;';
lua_package_cpath '/opt/verynginx/?.so;/opt/verynginx/lua_script/?.so;;';
lua_code_cache on;

# Shared dictionaries
lua_shared_dict vn_config 2m;
lua_shared_dict vn_locks 1m;
lua_shared_dict statistics 20m;
lua_shared_dict metrics 10m;
lua_shared_dict healthcheck 10m;
lua_shared_dict dns_cache 4m;
lua_shared_dict frequency_limit 10m;
lua_shared_dict ip_reputation 16m;

# WebSocket connection upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Main process initialization
init_by_lua_block {
    require("core.init").init()
}

# Worker-level timers and health checks
init_worker_by_lua_block {
    require("core.init").init_worker()
}
