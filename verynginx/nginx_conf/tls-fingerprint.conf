# VeryNginx v2 - TLS client fingerprinting (JA4)
#
# Included ONCE inside each VeryNginx-managed SSL server {} block. JA4 must be
# computed during the handshake — ssl_client_hello_by_lua* is the only context
# where the raw ClientHello exists; nothing in the request phase can see it.
#
# Placement rules (both learned the hard way; do not "simplify" them):
#   * NOT at http level. lua-nginx-module checks "has SSL" per server, so an
#     http-level directive fails nginx -t with "no ssl configured for the
#     server" as soon as ANY plain-HTTP server shares the block — and LNMP
#     always ships a :80 default vhost. Only server blocks that already have an
#     ssl_certificate qualify; tools/inject_tls_fingerprint.py finds them by
#     pairing that with the VeryNginx handlers (on_access.lua), because a
#     vhost the WAF does not run in gains nothing from fingerprinting.
#   * NOT additive: a second ssl_client_hello_by_lua_block in the same context
#     fails nginx -t with "is duplicate". This file is the single source of the
#     directive — never inline it elsewhere.
#
# Runtime notes:
#   * The Lua side (core/tls_fingerprint.lua) checks fingerprints.enable and
#     fingerprints.ja4.enable and returns immediately when off, so the hook
#     costs one config lookup on installs that never use JA4.
#   * Every failure path is swallowed (pcall + nil): missing clienthello
#     getters, a missing vendored module or an OpenSSL quirk degrades to "no
#     JA4" and falls back to legacy JA3 / the negotiated-cipher record. It must
#     never fail a TLS handshake.
ssl_client_hello_by_lua_block {
    require("core.tls_fingerprint").hello_phase()
}