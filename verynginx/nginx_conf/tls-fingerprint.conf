# VeryNginx v2 - TLS client fingerprinting (JA4)
#
# Included ONCE inside the http {} block (the installer injects this include;
# see install-lnmp.sh step 1g). JA4 must be computed during the handshake —
# ssl_client_hello_by_lua* is the only context where the raw ClientHello
# exists; nothing in the request phase can see it.
#
# Design notes:
#   * The Lua side (core/tls_fingerprint.lua) checks fingerprints.enable and
#     fingerprints.ja4.enable at runtime and returns immediately when off, so
#     the hook costs a config lookup on installs that never use JA4.
#   * Every failure path is swallowed (pcall + nil): an nginx without the
#     clienthello getters, a missing vendored module or an OpenSSL quirk
#     degrades to "no JA4" and the legacy JA3/cipher fallback. It must never
#     fail a TLS handshake.
#   * ssl_client_hello_by_lua_block is NOT additive — a second one in the same
#     context makes nginx -t fail with "is duplicate". This file is therefore
#     the single source of the directive; do not inline it elsewhere.
ssl_client_hello_by_lua_block {
    require("core.tls_fingerprint").hello_phase()
}