# VeryNginx v2 - real client IP behind Cloudflare (http_realip_module)
#
# Why: without this, every request arriving via Cloudflare is recorded with
# the Cloudflare EDGE ip as its source. WAF hits, ip reputation scores,
# kernel IP blocking and login rate limits would all key on an address
# shared by thousands of real users — misattribution, distorted scoring,
# and a hard ban of an edge IP would cut off every real user behind it.
# Everything downstream reads the corrected remote_addr via core/context.lua.
#
# Security: set_real_ip_from limits the rewrite to TCP peers INSIDE the
# Cloudflare ranges, so a direct connection to the origin cannot spoof
# CF-Connecting-IP. On a box NOT behind Cloudflare this file is a no-op —
# safe to keep. To remove it, delete the include line from nginx.conf
# (do NOT delete this file while it is still included: nginx refuses to
# start on a missing include).
#
# MAINTENANCE: ranges come from the official lists
#     https://www.cloudflare.com/ips-v4
#     https://www.cloudflare.com/ips-v6
# Last verified: 2026-10-13 — re-check quarterly (Cloudflare adjusts rarely).
# This is the ONE place ranges live: lnmp installs and the OpenResty template
# both include this file (installer injects the include idempotently).

# --- Cloudflare IPv4 (official list, verified 2026-10-13) ---
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# --- Cloudflare IPv6 (official list, verified 2026-10-13) ---
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# The client-IP header Cloudflare's edge sets (absent on direct hits, and
# only honoured for the trusted peers above — see security note).
real_ip_header CF-Connecting-IP;
