# VeryNginx v2 - external configuration
# This file should be included outside any block (main context).
# Only directives valid at the main context belong here.
# Lua path directives belong in in_http_block.conf (http context).

# Dynamic upstream for balancer_by_lua
upstream vn_dynamic_upstream {
    server 0.0.0.1;
    balancer_by_lua_block {
        require("plugin.proxy_pass.balancer").run()
    }
    keepalive 128;
}