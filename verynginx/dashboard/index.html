<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VeryNginx v2 管理面板</title>
<!-- Theme bootstrap: sets data-theme from localStorage before first paint so
     dark-theme users don't get a light FOUC. Must precede the stylesheet. -->
<script src="/verynginx/static/theme-init.js"></script>
<!-- Vue 3: vendored local copy with SRI (no CDN fallback - would be blocked by the
     page CSP script-src 'self' and is an unnecessary supply-chain surface) -->
<script src="/verynginx/static/vue.global.prod.js" integrity="sha384-yrrm1s9PCS0I4n39ldjMqQlTorYls89GAS3wXVJooje/BSWnC2vTgky2LIyzRLEo" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/verynginx/static/style.css">
</head>
<body>

<div id="app" v-cloak>
  <transition-group name="toastfx" tag="div" class="toast-stack">
    <div v-for="t in toasts" :key="t.id" class="toast" :class="t.type">
      <span class="toast-msg">{{ t.msg }}</span>
      <button v-if="t.actionLabel" class="toast-action" @click="t.onAction && t.onAction(); dismissToast(t.id)">{{ t.actionLabel }}</button>
      <button class="toast-close" @click="dismissToast(t.id)" title="关闭">×</button>
    </div>
  </transition-group>
  <!-- Login -->
  <div id="login-page" v-if="!store.loggedIn">
    <div class="login-box">
      <h1>VeryNginx</h1>
      <p class="sub">v2.0 — WAF 与反向代理管理</p>
      <div class="error" v-if="sessionExpiredNotice">登录已过期，请重新登录</div>
      <div class="error" v-if="loginError">{{ loginError }}</div>
      <div class="field">
        <label>用户名</label>
        <input v-model.trim="loginUser" type="text" placeholder="管理员用户名" @keyup.enter="doLogin">
      </div>
      <div class="field">
        <label>密码</label>
        <div class="pass-wrap">
          <input v-model="loginPass" :type="loginPassVisible ? 'text' : 'password'" placeholder="输入密码" @keyup.enter="doLogin"
                 @keyup="loginCapsLock = !!(($event.getModifierState) && $event.getModifierState('CapsLock'))"
                 @blur="loginCapsLock = false">
          <button type="button" class="outline small pass-toggle" @click="loginPassVisible = !loginPassVisible">{{ loginPassVisible ? '隐藏' : '显示' }}</button>
        </div>
        <div v-if="loginCapsLock" class="caps-warn">⚠ 大写锁定（Caps Lock）已开启</div>
      </div>
      <button class="primary" :disabled="loading" @click="doLogin">{{ loading ? '登录中…' : '登录' }}</button>
    </div>
  </div>

  <!-- App -->
  <template v-else>
    <div id="topnav">
      <span class="brand">VeryNginx <small>v2{{ versionInfo.commit ? ' · ' + versionInfo.commit.slice(0,8) : '' }}</small></span>
      <nav>
        <a :class="{active:page==='dashboard'}" @click="navigateTo('dashboard')">仪表盘</a>
        <a :class="{active:page==='config'}" @click="navigateTo('config')">配置</a>
        <a :class="{active:page==='waf'}" @click="navigateTo('waf')">WAF</a>
        <a :class="{active:page==='frequency'}" @click="navigateTo('frequency')">频率限制</a>
        <a :class="{active:page==='reputation'}" @click="navigateTo('reputation')">IP 声誉</a>
        <a :class="{active:page==='geoip'}" @click="navigateTo('geoip')">GeoIP</a>
        <a :class="{active:page==='kb'}" @click="navigateTo('kb')">内核封禁</a>
        <a :class="{active:page==='advanced'}" @click="navigateTo('advanced')">高级</a>
        <a :class="{active:page==='about'}" @click="navigateTo('about')">关于</a>
      </nav>
      <div class="user-area">
        <span v-if="lastRefreshLabel" class="refresh-badge" :title="autoRefreshPaused ? '自动刷新已暂停' : '自动刷新运行中'">
          {{ autoRefreshPaused ? '⏸ 刷新已暂停' : lastRefreshLabel }}
          <a style="cursor:pointer;margin-left:6px" @click="toggleAutoRefresh">{{ autoRefreshPaused ? '恢复' : '暂停' }}</a>
        </span>
        <button class="outline small" @click="toggleTheme" :title="theme==='dark'?'切换到浅色模式':'切换到深色模式'" style="padding:4px 8px">
          {{ theme === 'dark' ? '☀' : '🌙' }}
        </button>
        <span>{{ store.user }}</span>
        <button class="outline small" @click="doLogout">退出</button>
      </div>
    </div>

    <div id="main">
      <!-- Dashboard sub-tabs -->
      <div v-if="page==='dashboard'" class="config-tabs" style="margin-bottom:16px">
        <a :class="{active:dashTab==='overview'}" @click="dashTab='overview'">概览</a>
        <a :class="{active:dashTab==='status'}" @click="dashTab='status'">连接</a>
        <a :class="{active:dashTab==='stats'}" @click="dashTab='stats'">统计</a>
      </div>

      <!-- Overview -->
      <div v-if="page==='dashboard' && dashTab==='overview'">
        <h2 class="page-title">系统概览</h2>
        <!-- Top row: connections + upstream -->
        <div class="grid grid-4 mb-16">
          <div class="stat-card">
            <div class="stat-label">活跃连接</div>
            <div class="stat-value" :style="{color: (overview.conn_active||0) > 1000 ? '#ef4444' : ''}">{{ overview.conn_active || 0 }}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">请求/分钟</div>
            <div class="stat-value">{{ formatNumber(overview.req_rate || 0) }}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">上游健康</div>
            <div class="stat-value">
              <span :style="{color: overview.up_healthy === overview.up_total && overview.up_total > 0 ? '#22c55e' : overview.up_healthy > 0 ? '#eab308' : '#ef4444'}">
                {{ overview.up_healthy || 0 }}
              </span>
              <span style="font-size:18px;color:var(--muted)"> / {{ overview.up_total || 0 }}</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-label">WAF 命中/分钟</div>
            <div class="stat-value" :style="{color: (overview.waf_hits||0) > 100 ? '#f97316' : ''}">{{ formatNumber(overview.waf_hits || 0) }}</div>
          </div>
          <div class="stat-card" v-if="overview.flagged !== undefined">
            <div class="stat-label">已标记 IP</div>
            <div class="stat-value" :style="{color: (overview.flagged||0) > 0 ? '#ef4444' : ''}">{{ overview.flagged }}</div>
          </div>
        </div>
        <!-- Second row: memory + errors -->
        <div class="grid grid-3 mb-16">
          <div class="stat-card" v-for="d in overview.dicts || []" :key="d.name">
            <div class="stat-label">共享字典: {{ d.name }}</div>
            <div class="stat-value" style="font-size:20px" :style="{color: d.pct > 80 ? '#ef4444' : d.pct > 60 ? '#eab308' : ''}">{{ d.pct.toFixed(1) }}%</div>
            <div style="font-size:11px;color:var(--muted)">{{ formatBytes(d.used) }} / {{ formatBytes(d.cap) }}</div>
          </div>
        </div>
        <!-- Third row: top URIs + plugin errors -->
        <div class="grid grid-2 mb-16">
          <div class="card">
            <strong>请求最多 URI</strong>
            <table style="font-size:12px;margin-top:8px" v-if="(overview.top_uris || []).length">
              <thead><tr><th>URI</th><th>次数</th><th>流量</th><th>成功率</th></tr></thead>
              <tbody>
                <tr v-for="u in overview.top_uris" :key="u.uri">
                  <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ u.uri }}</td>
                  <td>{{ formatNumber(u.count) }}</td>
                  <td>{{ formatBytes(u.bytes) }}</td>
                  <td><span :class="successClass(u.success_rate)">{{ (u.success_rate || 0).toFixed(1) }}%</span></td>
                </tr>
              </tbody>
            </table>
             <div v-else class="empty">暂无数据</div>
          </div>
          <div class="card">
            <strong>插件性能</strong>
            <table style="font-size:12px;margin-top:8px" v-if="(overview.plugin_perf || []).length">
              <thead><tr><th>插件</th><th>阶段</th><th>平均耗时</th><th>错误</th></tr></thead>
              <tbody>
                 <tr v-for="e in overview.plugin_perf" :key="e.plugin + e.phase">
                   <td>{{ e.plugin }}</td>
                   <td>{{ e.phase }}</td>
                   <td :style="{color: e.avg_ms > 50 ? '#f97316' : ''}">{{ e.avg_ms.toFixed(1) }}ms</td>
                   <td><span :style="{color: e.errors > 0 ? '#ef4444' : ''}">{{ formatNumber(e.errors) }}</span></td>
                </tr>
              </tbody>
            </table>
            <div v-else class="empty">暂无数据</div>
          </div>
        </div>
      </div>

      <!-- Status -->
      <div v-if="page==='dashboard' && dashTab==='status'">
        <h2 class="page-title">连接状态</h2>
        <div class="grid grid-4 mb-16">
          <div class="stat-card"><div class="stat-label">活跃连接</div><div class="stat-value">{{ statusRow.connections_active || 0 }}</div></div>
          <div class="stat-card"><div class="stat-label">读取中</div><div class="stat-value">{{ statusRow.connections_reading || 0 }}</div></div>
          <div class="stat-card"><div class="stat-label">写入中</div><div class="stat-value">{{ statusRow.connections_writing || 0 }}</div></div>
          <div class="stat-card"><div class="stat-label">等待中</div><div class="stat-value">{{ statusRow.connections_waiting || 0 }}</div></div>
        </div>
        <!-- Connection trend chart -->
        <div class="card mb-16" v-if="connHistory.length > 1">
            <strong>连接趋势 (最近 3 分钟)</strong>
          <svg width="100%" height="120" style="margin-top:8px">
            <polyline :points="connLinePoints" fill="none" stroke="#4f8af0" stroke-width="2" />
            <polyline :points="connFillPoints" fill="rgba(79,138,240,0.1)" stroke="none" />
          </svg>
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:2px">
            <span>{{ connHistory.length * 3 }}秒前</span>
            <span>现在</span>
          </div>
        </div>
        <div class="card">
          <div class="flex flex-between mb-8">
            <strong>状态信息</strong>
            <button class="outline small" @click="loadStatus">刷新</button>
          </div>
          <table>
            <tr><th>时间</th><td>{{ formatTime(statusRow.time) }}</td></tr>
            <tr><th>运行状态</th><td><span class="tag tag-ok">在线</span></td></tr>
          </table>
        </div>
      </div>

      <!-- Config -->
      <div v-if="page==='config'">
        <div class="flex flex-between" style="align-items:flex-start">
          <h2 class="page-title" style="margin-bottom:0">配置管理</h2>
          <div class="flex gap-8">
            <button class="outline small" @click="refreshConfig">刷新</button>
            <button class="outline small" @click="exportConfig">导出</button>
            <button class="outline small" @click="importConfig">导入</button>
            <input ref="importFileInput" type="file" accept=".json" style="display:none" @change="onImportFile">
          </div>
        </div>
        <div v-if="configImportError" class="error" style="margin-bottom:8px">{{ configImportError }}</div>
        <div v-if="configImportOk" style="background:#d1fae5;color:#065f46;padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:8px">{{ configImportOk }}</div>
        <div class="config-tabs">
          <a :class="{active:cfgTab==='system'}" @click="cfgTab='system'">系统</a>
          <a :class="{active:cfgTab==='rules'}" @click="cfgTab='rules'">规则</a>
          <a :class="{active:cfgTab==='upstreams'}" @click="cfgTab='upstreams'">上游</a>
          <a :class="{active:cfgTab==='plugins'}" @click="cfgTab='plugins';loadPlugins()">插件</a>
          <span class="tab-sep" title="分组标签：以下为高级配置（匹配器 / 响应模板 / 原始 JSON）">▾ 高级</span>
          <a :class="{active:cfgTab==='matchers'}" @click="cfgTab='matchers'">匹配器</a>
          <a :class="{active:cfgTab==='responses'}" @click="cfgTab='responses'">响应模板</a>
          <a :class="{active:cfgTab==='json'}" @click="cfgTab='json'">原始 JSON</a>
        </div>

        <!-- Matchers -->
        <div class="config-section" v-if="cfgTab==='matchers'">
          <div class="flex flex-between mb-16">
            <h3>匹配器 <small>{{ matcherKeys.length }} 个已定义</small> <small style="color:var(--muted);font-weight:400">定义请求匹配条件</small></h3>
            <button class="primary small" @click="editMatcher(null)">+ 添加</button>
          </div>
          <table v-if="matcherKeys.length">
             <thead><tr><th>名称</th><th>条件</th><th></th></tr></thead>
            <tbody>
              <tr v-for="name in matcherKeys" :key="name">
                <td><strong>{{ name }}</strong></td>
                <td><span class="json-inline">{{ JSON.stringify(cfg.matcher[name]) }}</span></td>
                <td class="actions">
                  <button class="outline small" @click="editMatcher(name)">编辑</button>
                  <button class="danger small" @click="deleteMatcher(name)">删除</button>
                </td>
              </tr>
            </tbody>
          </table>
          <div v-else class="empty">
            <div>未定义匹配器。</div>
            <button class="primary small" style="margin-top:8px" @click="editMatcher()">+ 创建第一个匹配器</button>
            <div style="font-size:12px;color:var(--muted);margin-top:10px;max-width:560px;margin-left:auto;margin-right:auto;line-height:1.7">
              匹配器是<strong>命名的可复用匹配条件集</strong>（URI / IP / Header / User-Agent 等），
              存于 <span class="json-inline">config.matcher.*</span>。<br>
              定义后可在「规则组」与「响应模板」里按名称引用，条件变更只需改一处。
              WAF 面板的规则使用独立的内联匹配器，与此处互不影响。
            </div>
          </div>
        </div>

        <!-- Rules -->
        <div class="config-section" v-if="cfgTab==='rules'">
          <h3>规则组</h3>
          <div class="empty" v-if="!cfg.rule || Object.keys(cfg.rule).length === 0">
            <div>暂无通用规则组。</div>
            <div style="font-size:12px;color:var(--muted);margin-top:8px;max-width:560px;margin-left:auto;margin-right:auto;line-height:1.7">
              这里管理 <span class="json-inline">config.rule.*</span> 通用「匹配器 → 动作」规则组，
              由 static_file、proxy_pass 等通用插件消费。<br>
              WAF 攻击防护请使用 <a style="cursor:pointer;text-decoration:underline" @click="navigateTo('waf')">WAF 面板</a>，
              请求限速请使用 <a style="cursor:pointer;text-decoration:underline" @click="navigateTo('frequency')">频率限制面板</a>。
            </div>
          </div>
          <div v-for="(rules, group) in cfg.rule || {}" :key="group" class="card" style="padding:16px">
            <div class="flex flex-between mb-8">
              <strong style="font-size:14px">{{ group }}</strong>
              <div class="flex gap-4">
                 <span class="tag tag-ok" v-if="rules && rules.length">{{ rules.length }} 条规则</span>
                 <span class="tag tag-warn" v-else>空</span>
                 <button class="primary small" @click="ruleOpenCreate(group)">+ 添加</button>
              </div>
            </div>
            <table v-if="rules && rules.length" style="font-size:13px">
               <thead><tr><th>#</th><th>启用</th><th>匹配器</th><th>动作</th><th>详情</th><th></th></tr></thead>
              <tbody>
                <tr v-for="(r,i) in rules" :key="i">
                  <td>{{ i }}</td>
                  <td><input type="checkbox" :checked="r.enable!==false" @change="ruleToggle(r, group, i)"></td>
                   <td>{{ typeof r.matcher === 'string' ? r.matcher : '(内联)' }}</td>
                   <td><span class="tag" :class="actionClass(r.action)">{{ r.action }}</span></td>
                   <td><span class="json-inline">{{ summarizeRule(r) }}</span></td>
                   <td class="actions">
                     <button class="outline small" @click="ruleOpenEdit(r, group, i)">编辑</button>
                     <button class="danger small" @click="ruleDelete(r, group, i)">删除</button>
                   </td>
                </tr>
              </tbody>
            </table>
            <div v-else class="empty">此组中无规则。</div>
          </div>
        </div>

        <!-- Upstreams -->
        <div class="config-section" v-if="cfgTab==='upstreams'">
          <h3>后端上游服务器</h3>
          <div v-for="(up, name) in cfg.backend_upstream || {}" :key="name" class="card" style="padding:16px">
            <strong>{{ name }}</strong>
            <table style="font-size:13px;margin-top:8px">
               <thead><tr><th>健康</th><th>主机</th><th>端口</th><th>权重</th><th>信息</th></tr></thead>
              <tbody>
                <tr v-for="(node,ni) in up.nodes || []" :key="ni">
                  <td>
                    <span v-if="!healthData[name] || !healthData[name][ni]" class="dot gray" title="unknown"></span>
                    <span v-else-if="healthData[name][ni].circuit_open" class="dot orange" title="circuit open"></span>
                    <span v-else-if="!healthData[name][ni].healthy" class="dot red" :title="healthData[name][ni].last_error || 'unhealthy'"></span>
                    <span v-else-if="healthData[name][ni].failures > 0" class="dot yellow" :title="healthData[name][ni].failures + ' failure(s)'"></span>
                    <span v-else class="dot green" title="healthy"></span>
                  </td>
                  <td>{{ node.host }}</td><td>{{ node.port }}</td><td>{{ node.weight || 1 }}</td>
                  <td style="font-size:11px;color:var(--muted)">
                    <template v-if="healthData[name] && healthData[name][ni]">
                       <span v-if="healthData[name][ni].circuit_open">熔断开启</span>
                       <span v-else-if="!healthData[name][ni].healthy">{{ healthData[name][ni].last_error || '下线' }}</span>
                       <span v-else-if="healthData[name][ni].failures > 0">{{ healthData[name][ni].failures }} 次失败</span>
                       <span v-else>正常</span>
                    </template>
                    <span v-else>---</span>
                  </td>
                </tr>
              </tbody>
            </table>
            <div style="font-size:12px;color:var(--muted);margin-top:4px">
              HC: {{ up.health_check?.path || 'none' }} &middot;
              TLS: {{ up.tls?.enable ? 'yes' : 'no' }} &middot;
              Method: {{ up.method || 'round_robin' }}
            </div>
          </div>
          <div v-if="!cfg.backend_upstream || !Object.keys(cfg.backend_upstream).length" class="empty">未定义上游。</div>
        </div>

        <!-- Responses -->
        <div class="config-section" v-if="cfgTab==='responses'">
          <h3>响应模板</h3>
          <table v-if="respKeys.length">
             <thead><tr><th>名称</th><th>Content-Type</th><th>内容</th></tr></thead>
            <tbody>
              <tr v-for="name in respKeys" :key="name">
                <td><strong>{{ name }}</strong></td>
                <td>{{ cfg.response[name].content_type }}</td>
                <td><span class="json-inline">{{ cfg.response[name].body }}</span></td>
              </tr>
            </tbody>
          </table>
          <div v-else class="empty">没有响应模板。</div>
        </div>

        <!-- Plugins -->
        <div class="config-section" v-if="cfgTab==='plugins'">
          <div class="flex flex-between mb-8">
            <h3>插件设置 <small>启用或停用插件</small></h3>
            <button class="outline small" @click="loadPlugins">刷新</button>
          </div>
          <div v-if="pluginsError" class="error" style="margin-bottom:8px">{{ pluginsError }}</div>
          <table>
             <thead><tr><th>插件</th><th>启用</th><th>优先级</th><th>关键</th><th>说明</th></tr></thead>
            <tbody>
              <tr v-for="p in plugins" :key="p.name">
                <td><strong>{{ p.name }}</strong></td>
                <td><input type="checkbox" :checked="p.enable" :disabled="pluginBusy.has(p.name)" @change="togglePlugin(p)"></td>
                <td>{{ p.priority }}</td>
                <td>{{ p.critical ? '✓' : '✗' }}</td>
                <td style="font-size:12px;color:var(--muted)">{{ p.description }}</td>
              </tr>
            </tbody>
          </table>
          <div v-if="!plugins.length" class="empty">没有注册插件。</div>
        </div>

        <!-- System -->
        <div class="config-section" v-if="cfgTab==='system'">
          <h3>系统设置</h3>
          <table>
            <tbody>
              <tr><td>base_uri</td><td>{{ cfg.base_uri }}</td></tr>
              <tr><td>cookie_prefix</td><td>{{ cfg.cookie_prefix }}</td></tr>
              <tr><td>auth_strategy</td><td>{{ cfg.auth_strategy }}</td></tr>
              <tr><td>body.max_size</td><td>{{ cfg.body?.max_size || '-' }}</td></tr>
              <tr><td>body.on_error</td><td>{{ cfg.body?.on_error || '-' }}</td></tr>
              <tr><td>proxy.health_check_interval</td><td>{{ cfg.proxy?.health_check_interval || '-' }}s</td></tr>
            </tbody>
          </table>
          <h3 style="margin-top:16px">管理员用户</h3>
          <table>
            <thead><tr><th>用户</th><th>启用</th><th>密码</th></tr></thead>
            <tbody>
              <tr v-for="(a,i) in cfg.admin || []" :key="i">
                <td>{{ a.user }}</td>
                 <td>{{ a.enable ? '✓' : '✗' }}</td>
                 <td><span class="json-inline">{{ a.password_hash ? '(已设置)' : '(未设置)' }}</span></td>
              </tr>
            </tbody>
          </table>
          <h3 style="margin-top:16px">共享字典内存 <small>{{ dictUsage.length }} 个字典</small></h3>
          <div v-if="dictUsage.length">
            <div v-for="d in dictUsage" :key="d.name" style="margin-bottom:10px">
              <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px">
                <span>{{ d.name }}</span>
                <span :style="{color: d.pct > 80 ? '#ef4444' : d.pct > 60 ? '#eab308' : 'var(--muted)'}">
                  {{ formatBytes(d.used) }} / {{ formatBytes(d.cap) }} ({{ d.pct.toFixed(1) }}%)
                </span>
              </div>
              <div style="height:6px;background:var(--bg);border-radius:3px;overflow:hidden">
                <div :style="{
                  width: d.pct + '%',
                  height:'100%',
                  borderRadius:'3px',

            </select>

        </div>
        <div v-if="statsError" class="error" style="margin-bottom:8px">{{ statsError }}</div>

            <table>
               <thead><tr><th style="width:24px"></th><th>URI</th><th>次数</th><th>大小</th><th>平均大小</th><th>成功率</th><th>耗时</th><th>平均耗时</th></tr></thead>
              <tbody>
                <template v-for="(v,key) in statsData || {}" :key="key">

                    <td>{{ formatBytes(v.bytes) }}</td>
                    <td>{{ v.count ? formatBytes(v.bytes / v.count) : '-' }}</td>
                    <td><span class="tag" :class="successClass(v)">{{ calcSuccess(v) }}%</span></td>
                    <td>{{ v.time != null ? v.time.toFixed(2) : '-' }}s</td>
                    <td>{{ v.count ? (v.time / v.count).toFixed(3) : '-' }}s</td>
                  </tr>
                  <tr v-if="expandedUri === key">
                    <td colspan="8" style="padding:4px 16px 12px 36px">

                        <span v-if="!v.status || !Object.keys(v.status).length" style="color:var(--muted)">无状态数据</span>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

<!-- Analytics Panel -->

 <tbody>

                  <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="h.uri">{{ h.uri }}</td>
                  <td><code style="font-size:11px">{{ h.ip }}</code></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div v-if="!wafHits.length" class="empty">无最近命中</div>

        </div>

        <!-- History -->
        <div v-if="wafTab==='history'">
          <div v-if="wafHistError" class="error" style="margin-bottom:8px">{{ wafHistError }}</div>
          <div v-if="wafPendingError" class="error" style="margin-bottom:8px">{{ wafPendingError }}</div>

          <div v-if="wafPendingChanges.length" class="card" style="padding:16px;margin-bottom:16px;border-color:#f59e0b">
             <h4 style="font-size:14px;margin-bottom:8px;color:#92400e">⏳ 待确认变更 ({{ wafPendingChanges.length }})</h4>
             <table style="font-size:13px">
               <thead><tr><th>规则 ID</th><th>暂存时间</th><th>动作</th><th></th></tr></thead>
              <tbody>
                <tr v-for="p in wafPendingChanges" :key="p.rule_id">
                  <td><code>{{ p.rule_id }}</code></td>
                  <td style="color:#6b7280">{{ new Date(p.staged_at * 1000).toLocaleString() }}</td>
                  <td>
                    <span class="tag" style="background:#fef3c7;color:#92400e">{{ p.proposed.action || 'edit' }}</span>
                  </td>
                  <td>
                    <button class="primary small" :disabled="pendingActionLoading" @click="confirmPendingChange(p.rule_id)"><span v-if="pendingActionLoading" class="spinner"></span>发布</button>
                    <button class="outline small" style="margin-left:4px" @click="discardPendingChange(p.rule_id)">丢弃</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <!-- History -->
          <div v-if="wafHistory.length">
            <table>
               <thead><tr><th>版本</th><th>时间戳</th><th>动作</th><th>规则数</th><th></th></tr></thead>
              <tbody>
                <tr v-for="h in wafHistory" :key="h.version">
                  <td>{{ h.version }}</td>
                  <td style="white-space:nowrap">{{ h.timestamp }}</td>
                  <td><span class="tag">{{ h.action }}</span></td>
                  <td>{{ h.rule_count }}</td>
                   <td><button class="outline small" @click="wafRollback(h.version)" :disabled="wafRolling">回滚</button></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div v-else style="color:var(--muted)">无可用历史。</div>
        </div>

        <!-- Recommendations -->
        <div v-if="wafTab==='rules' && wafRuleView==='recs'">
          <div class="flex flex-between mb-16">
            <h3 style="font-size:14px;margin:0">规则推荐
              <span class="tag tag-ok" v-if="recStats" style="vertical-align:middle">{{ recStats.pending }} 条待处理</span>
            </h3>
            <button class="primary small" @click="runRecAnalysis" :disabled="recLoading">{{ recLoading ? '分析中...' : '分析流量' }}</button>
          </div>
          <div v-if="recError" class="error" style="margin-bottom:8px">{{ recError }}</div>
          <div v-if="recs.length === 0" class="empty">暂无推荐。点击"分析流量"扫描最近被拦截的命中。</div>

             <thead><tr><th>模式</th><th>分类</th><th>严重级别</th><th>动作</th><th>命中</th><th>状态</th><th></th></tr></thead>
            <tbody>
              <tr v-for="r in recs" :key="r.id">
                <td><code style="font-size:11px">{{ r.pattern }}</code></td>

                <td>{{ r.action }}</td>
                <td>{{ r.hit_count }}</td>
                <td>{{ r.status }}</td>
                <td>
                  <button v-if="r.status === 'pending'" class="primary small" :disabled="recActionLoading" @click="applyRec(r.id)" style="margin-right:4px"><span v-if="recActionLoading" class="spinner"></span>应用</button>
                  <button v-if="r.status === 'pending'" class="outline small" :disabled="recActionLoading" @click="dismissRec(r.id)">忽略</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div v-if="wafTab==='tester'">
          <div class="card">
             <h3 style="font-size:14px;margin-bottom:8px">测试规则</h3>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
              <label style="font-size:13px;color:var(--muted)">模式</label>
              <select v-model="wafTestMode" @change="wafTestModeChanged()" style="width:auto">
                <option value="form">表单</option>
                <option value="raw">JSON</option>
              </select>
              <select v-model="wafTestPresetRuleId" @change="wafTestLoadPreset" style="width:auto;max-width:280px">
                <option value="">从现有规则载入…</option>
                <option v-for="r in wafRulesTbl.rows" :key="r.id" :value="r.id">{{ r.name || r.id }}</option>
              </select>
            </div>
            <template v-if="wafTestMode==='form'">
              <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px">
                <div class="field" style="margin:0"><label>匹配字段</label>
                  <select v-model="wafTestRuleForm.field" style="width:auto">
                    <option v-for="f in ['URI','IP','UA','Host','Referer','Header','Cookie','Args','Method']" :key="f" :value="f">{{ f }}</option>
                  </select></div>
                <div class="field" style="margin:0"><label>操作符</label>
                  <select v-model="wafTestRuleForm.operator" style="width:auto">
                    <option value="≈">≈ 正则匹配</option>
                    <option value="=">= 精确等于</option>
                    <option value="!≈">!≈ 正则不匹配</option>
                  </select></div>
                <div class="field" style="margin:0;flex:1;min-width:200px"><label>匹配值</label>
                  <input v-model="wafTestRuleForm.value" type="text" placeholder='如 /api/* 或 \.\./'></div>
                <div class="field" style="margin:0"><label>动作</label>
                  <select v-model="wafTestRuleForm.action" style="width:auto">
                    <option value="block">阻止</option>
                    <option value="accept">放行</option>
                    <option value="log">记录</option>
                    <option value="challenge">质询</option>
                  </select></div>
              </div>
              <div class="field">
                <label>测试用例（每行一条请求，勾选 = 预期被匹配）</label>
                <table style="font-size:12px">
                  <thead><tr><th style="width:110px">名称(可空)</th><th>URI</th><th style="width:90px">方法</th><th style="width:130px">IP(可空)</th><th>UA(可空, 可选预设)</th><th style="width:70px">预期命中</th><th style="width:36px"></th></tr></thead>
                  <tbody>
                    <tr v-for="(row, ci) in wafTestCaseRows" :key="ci">
                      <td><input v-model="row.name" type="text" style="width:100%"></td>
                      <td><input v-model="row.uri" type="text" style="width:100%" placeholder="/api/users?id=1"></td>
                      <td><select v-model="row.method" style="width:100%"><option v-for="m in ['GET','POST','PUT','DELETE','HEAD']" :key="m">{{ m }}</option></select></td>
                      <td><input v-model="row.ip" type="text" style="width:100%" placeholder="1.2.3.4"></td>
                      <td><input v-model="row.ua" type="text" style="width:100%" list="vnUaPresets" placeholder="留空=Mozilla/5.0"></td>
                      <td style="text-align:center"><input type="checkbox" v-model="row.expected"></td>
                      <td><button class="outline small" @click="removeWafTestCaseRow(ci)" title="删除此行">×</button></td>
                    </tr>
                  </tbody>
                </table>
                <button class="outline small" style="margin-top:6px" @click="addWafTestCaseRow">+ 添加用例</button>
              </div>
              <datalist id="vnUaPresets">
                <option value="curl/8.5.0"></option>
                <option value="sqlmap/1.8#stable (http://sqlmap.org)"></option>
                <option value="python-requests/2.31.0"></option>
                <option value="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36"></option>
                <option value=""></option>
              </datalist>
            </template>
            <template v-else>
             <div class="field">
               <label>规则 (JSON)</label>
              <textarea v-model="wafTestRuleJson" spellcheck="false" class="code-editor" style="min-height:100px" placeholder='{"matcher":{"URI":{"operator":"≈","value":"/api/*"}},"action":"block"}'></textarea>
            </div>
             <div class="field">
               <label>测试用例 (JSON 数组)</label>
              <textarea v-model="wafTestCasesJson" spellcheck="false" class="code-editor" style="min-height:120px" placeholder='[{"name":"normal","uri":"/api/users","expected":false},{"name":"attack","uri":"/api/../../etc","expected":true}]'></textarea>
            </div>
            </template>
            <div class="error" v-if="wafTestError" style="margin-bottom:8px">{{ wafTestError }}</div>
             <button class="primary small" :disabled="wafTesting" @click="wafRunTest">{{ wafTesting ? '测试中…' : '运行测试' }}</button>
          </div>
           <div v-if="wafTestResults" class="card mt-16">
             <h3 style="font-size:14px;margin-bottom:8px">结果: {{ wafTestResults.passed }}/{{ wafTestResults.total }} 通过</h3>
             <table>
               <thead><tr><th>名称</th><th>URI</th><th>匹配</th><th>通过</th></tr></thead>
              <tbody>
                <tr v-for="(res, ri) in wafTestResults.results" :key="ri" :style="{color:res.passed?'var(--green)':'var(--red)'}">
                  <td>{{ res.name }}</td>
                  <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis">{{ res.uri }}</td>
                  <td>{{ res.matched ? '✓' : '✗' }}</td>
                  <td>{{ res.passed ? '✓' : '✗' }}</td>
                </tr>
              </tbody>
            </table>
          </div>
           <!-- Test History -->
           <div v-if="wafTestHistoryError" class="error" style="margin-bottom:8px">{{ wafTestHistoryError }}</div>
           <div v-if="wafTestHistory.length" class="card mt-16">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
              <h3 style="font-size:14px">测试历史 ({{ wafTestHistory.length }})</h3>
              <button class="outline small" @click="clearTestHistory">清除</button>
            </div>
            <table>
              <thead><tr><th>时间</th><th>规则</th><th>通过/总数</th><th></th></tr></thead>
              <tbody>
                <tr v-for="(h, i) in wafTestHistory" :key="i">
                  <td style="font-size:12px;color:#6b7280;white-space:nowrap">{{ new Date(h.timestamp * 1000).toLocaleString() }}</td>
                  <td>{{ h.rule_name }}</td>
                  <td>
                    <span :style="{color:h.failed===0?'#16a34a':'#f59e0b'}">{{ h.passed }}/{{ h.total }}</span>
                  </td>
                  <td>
                    <button class="outline small" style="font-size:11px" @click="wafTestRuleJson = JSON.stringify(h.results[0] && h.results[0]._rule || {}, null, 2)">载入规则</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
       </div>

      <!-- Frequency Limit -->
      <div v-if="page==='frequency'">
        <div class="flex flex-between mb-16">
          <h2 class="page-title" style="margin-bottom:0">频率限制</h2>
          <div class="flex gap-8">
            <button class="outline small" @click="loadFrequencyData">刷新</button>
            <button class="primary small" @click="openFreqRuleCreate">+ 新建规则</button>
          </div>
        </div>

        <!-- Load Error Banner -->
        <div v-if="freqError" class="error">
          <span>{{ freqError }}</span>
          <button class="outline small" style="margin-left:12px" @click="loadFrequencyData">重试</button>
        </div>

        <!-- Active Counters -->
        <div class="card" style="padding:16px;margin-bottom:16px">
          <h3 style="font-size:14px;margin-bottom:8px">当前活跃计数 (前 50)</h3>
          <div v-if="freqStats.length">
            <table>
               <thead><tr><th>键</th><th>计数</th></tr></thead>
              <tbody>
                <tr v-for="s in freqStats.slice(0, 50)" :key="s.key">
                  <td><code style="font-size:11px">{{ s.key }}</code></td>
                  <td>{{ s.count }}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div v-else class="empty">无活跃计数。</div>
        </div>

        <!-- Template Gallery -->
        <div class="card" style="padding:16px;margin-bottom:16px">
          <h3 style="font-size:14px;margin-bottom:8px">场景模板</h3>
          <div v-if="freqTemplates.length" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px">
            <div v-for="t in freqTemplates" :key="t.name" style="border:1px solid var(--border);border-radius:8px;padding:12px">
              <div style="font-weight:600;font-size:13px;margin-bottom:4px">{{ t.label }}</div>
              <div style="font-size:12px;color:var(--muted);margin-bottom:8px;min-height:32px">{{ t.description }}</div>
              <button class="primary small" style="width:100%" @click="previewFreqTemplate(t.name)">使用模板</button>
            </div>
          </div>
          <div v-else-if="freqTemplatesLoaded" class="empty">无可用模板。</div>
          <div v-else class="empty">加载模板中...</div>
        </div>

        <!-- Rules -->
        <div class="card" style="padding:16px">
          <h3 style="font-size:14px;margin-bottom:8px">限流规则</h3>
          <div v-if="freqRules.length">
            <table>
               <thead><tr><th>ID</th><th>键</th><th>限制</th><th>窗口</th><th>动作</th><th>启用</th><th></th></tr></thead>
              <tbody>
                <tr v-for="r in freqRules" :key="r.id">
                  <td><code style="font-size:11px">{{ r.id }}</code></td>
                  <td>{{ r.key || 'ip' }}</td>
                  <td>{{ r.limit }}</td>
                  <td>{{ r.window }}s</td>
                  <td><span class="tag">{{ r.code || 429 }}</span></td>
                  <td><span class="tag" :class="r.enable !== false ? 'tag-ok' : 'tag-warn'">{{ r.enable !== false ? '启用' : '禁用' }}</span></td>
                   <td class="flex gap-4" style="justify-content:flex-end">
                     <button class="outline small" @click="openFreqRuleEdit(r)">编辑</button>
                     <button class="outline small" @click="deleteFreqRule(r)">删除</button>
                   </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div v-else class="empty">
            <div>未配置频率限制规则。</div>
            <div style="margin-top:8px">
              <button class="primary small" @click="openFreqRuleCreate()">+ 手动新建</button>
              <span style="font-size:12px;color:var(--muted);margin-left:8px">或使用上方模板库一键套用登录防爆破 / API 限流等场景</span>
            </div>
          </div>
        </div>

             <div class="field"><label>键维度</label>
              <select v-model="freqTemplateModal.key" style="width:100%">
                <option value="ip">IP</option>
                <option value="uri">URI</option>
                <option value="user">用户名</option>
                <option value="host">域名</option>
              </select>
            </div>
            <div class="grid grid-2 mb-8">
               <div class="field"><label>限制 (最大命中)</label><input v-model.number="freqTemplateModal.limit" type="number" min="1"></div>
               <div class="field"><label>窗口 (秒)</label><input v-model.number="freqTemplateModal.window" type="number" min="1"></div>
            </div>
            <div class="grid grid-2 mb-8">
               <div class="field"><label>阻止代码</label><input v-model.number="freqTemplateModal.code" type="number" min="100" max="599"></div>
               <div class="field"><label>匹配器 JSON (可选)</label><input v-model="freqTemplateModal.matcherJson"></div>
            </div>
            <div class="modal-actions">
             <button class="outline" @click="freqTemplateModal.show=false">取消</button>
             <button class="primary" @click="applyFreqTemplate">应用</button>
            </div>
          </div>
        </div>

        <!-- Create Rule Modal -->
        <div class="modal-overlay" v-if="freqRuleModal.show" @click.self="freqRuleModal.show=false">
          <div class="modal">
             <h3>{{ freqRuleModal.mode === 'create' ? '创建频率规则' : '编辑频率规则' }}</h3>
            <div class="field"><label>规则 ID</label><input v-model="freqRuleModal.id" placeholder="freq_login" :disabled="freqRuleModal.mode !== 'create'"></div>
             <div class="field"><label>键维度</label>
              <select v-model="freqRuleModal.key" style="width:100%">
                <option value="ip">IP</option>
                <option value="uri">URI</option>
                <option value="user">用户名</option>
                <option value="host">域名</option>
              </select>
            </div>
            <div class="grid grid-2 mb-8">
               <div class="field"><label>限制 (最大命中)</label><input v-model.number="freqRuleModal.limit" type="number" min="1" placeholder="60"></div>
               <div class="field"><label>窗口 (秒)</label><input v-model.number="freqRuleModal.window" type="number" min="1" placeholder="60"></div>
            </div>
<div class="grid grid-2 mb-8">
                <div class="field"><label>阻止代码</label><input v-model.number="freqRuleModal.code" type="number" min="100" max="599" placeholder="429"></div>

             <div style="font-size:11px;color:var(--muted);margin-top:-8px;margin-bottom:8px">留空匹配所有请求；内联格式见占位符，或引用已有匹配器名。</div>

             <div class="field" style="margin-bottom:0">

             </div>
            <div class="modal-actions">
             <button class="outline" @click="freqRuleModal.show=false">取消</button>
             <button class="primary" :disabled="freqRuleSaving" @click="saveFreqRule"><span v-if="freqRuleSaving" class="spinner"></span>保存</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Reputation -->
      <div v-if="page==='reputation'">
        <div class="flex flex-between mb-16">
          <h2 class="page-title" style="margin-bottom:0">IP 声誉</h2>
          <div class="flex gap-8">
            <button class="outline small" @click="loadRepData">刷新</button>
            <button class="outline small" @click="repPersist">立即持久化</button>

          <div class="stat-card"><div class="stat-label">今日标记</div><div class="stat-value">{{ repStats.flagged_today }}</div></div>
          <div class="stat-card"><div class="stat-label">白名单</div><div class="stat-value">{{ repWhitelist.length }}</div></div>
        </div>
        <!-- Flagged IPs -->
        <div class="card mb-16">
          <div class="flex flex-between mb-8">
             <strong>已标记 IP</strong>
          </div>
          <div style="overflow-x:auto">
            <table>
               <thead><tr><th>IP</th><th>标记时间</th><th>过期时间</th><th>剩余</th><th></th></tr></thead>
<tbody>
                <tr v-for="ip in repFlagged" :key="ip.ip">
                  <td><code>{{ ip.ip }}</code></td>
                  <td>{{ fmtTime(ip.flagged_at) }}</td>
                  <td>{{ fmtTime(ip.expires_at) }}</td>
                  <td>{{ remaining(ip.expires_at) }}</td>
                   <td><button class="danger small" @click="repClear(ip.ip)" :disabled="repClearBusy[ip.ip]">清除</button></td>

               </tbody>
            </table>
          </div>
          <div v-if="!repFlagged.length" class="empty">无已标记 IP。</div>

        <!-- Whitelist -->

               <input v-model="repNewWhitelist" placeholder="IP 或 CIDR" style="width:180px;font-size:13px" @keyup.enter="repAddWhitelist">
               <button class="primary small" @click="repAddWhitelist" :disabled="!repNewWhitelist">添加</button>
             </div>
          </div>
          <div style="overflow-x:auto">
            <table>
               <thead><tr><th>条目</th><th></th></tr></thead>
              <tbody>
                <tr v-for="e in repWhitelist" :key="e">
                  <td><code>{{ e }}</code></td>
                   <td><button class="danger small" @click="repRemoveWhitelist(e)">移除</button></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div v-if="!repWhitelist.length" class="empty">无白名单条目。</div>
        </div>

               <button class="primary small" @click="repLookup" :disabled="!repLookupIP">查询</button>
             </div>
          </div>
          <div v-if="repLookupResult" style="font-size:13px">

             <option value="manual">手动</option>
           </select>
           <select v-if="kbTab==='candidates'" v-model="kbFilterState" @change="kbReloadList" style="width:160px">

             <option value="rejected">已拒绝</option>

             <option value="degraded">已降级</option>

             <thead><tr>
               <th class="sortable" @click="kbEntriesTbl.sortBy('ip')">IP <span v-if="kbEntriesTbl.state.sortKey==='ip'" class="sort-ind">{{ kbEntriesTbl.state.sortDir===1?'▲':'▼' }}</span></th>
               <th class="sortable" @click="kbEntriesTbl.sortBy('list')">集合 <span v-if="kbEntriesTbl.state.sortKey==='list'" class="sort-ind">{{ kbEntriesTbl.state.sortDir===1?'▲':'▼' }}</span></th>
               <th>协议族</th><th>来源</th><th>模式</th>
               <th class="sortable" @click="kbEntriesTbl.sortBy('installed_at')">已安装 <span v-if="kbEntriesTbl.state.sortKey==='installed_at'" class="sort-ind">{{ kbEntriesTbl.state.sortDir===1?'▲':'▼' }}</span></th>

<!-- Timeline -->

                  <tbody>
                    <tr v-for="(e, i) in kbDiff.missing_in_kernel" :key="'m'+i">

                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

             <option value="high">高</option>
             <option value="medium">中</option>
             <option value="low">低</option>
           </select>
        </div>
      </div>
      <div class="grid-2 mb-8">
        <div class="field">
           <label>动作 *</label>
           <select v-model="wafEditModal.action" style="width:100%">
             <option value="block">阻止</option>
             <option value="accept">放行</option>
             <option value="log">记录</option>
             <option value="challenge">质询</option>
           </select>
        </div>
        <div class="field">
           <label>状态码</label>
           <input v-model.number="wafEditModal.code" type="number" placeholder="403" min="200" max="599">
        </div>
      </div>
      <div class="field">
         <label>匹配器 (JSON) *</label>
        <textarea v-model="wafEditModal.matcherJson" spellcheck="false" class="code-editor" style="min-height:100px" placeholder='{"URI":{"operator":"≈","value":"\\(\\.\\./\"}}'></textarea>
      </div>
      <div class="field">
         <label>标签 (逗号分隔)</label>
         <input v-model="wafEditModal.tagsStr" type="text" placeholder="sqli, union, injection">
      </div>
      <div class="field">
         <label><input type="checkbox" v-model="wafEditModal.rateLimitEnabled"> 速率限制</label>
         <div v-if="wafEditModal.rateLimitEnabled" class="grid-3 mb-8">
           <div class="field"><label>最大命中</label><input v-model.number="wafEditModal.rateLimitMax" type="number" min="1"></div>
           <div class="field"><label>窗口 (秒)</label><input v-model.number="wafEditModal.rateLimitWindow" type="number" min="1"></div>
           <div class="field"><label>动作</label><select v-model="wafEditModal.rateLimitAction" style="width:100%"><option value="log">记录</option><option value="block">阻止</option></select></div>
         </div>
      </div>
      <div class="error" v-if="wafEditError" style="margin-bottom:8px">{{ wafEditError }}</div>
      <div v-if="wafEditModal.mode === 'edit' && wafDiffLines.length" style="margin-bottom:8px; border:1px solid #e0e3eb; border-radius:6px; overflow:hidden">
        <div style="background:#f9fafb;padding:6px 12px;font-size:12px;font-weight:600;color:#374151;border-bottom:1px solid #e0e3eb">变更预览</div>
        <div style="max-height:200px;overflow-y:auto;font-family:ui-monospace,monospace;font-size:12px;background:#fff">
          <div v-for="(d,i) in wafDiffLines" :key="i" :style="{background:d.type==='added'?'#f0fdf4':'#fef2f2',color:d.type==='added'?'#166534':'#991b1b',padding:'2px 12px',whiteSpace:'pre-wrap',wordBreak:'break-all'}">
            {{ d.type === 'added' ? '+' : '-' }} {{ d.text }}
          </div>
        </div>
      </div>
       <div class="modal-actions">
         <button class="outline" @click="wafEditModal.show=false">取消</button>
         <button class="primary" :disabled="wafSaving" @click="wafSaveRule">{{ wafSaving ? '保存中…' : '保存' }}</button>
       </div>
    </div>
  </div>

  <!-- Fingerprint Add Modal -->
  <div class="modal-overlay" v-if="fpEditModal.show" @click.self="fpEditModal.show=false">
    <div class="modal" style="max-width:480px">
      <h3>添加 TLS 指纹</h3>
      <div style="font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:12px;padding:10px 12px;background:var(--bg);border-radius:6px">
        <strong>什么是 JA3 指纹：</strong>对 TLS ClientHello 握手要素（版本/密码套件/扩展/椭圆曲线）取 MD5
        得到的 32 位十六进制串。同一客户端程序的 JA3 通常稳定，可在不依赖 User-Agent（易伪造）的情况下识别工具。
        <br><strong>如何获取：</strong>
        ① WAF → 命中记录 → 打开命中详情，直接复制其中的「TLS 指纹」字段（最常用，针对真实来访工具）；
        ② 查公开库 ja3er.com / abuse.ch（curl、python-requests、各类扫描器的现成 hash）；
        ③ Wireshark 抓 ClientHello（过滤 tls.handshake.type == 1）后用 salesforce/ja3 的 ja3.py 计算。
        <br><strong>建议：</strong>新指纹先用「挑战」观察确认无误拦，再升级为「拦截」。
      </div>
      <div class="field">
        <label>指纹哈希 *（JA3 MD5，32 位十六进制）</label>
        <input v-model="fpEditModal.hash" type="text" placeholder="如 e7d705a3286e19ea42f587b344ee6865">
      </div>
      <div class="field">
        <label>名称 *</label>
        <input v-model="fpEditModal.name" type="text" placeholder="指纹名称/说明">
      </div>
      <div class="grid-2 mb-8">
        <div class="field">
          <label>分类</label>
          <select v-model="fpEditModal.category" style="width:100%">
            <option value="scanner">扫描器</option>
            <option value="bot">机器人</option>
            <option value="browser">浏览器</option>
            <option value="custom">自定义</option>
          </select>
        </div>
        <div class="field">
          <label>动作</label>
          <select v-model="fpEditModal.action" style="width:100%">
            <option value="block">拦截</option>
            <option value="challenge">挑战</option>
            <option value="log">仅记录</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="outline" @click="fpEditModal.show=false">取消</button>
        <button class="primary" :disabled="fpSaving" @click="saveFpAdd"><span v-if="fpSaving" class="spinner"></span>保存</button>
      </div>
    </div>
  </div>

  <!-- Matcher Editor Modal -->
  <div class="modal-overlay" v-if="editMatcherModal.show" @click.self="editMatcherModal.show=false">
    <div class="modal">
       <h3>{{ editMatcherModal._origName ? '编辑匹配器' : '添加匹配器' }}</h3>
      <div class="field">
         <label>名称</label>
         <input v-model="editMatcherModal.name" type="text" placeholder="匹配器名称">
      </div>
      <div class="field">
         <label>条件 (JSON, 例如 {"URI":{"operator":"≈","value":"/api/*"}})</label>
        <textarea id="matcher-json" v-model="editMatcherModal.conditions" spellcheck="false" class="code-editor" style="min-height:120px"></textarea>
      </div>
       <div class="modal-actions">
         <button class="outline" @click="editMatcherModal.show=false">取消</button>
         <button class="primary" :disabled="matcherSaving" @click="saveMatcher"><span v-if="matcherSaving" class="spinner"></span>保存</button>
       </div>
    </div>
  </div>

  <!-- Hit Detail Modal -->
  <div class="modal-overlay" v-if="wafHitDetailModal.show" @click.self="wafHitDetailModal.show=false">
    <div class="modal" style="max-width:700px">
      <h3>命中详情 <small style="color:var(--muted)">{{ wafHitDetailModal.data ? (wafHitDetailModal.data.rule_name || wafHitDetailModal.data.rule_id) : '' }}</small></h3>
      <div v-if="wafHitDetailModal.loading" style="text-align:center;padding:20px;color:var(--muted)">加载中...</div>
      <div v-else-if="wafHitDetailModal.error" class="error">
        <div>{{ wafHitDetailModal.error }}</div>
        <button class="outline small" style="margin-top:8px" @click="wafHitDetailModal.show=false">关闭</button>
      </div>
      <div v-else-if="wafHitDetailModal.data">
         <div class="grid grid-2 mb-8">
           <div class="field"><label>规则</label><code>{{ wafHitDetailModal.data.rule_name || wafHitDetailModal.data.rule_id }}</code></div>
           <div class="field"><label>分类</label><span class="tag">{{ wafHitDetailModal.data.rule_category || '-' }}</span></div>
           <div class="field"><label>时间</label>{{ new Date((wafHitDetailModal.data.timestamp || 0) * 1000).toLocaleString() }}</div>
           <div class="field"><label>方法</label><span class="tag">{{ wafHitDetailModal.data.method }}</span></div>
         </div>
         <div class="field">
           <label>来源 IP</label>
           <div>
             <code>{{ wafHitDetailModal.data.ip }}</code>
             <button class="outline small" style="margin-left:4px" @click="copyText(wafHitDetailModal.data.ip)" title="复制 IP">复制</button>
             <span v-if="wafHitDetailModal.data.ip_whitelisted" class="tag" style="background:#d1fae5;color:#065f46;margin-left:4px">白名单</span>
             <span v-else-if="wafHitDetailModal.data.ip_flagged" class="tag" style="background:#fee2e2;color:#991b1b;margin-left:4px">已标记</span>
             <span class="tag" style="margin-left:4px">分数: {{ wafHitDetailModal.data.ip_score || 0 }}</span>
             <span class="tag" style="margin-left:4px;color:#6b7280">该 IP 共 {{ wafHitDetailModal.data.ip_hit_count || 0 }} 条命中</span>
           </div>
         </div>
         <div class="field"><label>URI</label><code style="word-break:break-all">{{ wafHitDetailModal.data.uri }}</code></div>
         <div class="field" v-if="wafHitDetailModal.data.query_string"><label>查询字符串</label><code style="word-break:break-all">{{ wafHitDetailModal.data.query_string }}</code></div>
         <div class="field"><label>User-Agent</label><div style="font-size:12px;color:#374151;word-break:break-all">{{ wafHitDetailModal.data.user_agent || '-' }}</div></div>
         <div class="field" v-if="wafHitDetailModal.data.ja3_fingerprint"><label>TLS 指纹</label><code style="font-size:11px;word-break:break-all">{{ wafHitDetailModal.data.ja3_fingerprint }}</code></div>
         <div class="field" v-if="wafHitDetailModal.data.body_snippet"><label>Body (前 1KB)</label><pre style="background:#f9fafb;padding:8px;border-radius:4px;font-size:11px;max-height:100px;overflow:auto;white-space:pre-wrap;word-break:break-all">{{ wafHitDetailModal.data.body_snippet }}</pre></div>
         <div class="field" v-if="wafHitDetailModal.data.headers && Object.keys(wafHitDetailModal.data.headers).length">
           <label>请求头</label>
          <table style="font-size:11px">
            <tbody>
              <tr v-for="(v, k) in wafHitDetailModal.data.headers" :key="k">
                <td style="font-weight:600;padding-right:12px;white-space:nowrap">{{ k }}</td>
                <td style="word-break:break-all">{{ v }}</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="modal-actions">
          <button class="outline" @click="wafHitDetailModal.show=false">关闭</button>
          <button class="outline" @click="addToWhitelist(wafHitDetailModal.data.ip)">加入白名单</button>
          <button class="outline" @click="viewIpHits(wafHitDetailModal.data.ip)">查看该 IP 命中</button>
          <button class="primary" @click="editRuleById(wafHitDetailModal.data.rule_id)">调整此规则</button>
        </div>
        <!-- IP Hits List (shown after clicking view) -->
        <div v-if="wafIpHitsError" class="error" style="margin-bottom:8px">{{ wafIpHitsError }}</div>
        <div v-if="wafIpHits.length" style="margin-top:16px;border-top:1px solid #e0e3eb;padding-top:12px">
          <h4 style="font-size:13px;margin-bottom:8px">IP {{ wafIpHitsIp }} 的最近命中 ({{ wafIpHits.length }})</h4>
          <table style="font-size:12px">
            <thead><tr><th>时间</th><th>规则</th><th>方法</th><th>URI</th></tr></thead>
            <tbody>
                <tr v-for="(ih, ii) in wafIpHits.slice(0, 20)" :key="ii" @click="openHitDetail(ih)" style="cursor:pointer">
                <td style="white-space:nowrap">{{ fmtTime(ih.timestamp) }}</td>
                <td><code style="font-size:10px">{{ ih.rule_id }}</code></td>
                <td><span class="tag" style="font-size:10px;padding:1px 5px">{{ ih.method }}</span></td>
                <td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="ih.uri">{{ ih.uri }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Rule Editor Modal -->
  <div class="modal-overlay" v-if="ruleEditModal.show" @click.self="ruleEditModal.show=false">
    <div class="modal" style="max-width:600px">
       <h3>{{ ruleEditModal.mode === 'create' ? '添加规则' : '编辑规则' }} <small style="color:var(--muted)">组: {{ ruleEditModal._group }}</small></h3>
      <div class="field">
         <label><input type="checkbox" v-model="ruleEditModal.enable"> 启用</label>
      </div>
      <div class="field">
         <label>匹配器</label>
         <select v-model="ruleEditModal.matcherType" @change="ruleEditModalChanged" style="width:100%">
           <option value="inline">内联 JSON</option>
          <option v-for="m in matcherKeys" :key="m" :value="m">{{ m }}</option>
        </select>
        <textarea v-if="ruleEditModal.matcherType==='inline'" v-model="ruleEditModal.matcherJson" spellcheck="false" class="code-editor" style="min-height:80px;margin-top:4px"></textarea>
      </div>
      <div class="field">
         <label>动作</label>
         <select v-model="ruleEditModal.action" @change="ruleEditModalChanged" style="width:100%">
           <option value="block">阻止</option>
           <option value="redirect">重定向</option>
           <option value="response">响应</option>
           <option value="rewrite">重写</option>
           <option value="proxy">代理</option>
           <option value="static">静态</option>
           <option value="accept">放行</option>
           <option value="challenge">质询</option>
         </select>
      </div>
      <!-- block fields -->
       <template v-if="ruleEditModal.action==='block'">
         <div class="field"><label>HTTP 状态码</label><input v-model.number="ruleEditModal.code" type="number" style="width:100px"></div>
         <div class="field"><label>响应</label><input v-model="ruleEditModal.response" placeholder="模板名称或 JSON" style="width:100%"></div>
       </template>
      <!-- redirect fields -->
       <template v-if="ruleEditModal.action==='redirect'">
         <div class="field"><label>目标 URI</label><input v-model="ruleEditModal.to_uri" placeholder="/new-path" style="width:100%"></div>
         <div class="field"><label>HTTP 状态码</label><select v-model.number="ruleEditModal.code" style="width:100px"><option :value="301">301</option><option :value="302">302</option><option :value="307">307</option><option :value="308">308</option></select></div>
       </template>
      <!-- response fields -->
       <template v-if="ruleEditModal.action==='response'">
         <div class="field"><label>HTTP 状态码</label><input v-model.number="ruleEditModal.code" type="number" style="width:100px"></div>
         <div class="field"><label>响应</label><input v-model="ruleEditModal.response" placeholder="模板名称 例如 forbidden_json" style="width:100%"></div>
       </template>
      <!-- rewrite fields -->
       <template v-if="ruleEditModal.action==='rewrite'">
         <div class="field"><label>目标 URI</label><input v-model="ruleEditModal.to_uri" placeholder="/new-path" style="width:100%"></div>
       </template>
      <!-- proxy fields -->
       <template v-if="ruleEditModal.action==='proxy'">
         <div class="field">
           <label>上游</label>
           <select v-model="ruleEditModal.upstream" style="width:100%">
             <option value="" disabled>选择上游</option>
            <option v-for="u in upstreamKeys" :key="u" :value="u">{{ u }}</option>
          </select>
        </div>
      </template>
      <!-- static fields -->
       <template v-if="ruleEditModal.action==='static'">
         <div class="field"><label>根目录</label><input v-model="ruleEditModal.root" placeholder="/var/www" style="width:100%"></div>
         <div class="field"><label>路径 (可选)</label><input v-model="ruleEditModal.path" placeholder="/index.html" style="width:100%"></div>
         <div class="field"><label>过期</label><input v-model="ruleEditModal.expires" placeholder="epoch / max / off" style="width:100%"></div>
       </template>
       <div class="modal-actions">
         <button class="outline" @click="ruleEditModal.show=false">取消</button>
         <button class="primary" :disabled="ruleSaving" @click="ruleSave">{{ ruleSaving ? '保存中…' : '保存' }}</button>
       </div>
</div>
 </div>

  <!-- Unified Confirm Modal -->
  <div class="modal-overlay" v-if="confirmModal.show" @click.self="confirmModalCancel">
    <div class="modal" style="max-width:480px">
      <h3 :style="{color: confirmModal.type==='danger' ? '#ef4444' : confirmModal.type==='warning' ? '#f59e0b' : '#3b82f6'}">{{ confirmModal.title }}</h3>
      <div v-if="confirmModal.message" style="font-size:14px;color:var(--text);margin:12px 0;white-space:pre-wrap">{{ confirmModal.message }}</div>
      <div v-if="confirmModal.requireInput" class="field" style="margin-top:16px">
        <label style="font-size:13px;color:var(--muted)">{{ confirmModal.inputLabel }}</label>
        <input v-model="confirmModal.inputValue" type="text" :placeholder="confirmModal.inputExpected" style="width:100%;font-family:monospace" @keyup.enter="confirmModalOk">
        <div style="font-size:11px;color:var(--muted);margin-top:4px">请输入: <code>{{ confirmModal.inputExpected }}</code></div>
      </div>
      <div class="modal-actions" style="margin-top:16px">
        <button class="outline" @click="confirmModalCancel">取消</button>
        <button :class="confirmModal.type==='danger' ? 'danger' : confirmModal.type==='warning' ? 'primary' : 'primary'" @click="confirmModalOk">确认</button>
      </div>
    </div>
  </div>

</template>
</div>
  <script src="/verynginx/static/vn-common.js"></script>
  <script src="/verynginx/static/vn-dashboard.js"></script>
  <script src="/verynginx/static/vn-config.js"></script>
  <script src="/verynginx/static/vn-waf.js"></script>
  <script src="/verynginx/static/vn-frequency.js"></script>
  <script src="/verynginx/static/vn-iploc.js"></script>
  <script src="/verynginx/static/vn-reputation.js"></script>
  <script src="/verynginx/static/vn-advanced.js"></script>
  <script src="/verynginx/static/vn-kb.js"></script>
  <script src="/verynginx/static/app.js"></script>
</body>
</html>
