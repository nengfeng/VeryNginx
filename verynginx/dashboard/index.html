<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VeryNginx v2</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f6fa;--card:#fff;--border:#e0e3eb;--text:#1a1a2e;--muted:#6b7280;--primary:#4361ee;--primary-hover:#3a56d4;--danger:#e63946;--success:#2ec4b6;--warning:#f4a261}
[data-theme="dark"]{--bg:#1a1a2e;--card:#2d2d44;--border:#3d3d5c;--text:#e0e0e0;--muted:#9ca3af;--primary:#6366f1;--primary-hover:#4f46e5;--danger:#ef4444;--success:#10b981;--warning:#f59e0b}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}
input,select,textarea,button{font:inherit}
button{cursor:pointer;border:none;border-radius:6px;padding:8px 16px;font-size:14px}
button.primary{background:var(--primary);color:#fff}button.primary:hover{background:var(--primary-hover)}
button.danger{background:var(--danger);color:#fff}
button.small{padding:4px 10px;font-size:12px}
button.outline{background:transparent;border:1px solid var(--border);color:var(--text)}
button.outline:hover{background:var(--bg)}
input,select,textarea{border:1px solid var(--border);border-radius:6px;padding:8px 12px;width:100%;background:var(--card)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:-1px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
tr:hover{background:#f0f2f8}
pre{background:#1a1a2e;color:#e0e3eb;padding:16px;border-radius:8px;overflow:auto;font-size:13px;line-height:1.5;max-height:60vh}
textarea.code-editor{background:#1a1a2e;color:#e0e3eb;padding:16px;border-radius:8px;border:none;width:100%;font:13px/1.5 monospace;resize:vertical;min-height:200px;box-sizing:border-box}
textarea.code-editor:focus{outline:1px solid var(--primary)}
.card{background:var(--card);border-radius:10px;padding:20px;border:1px solid var(--border);margin-bottom:16px}
.grid{display:grid;gap:16px}.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr 1fr}.grid-4{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.flex{display:flex;align-items:center}.flex-between{justify-content:space-between}.gap-8{gap:8px}.gap-16{gap:16px}
.mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}.mt-16{margin-top:16px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.tag-ok{background:#d1fae5;color:#065f46}.tag-err{background:#fee2e2;color:#991b1b}.tag-warn{background:#fef3c7;color:#92400e}
/* Login */
#login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--card);border-radius:12px;padding:40px;width:100%;max-width:400px;border:1px solid var(--border);box-shadow:0 4px 24px rgba(0,0,0,.06)}
.login-box h1{font-size:24px;margin-bottom:4px;text-align:center}
.login-box .sub{color:var(--muted);font-size:14px;text-align:center;margin-bottom:24px}
.login-box .field{margin-bottom:16px}
.login-box .field label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--muted)}
.error{background:#fee2e2;color:#991b1b;padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:16px}
.login-box button{width:100%;padding:12px;font-size:15px}
/* Top nav */
#topnav{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;height:56px;position:sticky;top:0;z-index:100}
#topnav .brand{font-weight:700;font-size:16px;margin-right:32px;color:var(--text)}
#topnav .brand small{font-weight:400;color:var(--muted);font-size:12px}
#topnav nav{display:flex;gap:4px;flex:1}
#topnav nav a{padding:8px 14px;border-radius:6px;font-size:14px;color:var(--text);cursor:pointer;transition:background .15s}
#topnav nav a:hover{background:var(--bg);text-decoration:none}
#topnav nav a.active{background:var(--primary);color:#fff}
#topnav .user-area{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
/* Main layout */
#main{padding:24px;max-width:1200px;margin:0 auto}
.page-title{font-size:22px;font-weight:700;margin-bottom:20px}
/* Status cards */
.stat-card{background:var(--card);border-radius:10px;padding:20px;border:1px solid var(--border);text-align:center}
.stat-card .stat-value{font-size:32px;font-weight:700;margin-top:4px}
.stat-card .stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
/* Config tabs */
.config-tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.config-tabs a{padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--text);border:1px solid transparent;transition:all .15s}
.config-tabs a:hover{background:var(--bg);text-decoration:none}
.config-tabs a.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.config-section h3{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.config-section h3 small{font-weight:400;font-size:12px;color:var(--muted)}
/* Actions */
.actions{display:flex;gap:8px;justify-content:center}
.actions button{padding:4px 8px;font-size:11px}
/* Empty state */
.empty{color:var(--muted);font-size:14px;padding:24px;text-align:center}
/* Health dots */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.dot.green{background:#22c55e}
.dot.yellow{background:#eab308}
.dot.orange{background:#f97316}
.dot.red{background:#ef4444}
.dot.gray{background:#9ca3af}
/* Modal overlay */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:var(--card);border-radius:12px;padding:24px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto}
.modal h3{font-size:16px;margin-bottom:16px}
.modal .field{margin-bottom:12px}
.modal .field label{display:block;font-size:12px;font-weight:600;margin-bottom:3px;color:var(--muted)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* Inline JSON */
.json-inline{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:768px){.grid-2,.grid-3{grid-template-columns:1fr}#topnav{padding:0 12px;flex-wrap:wrap;height:auto;padding:8px 12px}#topnav nav{gap:2px}#topnav nav a{padding:6px 10px;font-size:12px}#main{padding:12px}}
.toast{position:fixed;top:20px;right:20px;z-index:9999;padding:12px 20px;border-radius:8px;color:#fff;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;transform:translateY(-10px);transition:all .3s ease;pointer-events:none;max-width:360px}
.toast.show{opacity:1;transform:translateY(0)}.toast.success{background:var(--success)}.toast.error{background:var(--danger)}.toast.info{background:var(--primary)}
</style>
</head>
<body>

<div id="app">
  <div class="toast" :class="[toastType, { show: toastVisible }]">{{ toastMsg }}</div>
  <!-- Login -->
  <div id="login-page" v-if="!store.loggedIn">
    <div class="login-box">
      <h1>VeryNginx</h1>
      <p class="sub">v2.0 — WAF &amp; Reverse Proxy Manager</p>
      <div class="error" v-if="loginError">{{ loginError }}</div>
      <div class="field">
        <label>User</label>
        <input v-model.trim="loginUser" type="text" placeholder="admin username" @keyup.enter="doLogin">
      </div>
      <div class="field">
        <label>Password</label>
        <input v-model.trim="loginPass" type="password" placeholder="password" @keyup.enter="doLogin">
      </div>
      <button class="primary" :disabled="loading" @click="doLogin">{{ loading ? 'Signing in…' : 'Sign in' }}</button>
    </div>
  </div>

  <!-- App -->
  <template v-else>
    <div id="topnav">
      <span class="brand">VeryNginx <small>v2</small></span>
      <nav>
        <a :class="{active:page==='overview'}" @click="page='overview';loadOverview()">Overview</a>
        <a :class="{active:page==='status'}" @click="page='status'">Status</a>
        <a :class="{active:page==='config'}" @click="page='config'">Config</a>
        <a :class="{active:page==='stats'}" @click="page='stats';loadStats()">Stats</a>
        <a :class="{active:page==='waf'}" @click="page='waf';loadWafData()">WAF</a>
        <a :class="{active:page==='frequency'}" @click="page='frequency';loadFrequencyData()">Frequency</a>
         <a :class="{active:page==='reputation'}" @click="page='reputation';loadRepData()">Reputation</a>
         <a :class="{active:page==='geoip'}" @click="page='geoip';loadGeoIP();loadGeoIPStatus()">GeoIP</a>
         <a :class="{active:page==='fingerprints'}" @click="page='fingerprints';loadFingerprints()">Fingerprints</a>
         <a :class="{active:page==='audit'}" @click="page='audit';loadAudit()">Audit</a>
        <a :class="{active:page==='about'}" @click="page='about'">About</a>
      </nav>
      <div class="user-area">
        <button class="outline small" @click="toggleTheme" :title="theme==='dark'?'切换浅色':'切换深色'" style="padding:4px 8px">
          {{ theme === 'dark' ? '☀' : '🌙' }}
        </button>
        <span>{{ store.user }}</span>
        <button class="outline small" @click="doLogout">Logout</button>
      </div>
    </div>

    <div id="main">
      <!-- Overview -->
      <div v-if="page==='overview'">
        <h2 class="page-title">System Overview</h2>
        <!-- Top row: connections + upstream -->
        <div class="grid grid-4 mb-16">
          <div class="stat-card">
            <div class="stat-label">Active Connections</div>
            <div class="stat-value" :style="{color: (overview.conn_active||0) > 1000 ? '#ef4444' : ''}">{{ overview.conn_active || 0 }}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Requests (last min)</div>
            <div class="stat-value">{{ formatNumber(overview.req_rate || 0) }}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Upstream Healthy</div>
            <div class="stat-value">
              <span :style="{color: overview.up_healthy === overview.up_total && overview.up_total > 0 ? '#22c55e' : overview.up_healthy > 0 ? '#eab308' : '#ef4444'}">
                {{ overview.up_healthy || 0 }}
              </span>
              <span style="font-size:18px;color:var(--muted)"> / {{ overview.up_total || 0 }}</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-label">WAF Hits (last min)</div>
            <div class="stat-value" :style="{color: (overview.waf_hits||0) > 100 ? '#f97316' : ''}">{{ formatNumber(overview.waf_hits || 0) }}</div>
          </div>
          <div class="stat-card" v-if="overview.flagged !== undefined">
            <div class="stat-label">Flagged IPs</div>
            <div class="stat-value" :style="{color: (overview.flagged||0) > 0 ? '#ef4444' : ''}">{{ overview.flagged }}</div>
          </div>
        </div>
        <!-- Second row: memory + errors -->
        <div class="grid grid-3 mb-16">
          <div class="stat-card" v-for="d in overview.dicts || []" :key="d.name">
            <div class="stat-label">Shared Dict: {{ d.name }}</div>
            <div class="stat-value" style="font-size:20px" :style="{color: d.pct > 80 ? '#ef4444' : d.pct > 60 ? '#eab308' : ''}">{{ d.pct.toFixed(1) }}%</div>
            <div style="font-size:11px;color:var(--muted)">{{ formatBytes(d.used) }} / {{ formatBytes(d.cap) }}</div>
          </div>
        </div>
        <!-- Third row: top URIs + plugin errors -->
        <div class="grid grid-2 mb-16">
          <div class="card">
            <strong>Top URIs by Requests</strong>
            <table style="font-size:12px;margin-top:8px" v-if="(overview.top_uris || []).length">
              <thead><tr><th>URI</th><th>Count</th><th>Bytes</th><th>Success</th></tr></thead>
              <tbody>
                <tr v-for="u in overview.top_uris" :key="u.uri">
                  <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ u.uri }}</td>
                  <td>{{ formatNumber(u.count) }}</td>
                  <td>{{ formatBytes(u.bytes) }}</td>
                  <td><span :class="successClass(u.success_rate)">{{ (u.success_rate || 0).toFixed(1) }}%</span></td>
                </tr>
              </tbody>
            </table>
            <div v-else class="empty">No data</div>
          </div>
          <div class="card">
            <strong>Plugin Performance</strong>
            <table style="font-size:12px;margin-top:8px" v-if="(overview.plugin_perf || []).length">
              <thead><tr><th>Plugin</th><th>Phase</th><th>Avg Dur</th><th>Errors</th></tr></thead>
              <tbody>
                <tr v-for="e in overview.plugin_perf" :key="e.plugin + e.phase">
                  <td>{{ e.plugin }}</td>
                  <td>{{ e.phase }}</td>
                  <td :style="{color: e.avg_ms > 50 ? '#f97316' : ''}">{{ e.avg_ms.toFixed(1) }}ms</td>
                  <td><span :style="{color: e.errors > 0 ? '#ef4444' : ''}">{{ formatNumber(e.errors) }}</span></td>
                </tr>
              </tbody>
            </table>
            <div v-else class="empty">No data</div>
          </div>
        </div>
      </div>

      <!-- Status -->
      <div v-if="page==='status'">
        <h2 class="page-title">Status</h2>
        <div class="grid grid-4 mb-16">
          <div class="stat-card"><div class="stat-label">Active Connections</div><div class="stat-value">{{ s.connections_active || 0 }}</div></div>
          <div class="stat-card"><div class="stat-label">Reading</div><div class="stat-value">{{ s.connections_reading || 0 }}</div></div>
          <div class="stat-card"><div class="stat-label">Writing</div><div class="stat-value">{{ s.connections_writing || 0 }}</div></div>
          <div class="stat-card"><div class="stat-label">Waiting</div><div class="stat-value">{{ s.connections_waiting || 0 }}</div></div>
        </div>
        <!-- Connection trend chart -->
        <div class="card mb-16" v-if="connHistory.length > 1">
          <strong>Connections Trend (last 3 min)</strong>
          <svg width="100%" height="120" style="margin-top:8px">
            <polyline :points="connLinePoints" fill="none" stroke="#4f8af0" stroke-width="2" />
            <polyline :points="connFillPoints" fill="rgba(79,138,240,0.1)" stroke="none" />
          </svg>
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:2px">
            <span>{{ connHistory.length * 3 }}s ago</span>
            <span>now</span>
          </div>
        </div>
        <div class="card">
          <div class="flex flex-between mb-8">
            <strong>Status Info</strong>
            <button class="outline small" @click="loadStatus">Refresh</button>
          </div>
          <table>
            <tr><th>Time</th><td>{{ formatTime(s.time) }}</td></tr>
            <tr><th>Uptime Status</th><td><span class="tag tag-ok">Online</span></td></tr>
          </table>
        </div>
      </div>

      <!-- Config -->
      <div v-if="page==='config'">
        <div class="flex flex-between" style="align-items:flex-start">
          <h2 class="page-title" style="margin-bottom:0">Configuration</h2>
          <div class="flex gap-8">
            <button class="outline small" @click="exportConfig">Export</button>
            <button class="outline small" @click="importConfig">Import</button>
            <input ref="importFileInput" type="file" accept=".json" style="display:none" @change="onImportFile">
          </div>
        </div>
        <div v-if="configImportError" class="error" style="margin-bottom:8px">{{ configImportError }}</div>
        <div v-if="configImportOk" style="background:#d1fae5;color:#065f46;padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:8px">{{ configImportOk }}</div>
        <div class="config-tabs">
          <a :class="{active:cfgTab==='matchers'}" @click="cfgTab='matchers'">Matchers</a>
          <a :class="{active:cfgTab==='rules'}" @click="cfgTab='rules'">Rules</a>
          <a :class="{active:cfgTab==='upstreams'}" @click="cfgTab='upstreams'">Upstreams</a>
          <a :class="{active:cfgTab==='responses'}" @click="cfgTab='responses'">Responses</a>
          <a :class="{active:cfgTab==='plugins'}" @click="cfgTab='plugins';loadPlugins()">Plugins</a>
          <a :class="{active:cfgTab==='system'}" @click="cfgTab='system'">System</a>
          <a :class="{active:cfgTab==='json'}" @click="cfgTab='json'">Raw JSON</a>
        </div>

        <!-- Matchers -->
        <div class="config-section" v-if="cfgTab==='matchers'">
          <div class="flex flex-between mb-16">
            <h3>Matchers <small>{{ matcherKeys.length }} defined</small></h3>
            <button class="primary small" @click="editMatcher(null)">+ Add</button>
          </div>
          <table v-if="matcherKeys.length">
            <thead><tr><th>Name</th><th>Conditions</th><th></th></tr></thead>
            <tbody>
              <tr v-for="name in matcherKeys" :key="name">
                <td><strong>{{ name }}</strong></td>
                <td><span class="json-inline">{{ JSON.stringify(cfg.matcher[name]) }}</span></td>
                <td class="actions">
                  <button class="outline small" @click="editMatcher(name)">Edit</button>
                  <button class="danger small" @click="deleteMatcher(name)">Del</button>
                </td>
              </tr>
            </tbody>
          </table>
          <div v-else class="empty">No matchers defined.</div>
        </div>

        <!-- Rules -->
        <div class="config-section" v-if="cfgTab==='rules'">
          <h3>Rule Groups</h3>
          <div v-for="(rules, group) in cfg.rule || {}" :key="group" class="card" style="padding:16px">
            <div class="flex flex-between mb-8">
              <strong style="font-size:14px">{{ group }}</strong>
              <div class="flex gap-4">
                <span class="tag tag-ok" v-if="rules && rules.length">{{ rules.length }} rules</span>
                <span class="tag tag-warn" v-else>empty</span>
                <button class="primary small" @click="ruleOpenCreate(group)">+ Add</button>
              </div>
            </div>
            <table v-if="rules && rules.length" style="font-size:13px">
              <thead><tr><th>#</th><th>Enable</th><th>Matcher</th><th>Action</th><th>Detail</th><th></th></tr></thead>
              <tbody>
                <tr v-for="(r,i) in rules" :key="i">
                  <td>{{ i }}</td>
                  <td><input type="checkbox" :checked="r.enable!==false" @change="ruleToggle(r, group)"></td>
                  <td>{{ typeof r.matcher === 'string' ? r.matcher : '(inline)' }}</td>
                  <td><span class="tag" :class="actionClass(r.action)">{{ r.action }}</span></td>
                  <td><span class="json-inline">{{ summarizeRule(r) }}</span></td>
                  <td class="actions">
                    <button class="outline small" @click="ruleOpenEdit(r, group, i)">Edit</button>
                    <button class="danger small" @click="ruleDelete(r, group)">Del</button>
                  </td>
                </tr>
              </tbody>
            </table>
            <div v-else class="empty">No rules in this group.</div>
          </div>
        </div>

        <!-- Upstreams -->
        <div class="config-section" v-if="cfgTab==='upstreams'">
          <h3>Backend Upstreams</h3>
          <div v-for="(up, name) in cfg.backend_upstream || {}" :key="name" class="card" style="padding:16px">
            <strong>{{ name }}</strong>
            <table style="font-size:13px;margin-top:8px">
              <thead><tr><th>Health</th><th>Host</th><th>Port</th><th>Weight</th><th>Info</th></tr></thead>
              <tbody>
                <tr v-for="(node,ni) in up.nodes || []" :key="ni">
                  <td>
                    <span v-if="!healthData[name] || !healthData[name][ni]" class="dot gray" title="unknown"></span>
                    <span v-else-if="healthData[name][ni].circuit_open" class="dot orange" title="circuit open"></span>
                    <span v-else-if="!healthData[name][ni].healthy" class="dot red" :title="healthData[name][ni].last_error || 'unhealthy'"></span>
                    <span v-else-if="healthData[name][ni].failures > 0" class="dot yellow" :title="healthData[name][ni].failures + ' failure(s)'"></span>
                    <span v-else class="dot green" title="healthy"></span>
                  </td>
                  <td>{{ node.host }}</td><td>{{ node.port }}</td><td>{{ node.weight || 1 }}</td>
                  <td style="font-size:11px;color:var(--muted)">
                    <template v-if="healthData[name] && healthData[name][ni]">
                      <span v-if="healthData[name][ni].circuit_open">CB open</span>
                      <span v-else-if="!healthData[name][ni].healthy">{{ healthData[name][ni].last_error || 'down' }}</span>
                      <span v-else-if="healthData[name][ni].failures > 0">{{ healthData[name][ni].failures }} fails</span>
                      <span v-else>ok</span>
                    </template>
                    <span v-else>---</span>
                  </td>
                </tr>
              </tbody>
            </table>
            <div style="font-size:12px;color:var(--muted);margin-top:4px">
              HC: {{ up.health_check?.path || 'none' }} &middot;
              TLS: {{ up.tls?.enable ? 'yes' : 'no' }} &middot;
              Method: {{ up.method || 'round_robin' }}
            </div>
          </div>
          <div v-if="!cfg.backend_upstream || !Object.keys(cfg.backend_upstream).length" class="empty">No upstreams defined.</div>
        </div>

        <!-- Responses -->
        <div class="config-section" v-if="cfgTab==='responses'">
          <h3>Response Templates</h3>
          <table v-if="respKeys.length">
            <thead><tr><th>Name</th><th>Content-Type</th><th>Body</th></tr></thead>
            <tbody>
              <tr v-for="name in respKeys" :key="name">
                <td><strong>{{ name }}</strong></td>
                <td>{{ cfg.response[name].content_type }}</td>
                <td><span class="json-inline">{{ cfg.response[name].body }}</span></td>
              </tr>
            </tbody>
          </table>
          <div v-else class="empty">No response templates.</div>
        </div>

        <!-- Plugins -->
        <div class="config-section" v-if="cfgTab==='plugins'">
          <div class="flex flex-between mb-8">
            <h3>Plugin Settings <small>Toggle plugins on/off</small></h3>
            <button class="outline small" @click="loadPlugins">Refresh</button>
          </div>
          <div v-if="pluginsError" class="error" style="margin-bottom:8px">{{ pluginsError }}</div>
          <table>
            <thead><tr><th>Plugin</th><th>Enable</th><th>Priority</th><th>Critical</th><th>Description</th></tr></thead>
            <tbody>
              <tr v-for="p in plugins" :key="p.name">
                <td><strong>{{ p.name }}</strong></td>
                <td><input type="checkbox" :checked="p.enable" @change="togglePlugin(p)"></td>
                <td>{{ p.priority }}</td>
                <td>{{ p.critical ? '✓' : '✗' }}</td>
                <td style="font-size:12px;color:var(--muted)">{{ p.description }}</td>
              </tr>
            </tbody>
          </table>
          <div v-if="!plugins.length" class="empty">No plugins registered.</div>
        </div>

        <!-- System -->
        <div class="config-section" v-if="cfgTab==='system'">
          <h3>System Settings</h3>
          <table>
            <tbody>
              <tr><td>base_uri</td><td>{{ cfg.base_uri }}</td></tr>
              <tr><td>cookie_prefix</td><td>{{ cfg.cookie_prefix }}</td></tr>
              <tr><td>auth_strategy</td><td>{{ cfg.auth_strategy }}</td></tr>
              <tr><td>body.max_size</td><td>{{ cfg.body?.max_size || '-' }}</td></tr>
              <tr><td>body.on_error</td><td>{{ cfg.body?.on_error || '-' }}</td></tr>
              <tr><td>proxy.health_check_interval</td><td>{{ cfg.proxy?.health_check_interval || '-' }}s</td></tr>
            </tbody>
          </table>
          <h3 style="margin-top:16px">Admin Users</h3>
          <table>
            <thead><tr><th>User</th><th>Enable</th><th>Password</th></tr></thead>
            <tbody>
              <tr v-for="(a,i) in cfg.admin || []" :key="i">
                <td>{{ a.user }}</td>
                <td>{{ a.enable ? '✓' : '✗' }}</td>
                <td><span class="json-inline">{{ a.password_hash ? '(set)' : '(not set)' }}</span></td>
              </tr>
            </tbody>
          </table>
          <h3 style="margin-top:16px">Shared Dictionary Memory <small>{{ dictUsage.length }} dicts</small></h3>
          <div v-if="dictUsage.length">
            <div v-for="d in dictUsage" :key="d.name" style="margin-bottom:10px">
              <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px">
                <span>{{ d.name }}</span>
                <span :style="{color: d.pct > 80 ? '#ef4444' : d.pct > 60 ? '#eab308' : 'var(--muted)'}">
                  {{ formatBytes(d.used) }} / {{ formatBytes(d.cap) }} ({{ d.pct.toFixed(1) }}%)
                </span>
              </div>
              <div style="height:6px;background:var(--bg);border-radius:3px;overflow:hidden">
                <div :style="{
                  width: d.pct + '%',
                  height:'100%',
                  borderRadius:'3px',
                  background: d.pct > 80 ? '#ef4444' : d.pct > 60 ? '#eab308' : '#22c55e',
                  transition: 'width .3s'
                }"></div>
              </div>
            </div>
          </div>
          <div v-else style="font-size:12px;color:var(--muted);margin-top:8px">
            <button class="outline small" @click="loadDictUsage">Load</button>
          </div>
        </div>

        <!-- Raw JSON -->
        <div class="config-section" v-if="cfgTab==='json'">
          <div class="flex flex-between mb-16">
            <h3>Raw Configuration</h3>
            <div class="flex gap-8">
              <button class="outline small" @click="loadConfig">Reload</button>
              <button class="primary small" :disabled="jsonSaving" @click="saveRawConfig">{{ jsonSaving ? 'Saving…' : 'Save' }}</button>
            </div>
          </div>
          <div class="error" v-if="jsonError" style="margin-bottom:8px">{{ jsonError }}</div>
          <textarea id="json-editor" v-model="rawJson" spellcheck="false" class="code-editor"></textarea>
        </div>
      </div>

      <!-- Stats -->
      <div v-if="page==='stats'">
        <div class="flex flex-between mb-16">
          <h2 class="page-title" style="margin-bottom:0">Request Statistics</h2>
          <div class="flex gap-8">
            <select v-model="statsType" style="width:auto" @change="loadStats">
              <option value="long">All</option>
              <option value="medium">5 Minutes</option>
              <option value="short">Temporary</option>
            </select>
            <button class="outline small" @click="loadStats">Refresh</button>
          </div>
        </div>
        <div v-if="statsError" class="error" style="margin-bottom:8px">{{ statsError }}</div>
        <div v-if="statsData">
          <h3 style="font-size:14px;margin-bottom:8px;">URI Statistics <small>{{ Object.keys(statsData || {}).length }} entries</small></h3>
          <div style="overflow-x:auto">
            <table>
              <thead><tr><th style="width:24px"></th><th>URI</th><th>Count</th><th>Size</th><th>Avg Size</th><th>Success</th><th>Time</th><th>Avg Time</th></tr></thead>
              <tbody>
                <template v-for="(v,key) in statsData || {}" :key="key">
                  <tr @click="expandedUri = expandedUri === key ? null : key" style="cursor:pointer">
                    <td style="color:var(--muted);font-size:11px">{{ expandedUri === key ? '&#9660;' : '&#9654;' }}</td>
                    <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="key">{{ key }}</td>
                    <td>{{ v.count }}</td>
                    <td>{{ formatBytes(v.bytes) }}</td>
                    <td>{{ v.count ? formatBytes(v.bytes / v.count) : '-' }}</td>
                    <td><span class="tag" :class="successClass(v)">{{ calcSuccess(v) }}%</span></td>
                    <td>{{ v.time != null ? v.time.toFixed(2) : '-' }}s</td>
                    <td>{{ v.count ? (v.time / v.count).toFixed(3) : '-' }}s</td>
                  </tr>
                  <tr v-if="expandedUri === key">
                    <td colspan="8" style="padding:4px 16px 12px 36px">
                      <div style="font-size:12px;color:var(--muted);margin-bottom:4px">Status Code Distribution:</div>
                      <div style="display:flex;gap:12px;flex-wrap:wrap">
                        <span v-for="(cnt, code) in v.status || {}" :key="code" style="white-space:nowrap">
                          <span class="tag" :class="parseInt(code) < 400 ? 'tag-ok' : parseInt(code) < 500 ? 'tag-warn' : 'tag-err'">{{ code }}</span>
                          {{ cnt }}
                        </span>
                        <span v-if="!v.status || !Object.keys(v.status).length" style="color:var(--muted)">No status data</span>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
        <!-- Top Paths -->
        <div class="card mt-16" v-if="topPaths.length">
          <div class="flex flex-between mb-8">
            <strong>Top Request Paths (last 1 minute)</strong>
            <button class="outline small" @click="loadTopPaths">Refresh</button>
          </div>
          <div style="overflow-x:auto">
            <table>
              <thead><tr><th>#</th><th>URI</th><th>Count</th><th>Bytes</th><th>Avg Time</th></tr></thead>
              <tbody>
                <tr v-for="(tp,idx) in topPaths" :key="tp.uri">
                  <td>{{ idx+1 }}</td>
                  <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="tp.uri">{{ tp.uri }}</td>
                  <td>{{ formatNumber(tp.count) }}</td>
                  <td>{{ formatBytes(tp.bytes) }}</td>
                  <td>{{ tp.count > 0 ? (tp.time / tp.count * 1000).toFixed(1) + 'ms' : '-' }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- WAF -->
      <div v-if="page==='waf'">
        <div class="flex flex-between mb-16">
          <h2 class="page-title" style="margin-bottom:0">WAF Rule Management</h2>
          <div class="flex gap-8">
            <button class="outline small" @click="wafRefreshAll">Refresh</button>
            <button class="primary small" @click="wafOpenCreate">+ New Rule</button>
          </div>
        </div>

        <!-- WAF Tabs -->
        <div class="config-tabs">
          <a :class="{active:wafTab==='rules'}" @click="wafTab='rules'">Rules</a>
          <a :class="{active:wafTab==='stats'}" @click="wafTab='stats';loadWafStats()">Stats</a>
          <a :class="{active:wafTab==='timeline'}" @click="wafTab='timeline';loadWafTimeline()">Timeline</a>
          <a :class="{active:wafTab==='analytics'}" @click="wafTab='analytics';loadWafAnalytics()">Analytics</a>
          <a :class="{active:wafTab==='history'}" @click="wafTab='history';loadWafHistory()">History</a>
          <a :class="{active:wafTab==='hits'}" @click="wafTab='hits';loadWafHits()">Hits</a>
          <a :class="{active:wafTab==='recommendations'}" @click="wafTab='recommendations';loadRecs()">Recommendations</a>
          <a :class="{active:wafTab==='tester'}" @click="wafTab='tester'">Tester</a>
        </div>

        <!-- Analytics Panel -->
        <div v-if="wafTab==='analytics'">
          <div v-if="wafAnalytics.dead_rules && wafAnalytics.dead_rules.length" class="warn" style="margin-bottom:8px; padding:10px 14px; background:#fff7ed; border:1px solid #fed7aa; border-radius:6px; font-size:13px">
            ⚠ 以下规则 30 天内未命中：
            <span v-for="dr in wafAnalytics.dead_rules" :key="dr.id" style="margin-right:8px">
              <strong>{{ dr.name || dr.id }}</strong>
              <span v-if="dr.enable !== false" style="color:#92400e">(启用中)</span>
              <span v-else style="color:#9ca3af">(已禁用)</span>
            </span>
            <span style="color:#6b7280">建议：检查正则是否需要更新，或删除无用规则</span>
          </div>
          <table class="table">
            <thead>
              <tr><th>规则</th><th>动作</th><th>命中</th><th>拦截</th><th>Challenge</th><th>通过率</th><th>效果评级</th><th>最后触发</th></tr>
            </thead>
            <tbody>
              <tr v-for="r in wafAnalytics.rules || []" :key="r.id" :style="{opacity: r.dead ? 0.5 : 1}">
                <td>
                  <strong>{{ r.name || r.id }}</strong>
                  <span v-if="r.dead" class="tag" style="background:#fee2e2;color:#991b1b;margin-left:4px;font-size:10px">休眠</span>
                  <span v-if="r.enable === false" class="tag" style="background:#f3f4f6;color:#6b7280;margin-left:4px;font-size:10px">禁用</span>
                </td>
                <td>{{ r.action }}</td>
                <td>{{ r.hits }}</td>
                <td>{{ r.blocks }}</td>
                <td>{{ r.challenges }}</td>
                <td>{{ r.challenge_pass_rate }}</td>
                <td>
                  <span :class="'grade-' + r.grade" class="tag" :style="gradeStyle(r.grade)">{{ r.grade }}</span>
                </td>
                <td style="font-size:12px;color:#6b7280">{{ r.last_triggered_ago ? formatAgo(r.last_triggered_ago) : '从未' }}</td>
              </tr>
              <tr v-if="!(wafAnalytics.rules || []).length">
                <td colspan="8" class="empty">暂无分析数据</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Rule List -->
        <div v-if="wafTab==='rules'">
          <div v-if="wafError" class="error" style="margin-bottom:8px">{{ wafError }}</div>
          <div class="flex gap-8 mb-8" style="flex-wrap:wrap">
            <select v-model="wafFilterCat" @change="wafFilterChange" style="width:auto">
              <option value="">All Categories</option>
              <option v-for="(cnt,cat) in wafCategories" :key="cat" :value="cat">{{ cat }} ({{ cnt }})</option>
            </select>
            <select v-model="wafFilterSev" @change="wafFilterChange" style="width:auto">
              <option value="">All Severities</option>
              <option value="critical">Critical</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div style="overflow-x:auto">
            <table>
              <thead><tr>
                <th style="width:40px">On</th>
                <th>Name</th>
                <th style="width:80px">Category</th>
                <th style="width:70px">Severity</th>
                <th style="width:70px">Hits</th>
                <th style="width:100px">Last Triggered</th>
                <th style="width:140px">Actions</th>
              </tr></thead>
              <tbody>
                <tr v-for="r in wafRules" :key="r.id">
                  <td style="text-align:center"><input type="checkbox" :checked="r.enable!==false" @change="wafToggleRule(r)"></td>
                  <td><a style="cursor:pointer;text-decoration:underline" @click="wafOpenEdit(r)">{{ r.name }}</a></td>
                  <td><span class="tag">{{ r.category }}</span></td>
                  <td><span class="tag" :class="sevClass(r.severity)">{{ r.severity }}</span></td>
                  <td>{{ r.hit_count || 0 }}</td>
                  <td style="white-space:nowrap">{{ r.last_triggered ? fmtTime(r.last_triggered) : '-' }}</td>
                  <td>
                    <button class="outline small" @click="wafOpenEdit(r)">Edit</button>
                    <button class="danger small" @click="wafDeleteRule(r)">Del</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div v-if="wafPagination.total_pages > 1" class="flex flex-between mt-8">
            <span style="font-size:13px;color:var(--muted)">Page {{ wafPagination.page }} of {{ wafPagination.total_pages }} ({{ wafPagination.total }} rules)</span>
            <div class="flex gap-4">
              <button class="outline small" :disabled="wafPagination.page<=1" @click="wafPage(wafPagination.page-1)">Prev</button>
              <button class="outline small" :disabled="wafPagination.page>=wafPagination.total_pages" @click="wafPage(wafPagination.page+1)">Next</button>
            </div>
          </div>
        </div>

        <!-- Stats -->
        <div v-if="wafTab==='stats'">
          <div v-if="wafStatsError" class="error" style="margin-bottom:8px">{{ wafStatsError }}</div>
          <div v-if="wafStatsData" class="grid grid-4 mb-16">
            <div class="stat-card"><div class="stat-label">Total Rules</div><div class="stat-value">{{ wafStatsData.total_rules }}</div></div>
            <div class="stat-card"><div class="stat-label">Enabled</div><div class="stat-value">{{ wafStatsData.enabled_rules }}</div></div>
            <div class="stat-card"><div class="stat-label">Total Hits</div><div class="stat-value">{{ formatNumber(wafStatsData.total_hits) }}</div></div>
            <div class="stat-card"><div class="stat-label">Today Hits</div><div class="stat-value">{{ formatNumber(wafStatsData.today_hits) }}</div></div>
          </div>
          <div v-if="wafStatsData" class="grid-2">
            <div class="card">
              <h3 style="font-size:14px;margin-bottom:8px">By Category</h3>
              <table>
                <thead><tr><th>Category</th><th>Rules</th><th>Hits</th></tr></thead>
                <tbody>
                  <tr v-for="(v,k) in wafStatsData.by_category" :key="k">
                    <td>{{ k }}</td><td>{{ v.rules }}</td><td>{{ formatNumber(v.hits) }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="card">
              <h3 style="font-size:14px;margin-bottom:8px">By Severity</h3>
              <table>
                <thead><tr><th>Severity</th><th>Rules</th><th>Hits</th></tr></thead>
                <tbody>
                  <tr v-for="(v,k) in wafStatsData.by_severity" :key="k">
                    <td>{{ k }}</td><td>{{ v.rules }}</td><td>{{ formatNumber(v.hits) }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <div v-if="wafStatsData && wafStatsData.top_rules && wafStatsData.top_rules.length" class="card mt-16">
            <h3 style="font-size:14px;margin-bottom:8px">Top Rules by Hits</h3>
            <table>
              <thead><tr><th>#</th><th>Name</th><th>Hits</th></tr></thead>
              <tbody>
                <tr v-for="(tr,idx) in wafStatsData.top_rules" :key="tr.id">
                  <td>{{ idx+1 }}</td><td>{{ tr.name }}</td><td>{{ formatNumber(tr.hits) }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Timeline -->
        <div v-if="wafTab==='timeline'">
          <div style="margin-bottom:12px">
            <select v-model="wafTimelineHours" @change="loadWafTimeline" style="width:auto;display:inline-block;margin-right:8px">
              <option value="1">1 小时</option>
              <option value="3">3 小时</option>
              <option value="6">6 小时</option>
              <option value="12">12 小时</option>
              <option value="24">24 小时</option>
            </select>
            <select v-model="wafTimelineBucket" @change="loadWafTimeline" style="width:auto;display:inline-block">
              <option value="1">1 分钟桶</option>
              <option value="5">5 分钟桶</option>
              <option value="15">15 分钟桶</option>
              <option value="30">30 分钟桶</option>
            </select>
          </div>
          <div class="card" style="padding:16px">
            <div v-if="wafTimeline.buckets && wafTimeline.buckets.length" style="display:flex;align-items:flex-end;gap:2px;height:160px;margin-bottom:8px">
              <div v-for="(b, i) in wafTimeline.buckets" :key="i" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%">
                <div v-for="(count, cat) in b.counts" :key="cat"
                     :style="{height: timelineBarHeight(b.counts, cat), backgroundColor: categoryColor(cat)}"
                     :title="cat + ': ' + count"></div>
              </div>
            </div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px">
              <span v-for="cat in wafTimeline.categories" :key="cat">
                <span :style="{display:'inline-block',width:'10px',height:'10px',backgroundColor:categoryColor(cat),borderRadius:'2px',marginRight:'4px',verticalAlign:'middle'}"></span>
                {{ cat }}
              </span>
            </div>
            <div v-if="!(wafTimeline.buckets || []).length || !hasTimelineData" style="color:#6b7280;font-size:13px;text-align:center;padding:20px">
              暂无攻击数据
            </div>
          </div>
        </div>

        <!-- Hits -->
        <div v-if="wafTab==='hits'">
          <div v-if="wafHitsError" class="error" style="margin-bottom:8px">{{ wafHitsError }}</div>
          <div class="flex flex-between mb-8">
            <span style="font-size:13px;color:var(--muted)">Last {{ wafHitsTime }} — showing {{ wafHits.length }} records</span>
            <button class="outline small" @click="loadWafHits">Refresh</button>
          </div>
          <div style="overflow-x:auto">
            <table>
              <thead><tr><th>Time</th><th>Rule ID</th><th>Method</th><th>URI</th><th>Source IP</th></tr></thead>
              <tbody>
                <tr v-for="h in wafHits" :key="h.time + h.rule_id + h.uri + (h.ring_idx || '')" @click="openHitDetail(h)" style="cursor:pointer">
                  <td style="white-space:nowrap">{{ fmtTime(h.time) }}</td>
                  <td><code style="font-size:11px">{{ h.rule_id }}</code></td>
                  <td><span class="tag">{{ h.method }}</span></td>
                  <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="h.uri">{{ h.uri }}</td>
                  <td><code style="font-size:11px">{{ h.ip }}</code></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div v-if="!wafHits.length" class="empty">No recent hits</div>
        </div>

        <!-- History -->
        <div v-if="wafTab==='history'">
          <div v-if="wafHistError" class="error" style="margin-bottom:8px">{{ wafHistError }}</div>
          <!-- Pending Changes -->
          <div v-if="wafPendingChanges.length" class="card" style="padding:16px;margin-bottom:16px;border-color:#f59e0b">
            <h4 style="font-size:14px;margin-bottom:8px;color:#92400e">⏳ 待确认变更 ({{ wafPendingChanges.length }})</h4>
            <table style="font-size:13px">
              <thead><tr><th>Rule ID</th><th>Staged At</th><th>Action</th><th></th></tr></thead>
              <tbody>
                <tr v-for="p in wafPendingChanges" :key="p.rule_id">
                  <td><code>{{ p.rule_id }}</code></td>
                  <td style="color:#6b7280">{{ new Date(p.staged_at * 1000).toLocaleString() }}</td>
                  <td>
                    <span class="tag" style="background:#fef3c7;color:#92400e">{{ p.proposed.action || 'edit' }}</span>
                  </td>
                  <td>
                    <button class="primary small" @click="confirmPendingChange(p.rule_id)">发布</button>
                    <button class="outline small" style="margin-left:4px" @click="discardPendingChange(p.rule_id)">丢弃</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <!-- History -->
          <div v-if="wafHistory.length">
            <table>
              <thead><tr><th>Version</th><th>Timestamp</th><th>Action</th><th>Rules</th><th></th></tr></thead>
              <tbody>
                <tr v-for="h in wafHistory" :key="h.version">
                  <td>{{ h.version }}</td>
                  <td style="white-space:nowrap">{{ h.timestamp }}</td>
                  <td><span class="tag">{{ h.action }}</span></td>
                  <td>{{ h.rule_count }}</td>
                  <td><button class="outline small" @click="wafRollback(h.version)" :disabled="wafRolling">Rollback</button></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div v-else style="color:var(--muted)">No history available.</div>
        </div>

        <!-- Tester -->
        <div v-if="wafTab==='recommendations'">
          <div class="flex flex-between mb-16">
            <h3 style="font-size:14px;margin:0">Rule Recommendations
              <span class="tag tag-ok" v-if="recStats" style="vertical-align:middle">{{ recStats.pending }} pending</span>
            </h3>
            <button class="primary small" @click="runRecAnalysis" :disabled="recLoading">{{ recLoading ? 'Analyzing...' : 'Analyze Traffic' }}</button>
          </div>
          <div v-if="recError" class="error" style="margin-bottom:8px">{{ recError }}</div>
          <div v-if="recs.length === 0" class="empty">No recommendations yet. Click "Analyze Traffic" to scan recent blocked hits.</div>
          <table v-else style="font-size:13px">
            <thead><tr><th>Pattern</th><th>Category</th><th>Severity</th><th>Action</th><th>Hits</th><th>Status</th><th></th></tr></thead>
            <tbody>
              <tr v-for="r in recs" :key="r.id">
                <td><code style="font-size:11px">{{ r.pattern }}</code></td>
                <td><span :class="'tag tag-' + (r.severity === 'critical' ? 'err' : r.severity === 'high' ? 'warn' : 'ok')">{{ r.category }}</span></td>
                <td>{{ r.severity }}</td>
                <td>{{ r.action }}</td>
                <td>{{ r.hit_count }}</td>
                <td>{{ r.status }}</td>

<script>
const { reactive, ref, computed, watch } = Vue;

// ---- API ----
let csrfToken = null;

async function api(method, path, body, opts2) {
  const opts = { method, credentials: 'same-origin' };
  if (body) {
    if (body instanceof URLSearchParams) {
      opts.body = body;
    } else if (typeof body === 'object' && !(body instanceof FormData)) {
      opts.headers = { 'Content-Type': 'application/json' };
      opts.body = JSON.stringify(body);
    } else {
      opts.body = body;
    }
  }
  if (method !== 'GET' && csrfToken) {
    opts.headers = opts.headers || {};
    opts.headers['X-CSRF-Token'] = csrfToken;
  }
  const res = await fetch(path, opts);
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    let msg;
    try { const j = JSON.parse(text); msg = j.message || j.err || text; } catch { msg = text || `HTTP ${res.status}`; }
    throw new Error(msg);
  }
  if (opts2 && opts2.text) return res.text();
  return res.json();
}

async function refreshCsrf() {
  try {
    const d = await api('GET', '/verynginx/csrf');
    csrfToken = d.csrf_token;
  } catch (e) {
    console.warn('CSRF token refresh failed:', e.message);
  }
}

// ---- App ----
// Dark mode toggle (before app mount)
;(function() {
  try {
    var saved = localStorage.getItem('vn_theme');
    if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch(e) {}
})();

const app = Vue.createApp({
  setup() {
    const store = reactive({ loggedIn: false, user: null });
    const page = ref('status');
    const loading = ref(false);
    const loginUser = ref('');
    const loginPass = ref('');
    const loginError = ref('');
    const status = ref({});
    const connHistory = ref([]);
    const cfg = ref({});
    const healthData = ref({});
    const overview = ref({});
    const dictUsage = ref([]);
     const cfgTab = ref('matchers');
     const theme = ref(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');

     function toggleTheme() {
       const newTheme = theme.value === 'dark' ? 'light' : 'dark';
       theme.value = newTheme;
       document.documentElement.setAttribute('data-theme', newTheme);
       try { localStorage.setItem('vn_theme', newTheme); } catch(e) {}
     }
    const rawJson = ref('');
    watch(rawJson, (val) => {
      jsonError.value = '';
      if (!val) return;
      try { JSON.parse(val); } catch (e) { jsonError.value = 'JSON: ' + e.message; }
    });
    const jsonSaving = ref(false);
    const jsonError = ref('');
    const statsData = ref(null);
    const statsType = ref('long');
    const statsError = ref('');
    const expandedUri = ref(null);
    const editMatcherModal = reactive({ show: false, name: '', conditions: '' });

    // ---- Config Rule Editor State ----
    const ruleEditModal = reactive({
      show: false, _isNew: false, _group: '', _index: -1,
      enable: true, matcherType: 'inline', matcherJson: '{}',
      action: 'block', code: 403, to_uri: '', upstream: '',
      root: '', path: '', expires: '', response: '',
    });
    const ruleSaving = ref(false);
    const upstreamKeys = computed(() => Object.keys(cfg.value.backend_upstream || {}).sort());

    // ---- WAF State ----
    const wafTab = ref('rules');
    const wafError = ref('');
    const wafRules = ref([]);
    const wafCategories = ref({});
    const wafPagination = reactive({ page: 1, limit: 20, total: 0, total_pages: 0 });
    const wafFilterCat = ref('');
    const wafFilterSev = ref('');
    const wafStatsData = ref(null);
    const wafStatsError = ref('');
    const wafHistory = ref([]);
    const wafHistError = ref('');
    const wafRolling = ref(false);
    const wafEditModal = reactive({
      show: false, _isNew: false,
      id: '', name: '', description: '', category: '', severity: '',
      action: 'block', code: 403, matcherJson: '{}',
      tagsStr: '',
      rateLimitEnabled: false, rateLimitMax: 10, rateLimitWindow: 60, rateLimitAction: 'log'
    });
    const wafEditError = ref('');
    const wafSaving = ref(false);
    const wafTestRuleJson = ref('');
    const wafTestCasesJson = ref('');
    const wafTestError = ref('');
    const wafTesting = ref(false);
    const wafTestResults = ref(null);
    const wafHits = ref([]);
    const wafHitsError = ref('');
    const wafHitsTime = ref('');
    const wafAnalytics = ref({ rules: [], dead_rules: [] });
    const wafPendingChanges = ref([]);
    const wafTimeline = ref({ buckets: [], categories: [], bucket_minutes: 5, hours: 1 });
    const wafTimelineHours = ref(1);
    const wafTimelineBucket = ref(5);
    const wafTestHistory = ref([]);
    const wafHitDetailModal = reactive({ show: false, loading: false, data: null });
    const wafIpHits = ref([]);
    const wafIpHitsIp = ref('');

    const freqRules = ref([]);
    const freqRuleModal = reactive({ show: false, _isNew: false, id: '', key: 'ip', limit: 60, window: 60, code: 429, matcherJson: '{}' });
    const geoipLookupIP = ref('');
    const geoipLookupResult = ref(null);
    const geoipStats = ref([]);

    const geoipStatus = ref({ available: false, size: 0, last_check: 0, last_update: 0, geodb_path: '' });
    const fingerprints = ref([]);
    const fpCategories = ref({});
    const fpEditModal = reactive({ show: false, _isNew: true, hash: '', name: '', category: 'scanner', action: 'block' });

    // ---- Reputation State ----
    const repStats = ref(null);
    const repFlagged = ref([]);
    const repWhitelist = ref([]);
    const repError = ref('');
    const repNewWhitelist = ref('');
    const repLookupIP = ref('');
    const repLookupResult = ref(null);

    // ---- Audit State ----
    const auditEntries = ref([]);
    const auditError = ref('');
    const auditFilterUser = ref('');
    const auditFilterAction = ref('');
    const auditFilterSince = ref('');
    const auditFilterUntil = ref('');

    const plugins = ref([]);
    const pluginsError = ref('');

    const toastType = ref('info');
    const toastVisible = ref(false);

    function showToast(msg, type) {
      toastMsg.value = msg;
      toastType.value = type || 'info';
      toastVisible.value = true;
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toastVisible.value = false; }, 2500);
    }
    const configImportError = ref('');
    const configImportOk = ref('');
    const topPaths = ref([]);

    const s = computed(() => status.value);

    const connLinePoints = computed(() => {
      const pts = connHistory.value;
      if (pts.length < 2) return '';
      const max = Math.max(...pts, 1);
      const w = 100 / (pts.length - 1);
      return pts.map((v, i) => `${(i * w).toFixed(1)},${(100 - (v / max) * 100).toFixed(1)}`).join(' ');
    });

    const connFillPoints = computed(() => {
      const pts = connHistory.value;
      if (pts.length < 2) return '';
      const max = Math.max(...pts, 1);
      const w = 100 / (pts.length - 1);
      const line = pts.map((v, i) => `${(i * w).toFixed(1)},${(100 - (v / max) * 100).toFixed(1)}`).join(' ');
      return `0,100 ` + line + ` 100,100`;
    });

    // ---- Auto-login on page load (check existing session cookie) ----
    async function checkSession() {
      try {
        const d = await api('GET', '/verynginx/csrf');
        csrfToken = d.csrf_token;
        store.loggedIn = true;
        store.user = 'verynginx';
        await loadData();
        if (page.value === 'status') startStatusRefresh();
      } catch {}
    }
    checkSession();

    // ---- Login ----
    async function doLogin() {
      loginError.value = '';
      if (!loginUser.value || !loginPass.value) { loginError.value = 'User and password required.'; return; }
      loading.value = true;
      try {
        const params = new URLSearchParams();
        params.append('user', loginUser.value);
        params.append('password', loginPass.value);
        const d = await api('POST', '/verynginx/login', params);
        loginPass.value = '';
        if (d.ret === 'success') {
          store.loggedIn = true;
          store.user = loginUser.value;
          loginUser.value = '';
          await refreshCsrf();
          loadData();
          if (page.value === 'status') startStatusRefresh();
        } else {
          loginError.value = d.message || 'Login failed';
        }
      } catch (e) {
        loginError.value = e.message;
      }
      loading.value = false;
    }

    // ---- Logout ----
    function doLogout() {
      document.cookie = 'verynginx_session=; Path=/; Max-Age=0';
      csrfToken = null;
      store.loggedIn = false;
      store.user = null;
    }

    // ---- Load ----
    async function loadData() {
      await Promise.all([loadStatus(), loadConfig()]);
      loadHealth();
    }

    async function loadStatus() {
      try {
        const s = await api('GET', '/verynginx/status');
        status.value = s;
        // Push to connection history ring buffer (max 60 points, 3s each = 3 min)
        const h = connHistory.value;
        h.push(s.connections_active || 0);
        if (h.length > 60) h.shift();
        connHistory.value = [...h];
      } catch {}
    }

    async function loadConfig() {
      try {
        const d = await api('GET', '/verynginx/config');
        cfg.value = d;
        rawJson.value = JSON.stringify(d, null, 2);
      } catch {}
    }

    async function loadHealth() {
      try {
        const d = await api('GET', '/verynginx/upstreams/health');
        if (d.ret === 'success') healthData.value = d.data || {};
      } catch {}
    }

    // ---- Matchers ----
    const matcherKeys = computed(() => Object.keys(cfg.value.matcher || {}).sort());
    const respKeys = computed(() => Object.keys(cfg.value.response || {}).sort());

    function editMatcher(name) {
      if (name) {
        editMatcherModal._origName = name;
        editMatcherModal.name = name;
        editMatcherModal.conditions = JSON.stringify(cfg.value.matcher[name], null, 2);
      } else {
        editMatcherModal._origName = null;
        editMatcherModal.name = '';
        editMatcherModal.conditions = '{}';
      }
      editMatcherModal.show = true;
    }

    function saveMatcher() {
      try {
        const updated = JSON.parse(editMatcherModal.conditions);
        const newCfg = JSON.parse(JSON.stringify(cfg.value));
        if (editMatcherModal._origName && editMatcherModal._origName !== editMatcherModal.name) {
          delete newCfg.matcher[editMatcherModal._origName];
        }
        newCfg.matcher[editMatcherModal.name] = updated;
        commitConfig(newCfg);
        editMatcherModal.show = false;
      } catch (e) {
        alert('Invalid JSON: ' + e.message);
      }
    }

    function deleteMatcher(name) {
      if (!confirm(`Delete matcher "${name}"?`)) return;
      const newCfg = JSON.parse(JSON.stringify(cfg.value));
      delete newCfg.matcher[name];
      commitConfig(newCfg);
    }

    // ---- Config Rules CRUD ----
    function ruleEditReset() {
      ruleEditModal.enable = true;
      ruleEditModal.matcherType = 'inline';
      ruleEditModal.matcherJson = '{}';
      ruleEditModal.action = 'block';
      ruleEditModal.code = 403;
      ruleEditModal.to_uri = '';
      ruleEditModal.upstream = '';
      ruleEditModal.root = '';
      ruleEditModal.path = '';
      ruleEditModal.expires = '';
      ruleEditModal.response = '';
    }

    function ruleOpenCreate(group) {
      ruleEditReset();
      ruleEditModal._isNew = true;
      ruleEditModal._group = group;
      ruleEditModal.show = true;
    }

    function ruleOpenEdit(rule, group, idx) {
      ruleEditReset();
      ruleEditModal._isNew = false;
      ruleEditModal._group = group;
      ruleEditModal._index = idx;
      ruleEditModal.enable = rule.enable !== false;
      if (typeof rule.matcher === 'string') {
        ruleEditModal.matcherType = rule.matcher;
        ruleEditModal.matcherJson = '{}';
      } else {
        ruleEditModal.matcherType = 'inline';
        ruleEditModal.matcherJson = JSON.stringify(rule.matcher, null, 2);
      }
      ruleEditModal.action = rule.action || 'block';
      ruleEditModal.code = rule.code || 403;
      ruleEditModal.to_uri = rule.to_uri || '';
      ruleEditModal.upstream = rule.upstream || '';
      ruleEditModal.root = rule.root || '';
      ruleEditModal.path = rule.path || '';
      ruleEditModal.expires = rule.expires || '';
      ruleEditModal.response = typeof rule.response === 'string' ? rule.response : '';
      ruleEditModal.show = true;
    }

    function ruleEditModalChanged() {
      // Clear stale fields when action changes
      if (ruleEditModal.action !== 'block') { ruleEditModal.response = ''; }
      if (ruleEditModal.action !== 'redirect' && ruleEditModal.action !== 'block') { ruleEditModal.code = 403; }
      if (ruleEditModal.action !== 'redirect' && ruleEditModal.action !== 'rewrite') { ruleEditModal.to_uri = ''; }
      if (ruleEditModal.action !== 'proxy') { ruleEditModal.upstream = ''; }
      if (ruleEditModal.action !== 'static') { ruleEditModal.root = ''; ruleEditModal.path = ''; ruleEditModal.expires = ''; }
      if (ruleEditModal.action !== 'response') { ruleEditModal.response = ''; }
    }

    function ruleBuildRule() {
      const rule = { enable: ruleEditModal.enable };
      if (ruleEditModal.matcherType === 'inline') {
        try { rule.matcher = JSON.parse(ruleEditModal.matcherJson); } catch { rule.matcher = {}; }
      } else {
        rule.matcher = ruleEditModal.matcherType;
      }
      rule.action = ruleEditModal.action;
      if (ruleEditModal.action === 'block' || ruleEditModal.action === 'response') {
        if (ruleEditModal.code) rule.code = ruleEditModal.code;
        if (ruleEditModal.response) {
          try { rule.response = JSON.parse(ruleEditModal.response); } catch { rule.response = ruleEditModal.response; }
        }
      }
      if (ruleEditModal.action === 'redirect' || ruleEditModal.action === 'rewrite') {
        if (ruleEditModal.to_uri) rule.to_uri = ruleEditModal.to_uri;
      }
      if (ruleEditModal.action === 'redirect') {
        if (ruleEditModal.code) rule.code = ruleEditModal.code;
      }
      if (ruleEditModal.action === 'proxy') {
        if (ruleEditModal.upstream) rule.upstream = ruleEditModal.upstream;
      }
      if (ruleEditModal.action === 'static') {
        if (ruleEditModal.root) rule.root = ruleEditModal.root;
        if (ruleEditModal.path) rule.path = ruleEditModal.path;
        if (ruleEditModal.expires) rule.expires = ruleEditModal.expires;
      }
      return rule;
    }

    // ---- Dict Usage ----
    async function loadDictUsage() {
      try {
        const text = await api('GET', '/verynginx/metrics', null, { text: true });
        const parsed = parsePrometheus(typeof text === 'string' ? text : '');
        const dicts = [];
        const pctMap = {}, usedMap = {}, capMap = {};
        for (const [key, vals] of Object.entries(parsed)) {
          for (const [labels, val] of Object.entries(vals)) {
            const lb = JSON.parse(labels);
            if (key.startsWith('shared_dict_usage_pct')) {
              pctMap[lb.dict] = val;
            } else if (key.startsWith('shared_dict_usage_bytes')) {
              usedMap[lb.dict] = val;
            } else if (key.startsWith('shared_dict_capacity_bytes')) {
              capMap[lb.dict] = val;
            }
          }
        }
        for (const name of Object.keys(pctMap).sort()) {
          dicts.push({
            name,
            pct: pctMap[name] || 0,
            used: usedMap[name] || 0,
            cap: capMap[name] || 0
          });
        }
        dictUsage.value = dicts;
      } catch {}
    }

    // ---- Overview ----
    function parsePrometheus(text) {
      const result = {};
      const lines = text.split('\n');
      for (const line of lines) {
        if (line.startsWith('#') || !line.trim()) continue;
        // Match: name{labels} value
        const m = line.match(/^([a-zA-Z_:][a-zA-Z0-9_:]*)\s*(\{.*?\})?\s+([0-9.e+\-]+)/);
        if (!m) continue;
        const name = m[1];
        const labelStr = m[2] || '';
        const value = parseFloat(m[3]);
        // Parse labels
        const labels = {};
        if (labelStr) {
          const inner = labelStr.slice(1, -1);
          for (const pair of inner.split(',')) {
            const eq = pair.indexOf('=');
            if (eq < 0) continue;
            const lk = pair.slice(0, eq).trim();
            const lv = pair.slice(eq + 1).replace(/^"|"$/g, '');
            labels[lk] = lv;
          }
        }
        if (!result[name]) result[name] = {};
        const lk = JSON.stringify(labels);
        result[name][lk] = value;
      }
      return result;
    }

    async function loadOverview() {
      const o = { conn_active: 0, req_rate: 0, up_healthy: 0, up_total: 0, waf_hits: 0, dicts: [], top_uris: [], plugin_errors: [] };
      try {
        // Status: connection counts
        const s = await api('GET', '/verynginx/status');
        o.conn_active = s.connections_active || 0;

        // Health: upstream node status
        const h = await api('GET', '/verynginx/upstreams/health');
        if (h.ret === 'success') {
          for (const [name, nodes] of Object.entries(h.data || {})) {
            for (const n of nodes) {
              o.up_total++;
              if (n.healthy && !n.circuit_open) o.up_healthy++;
            }
          }
        }

        // Metrics: shared dict usage, plugin errors, request total
        const m = await api('GET', '/verynginx/metrics', null, { text: true });
        const parsed = parsePrometheus(typeof m === 'string' ? m : '');

        for (const [key, vals] of Object.entries(parsed)) {
          if (key.startsWith('shared_dict_usage_pct')) {
            for (const [labels, val] of Object.entries(vals)) {
              const lb = JSON.parse(labels);
              if (lb.dict) o.dicts.push({ name: lb.dict, pct: val, used: 0, cap: 0 });
            }
          } else if (key.startsWith('shared_dict_usage_bytes')) {
            for (const [labels, val] of Object.entries(vals)) {
              const lb = JSON.parse(labels);
              const d = (o.dicts || []).find(x => x.name === lb.dict);
              if (d) { d.used = val; if (!d.cap) { const p = parsed['shared_dict_capacity_bytes']; if (p) for (const [lk, v] of Object.entries(p)) { const l = JSON.parse(lk); if (l.dict === lb.dict) d.cap = v; } } }
            }
          } else if (key === 'vn_plugin_errors_total') {
            for (const [labels, val] of Object.entries(vals)) {
              const lb = JSON.parse(labels);
              o.plugin_errors.push({ plugin: lb.plugin || '?', phase: lb.phase || '?', count: val });
            }
          } else if (key === 'plugin_duration_seconds_count') {
            for (const [labels, val] of Object.entries(vals)) {
              const lb = JSON.parse(labels);
              o._plugin_dur_count = o._plugin_dur_count || {};
              const k = (lb.plugin || '?') + '|' + (lb.phase || '?');
              o._plugin_dur_count[k] = val;
            }
          } else if (key === 'plugin_duration_seconds_sum') {
            for (const [labels, val] of Object.entries(vals)) {
              const lb = JSON.parse(labels);
              o._plugin_dur_sum = o._plugin_dur_sum || {};
              const k = (lb.plugin || '?') + '|' + (lb.phase || '?');
              o._plugin_dur_sum[k] = val;
            }
          } else if (key === 'vn_requests_total') {
            o.req_rate = Math.round(Object.values(vals)[0] || 0);
          }
        }

        // Summary: top URIs
        const sum = await api('GET', '/verynginx/summary?type=short');
        if (sum.ret === 'success' && sum.data) {
          const entries = Object.entries(sum.data).map(([uri, v]) => ({
            uri,
            count: v.count || 0,
            bytes: v.bytes || 0,
            success_rate: v.count ? ((v.success || 0) / v.count * 100) : 100
          }));
          entries.sort((a, b) => b.count - a.count);
          o.top_uris = entries.slice(0, 10);
        }

        // WAF hits summary
        try {
          const w = await api('GET', '/verynginx/waf/stats');
          if (w.ret === 'success' && w.data) {
            o.waf_hits = Object.values(w.data).reduce((s, r) => s + (r.hits || 0), 0);
          }
        } catch {}

        // Reputation summary
        try {
          const r = await api('GET', '/verynginx/reputation/stats');
          if (r.ret === 'success' && r.data) {
            o.flagged = r.data.flagged || 0;
          }
        } catch {}
      } catch (e) {
        console.warn('Overview load error:', e.message);
      }
      // Merge plugin errors with duration into plugin_perf
      const perfMap = {};
      for (const e of (o.plugin_errors || [])) {
        const k = e.plugin + '|' + e.phase;
        perfMap[k] = { plugin: e.plugin, phase: e.phase, errors: e.count, avg_ms: 0, count: 0 };
      }
      for (const [k, cnt] of Object.entries(o._plugin_dur_count || {})) {
        if (!perfMap[k]) perfMap[k] = { plugin: k.split('|')[0], phase: k.split('|')[1], errors: 0, avg_ms: 0, count: 0 };
        perfMap[k].count = cnt;
      }
      for (const [k, sum] of Object.entries(o._plugin_dur_sum || {})) {
        if (perfMap[k]) {
          perfMap[k].avg_ms = perfMap[k].count > 0 ? (sum / perfMap[k].count) * 1000 : 0;
        }
      }
      o.plugin_perf = Object.values(perfMap).sort((a, b) => b.avg_ms - a.avg_ms);
      o.plugin_errors = undefined;
      o._plugin_dur_count = undefined;
      o._plugin_dur_sum = undefined;
      overview.value = o;
    }

    // Auto-refresh overview every 5s

    // ---- Helpers ----
    function formatTime(t) {
      if (!t) return '-';
      return new Date(t * 1000).toLocaleString();
    }

    function formatBytes(b) {
      if (b == null) return '-';
      if (b < 1024) return b.toFixed(0) + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      return (b / 1048576).toFixed(1) + ' MB';
    }

    function calcSuccess(v) {
      let ok = 0, total = 0;
      for (const code in v.status || {}) {
        const c = v.status[code];
        total += c;
        if (parseInt(code) < 400) ok += c;
      }
      return total ? ((ok / total) * 100).toFixed(1) : '0.0';
    }

    function successClass(v) {
      const p = parseFloat(calcSuccess(v));
      if (p >= 99) return 'tag-ok';
      if (p >= 90) return 'tag-warn';
      return 'tag-err';
    }

    function summarizeRule(r) {
      const parts = [];
      if (r.to_uri) parts.push('→ ' + r.to_uri);
      if (r.upstream) parts.push('→ ' + r.upstream);
      if (r.code) parts.push('HTTP ' + r.code);
      if (r.scheme) parts.push(r.scheme);
      if (r.rate) parts.push(r.rate);
      return parts.join(', ') || '-';
    }

    function actionClass(a) {
      if (a === 'block' || a === 'filter') return 'tag-err';

          } : {}
        };
        const a = JSON.stringify(orig, null, 2).split('\n');
        const b = JSON.stringify(changed, null, 2).split('\n');
        const diff = [];
        const maxLen = Math.max(a.length, b.length);
        for (let i = 0; i < maxLen; i++) {
          const left = a[i] || '';
          const right = b[i] || '';
          if (left !== right) {
            if (left) diff.push({ type: 'removed', text: left });
            if (right) diff.push({ type: 'added', text: right });
          }
        }
        return diff;
      } catch (e) {
        return [];
      }
    }

    const VALID_CATEGORIES = ['sqli', 'xss', 'rce', 'lfi', 'path_traversal', 'scanner', 'bot', 'brute', 'spam', 'custom'];
    const VALID_SEVERITIES = ['critical', 'high', 'medium', 'low'];
    const VALID_ACTIONS = ['block', 'accept', 'log', 'challenge'];

    async function wafSaveRule() {
      wafEditError.value = '';
      const m = wafEditModal;
      if (!m.name) { wafEditError.value = 'Name is required'; return; }
      if (!m.category) { wafEditError.value = 'Category is required'; return; }
      if (VALID_CATEGORIES.indexOf(m.category) === -1) { wafEditError.value = 'Invalid category: ' + m.category; return; }
      if (!m.severity) { wafEditError.value = 'Severity is required'; return; }
      if (VALID_SEVERITIES.indexOf(m.severity) === -1) { wafEditError.value = 'Invalid severity: ' + m.severity; return; }
      if (!m.action) { wafEditError.value = 'Action is required'; return; }
      if (VALID_ACTIONS.indexOf(m.action) === -1) { wafEditError.value = 'Invalid action: ' + m.action; return; }

      let matcherObj;
      try {
        matcherObj = JSON.parse(m.matcherJson);
      } catch (e) {
        wafEditError.value = 'Invalid matcher JSON: ' + e.message;
        return;
      }

      const tags = m.tagsStr.split(',').map(t => t.trim()).filter(t => t);

      const rule = {
        name: m.name,
        description: m.description || undefined,
        category: m.category,
        severity: m.severity,
        action: m.action,
        code: m.code || undefined,
        matcher: matcherObj,
        tags: tags.length ? tags : undefined
      };

      if (m.rateLimitEnabled) {
        rule.rate_limit = {
          enable: true,
          max_hits: m.rateLimitMax,
          window: m.rateLimitWindow,
          action: m.rateLimitAction
        };
      }

      wafSaving.value = true;
      try {
        let d;
        if (m._isNew) {
          d = await api('POST', '/verynginx/waf/rules', rule);
        } else {
          // Stage the change (requires confirmation via History tab)
          d = await api('POST', '/verynginx/waf/rules/' + m.id + '/stage', rule);
        }
        if (d.ret === 'success') {
          wafEditModal.show = false;
          if (!m._isNew) {
            showToast('规则变更已暂存，请在 History 标签中确认发布', 'info');
          }
          await loadWafRules();
          loadWafHistory();
        } else {
          wafEditError.value = d.message || 'Save failed';
        }
      } catch (e) {
        wafEditError.value = e.message;
      }
      wafSaving.value = false;
    }

    async function loadGeoIP() {

        if (cfgRes.ret === 'success') {
          const cfg = cfgRes.data || {};
          // Determine mirror source from config
          let mirror = 'auto';
          let custom_mirror_url = '';
          if (cfg.cdn_url || cfg.update_url) {
            const url = cfg.cdn_url || cfg.update_url;
            const MIRROR_MAP = {
              'https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-City.mmdb': 'p3terx',
              'https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb': 'loyalsoldier_raw',
              'https://github.com/Loyalsoldier/geoip/releases/latest/download/Country.mmdb': 'loyalsoldier_release',
            };
            mirror = MIRROR_MAP[url] || 'custom';
            if (mirror === 'custom') custom_mirror_url = url;
          }
          geoipConfig.value = {
            enable: cfg.enable || false,
            geodb_path: cfg.geodb_path || '',
            whitelistStr: (cfg.whitelist || []).join(','),
            blocklistStr: (cfg.blocklist || []).join(','),
            auto_update: cfg.auto_update !== false,
            update_interval_hours: cfg.update_interval_hours || 168,
            mirror, custom_mirror_url,
            license_key: cfg.license_key || '',
          };
        }
        if (statsRes.ret === 'success') geoipStats.value = Object.entries(statsRes.data || {}).map(([code, count]) => ({ code, count })).sort((a, b) => b.count - a.count).slice(0, 20);

    async function exportConfig() {
      try {
        const opts = { method: 'GET', credentials: 'same-origin' };
        if (csrfToken) {
          opts.headers = { 'X-CSRF-Token': csrfToken };
        }
        const res = await fetch('/verynginx/config/export', opts);
        if (!res.ok) { alert('Export failed: HTTP ' + res.status); return; }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'config.json';
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (e) {
        alert('Export failed: ' + e.message);
      }
    }

    async function onImportFile(e) {
      configImportError.value = '';
      configImportOk.value = '';
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (file.size > 1048576) { configImportError.value = 'File too large (max 1 MB)'; return; }
      const text = await file.text();
      try {
        const parsed = JSON.parse(text);
        const d = await api('POST', '/verynginx/config/import', parsed);
        if (d.ret === 'success') {
          configImportOk.value = 'Configuration imported successfully.';
          await loadConfig();
        } else {
          configImportError.value = d.message || 'Import failed';
        }
      } catch (e) {
        configImportError.value = e.message;
      }
      e.target.value = '';
    }

      try {
        const d = await api('GET', '/verynginx/stats/top-paths?limit=20');
        if (d.ret === 'success') {
          topPaths.value = d.data || [];
        }
      } catch {}
    }

    async function wafRunTest() {
      wafTestError.value = '';
      wafTestResults.value = null;

      let rule, cases;
      try {
        rule = JSON.parse(wafTestRuleJson.value);
      } catch (e) {
        wafTestError.value = 'Invalid rule JSON: ' + e.message;
        return;
      }
      try {
        cases = JSON.parse(wafTestCasesJson.value);
        if (!Array.isArray(cases) || !cases.length) throw new Error('Must be a non-empty array');
      } catch (e) {
        wafTestError.value = 'Invalid test cases JSON: ' + e.message;
        return;
      }

      wafTesting.value = true;
      try {
        const d = await api('POST', '/verynginx/waf/rules/test', { rule, test_cases: cases });
        if (d.ret === 'success') {
          wafTestResults.value = d.data;
          await loadTestHistory();
        } else {
          wafTestError.value = d.message || 'Test failed';
        }
      } catch (e) {
        wafTestError.value = e.message;
      }
      wafTesting.value = false;
    }
