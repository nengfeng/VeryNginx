<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VeryNginx v2 管理面板</title>
<!-- Vue 3: local copy with SRI, CDN fallback for air-gapped/offline safety -->
<script src="/verynginx/static/vue.global.prod.js" integrity="sha384-yrrm1s9PCS0I4n39ldjMqQlTorYls89GAS3wXVJooje/BSWnC2vTgky2LIyzRLEo" crossorigin="anonymous"></script>
<script>
  // Fallback: if local Vue failed to load (e.g. wrong path), try CDN
  if (typeof Vue === 'undefined') {
    document.write('<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"><\/script>');
  }
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f6fa;--card:#fff;--border:#e0e3eb;--text:#1a1a2e;--muted:#6b7280;--primary:#4361ee;--primary-hover:#3a56d4;--danger:#e63946;--success:#2ec4b6;--warning:#f4a261}
[data-theme="dark"]{--bg:#1a1a2e;--card:#2d2d44;--border:#3d3d5c;--text:#e0e0e0;--muted:#9ca3af;--primary:#6366f1;--primary-hover:#4f46e5;--danger:#ef4444;--success:#10b981;--warning:#f59e0b}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}
input,select,textarea,button{font:inherit}
button{cursor:pointer;border:none;border-radius:6px;padding:8px 16px;font-size:14px}
button.primary{background:var(--primary);color:#fff}button.primary:hover{background:var(--primary-hover)}
button.danger{background:var(--danger);color:#fff}
button.small{padding:4px 10px;font-size:12px}
button.outline{background:transparent;border:1px solid var(--border);color:var(--text)}
button.outline:hover{background:var(--bg)}
input,select,textarea{border:1px solid var(--border);border-radius:6px;padding:8px 12px;width:100%;background:var(--card)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:-1px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
tr:hover{background:#f0f2f8}
pre{background:#1a1a2e;color:#e0e3eb;padding:16px;border-radius:8px;overflow:auto;font-size:13px;line-height:1.5;max-height:60vh}
textarea.code-editor{background:#1a1a2e;color:#e0e3eb;padding:16px;border-radius:8px;border:none;width:100%;font:13px/1.5 monospace;resize:vertical;min-height:200px;box-sizing:border-box}
textarea.code-editor:focus{outline:1px solid var(--primary)}
.card{background:var(--card);border-radius:10px;padding:20px;border:1px solid var(--border);margin-bottom:16px}
.grid{display:grid;gap:16px}.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr 1fr}.grid-4{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.flex{display:flex;align-items:center}.flex-between{justify-content:space-between}.gap-8{gap:8px}.gap-16{gap:16px}
.mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}.mt-16{margin-top:16px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.tag-ok{background:#d1fae5;color:#065f46}.tag-err{background:#fee2e2;color:#991b1b}.tag-warn{background:#fef3c7;color:#92400e}
/* Login */
#login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--card);border-radius:12px;padding:40px;width:100%;max-width:400px;border:1px solid var(--border);box-shadow:0 4px 24px rgba(0,0,0,.06)}
.login-box h1{font-size:24px;margin-bottom:4px;text-align:center}
.login-box .sub{color:var(--muted);font-size:14px;text-align:center;margin-bottom:24px}
.login-box .field{margin-bottom:16px}
.login-box .field label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--muted)}
.error{background:#fee2e2;color:#991b1b;padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:16px}
.login-box button{width:100%;padding:12px;font-size:15px}
/* Top nav */
#topnav{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;height:56px;position:sticky;top:0;z-index:100}
#topnav .brand{font-weight:700;font-size:16px;margin-right:32px;color:var(--text)}
#topnav .brand small{font-weight:400;color:var(--muted);font-size:12px}
#topnav nav{display:flex;gap:4px;flex:1}
#topnav nav a{padding:8px 14px;border-radius:6px;font-size:14px;color:var(--text);cursor:pointer;transition:background .15s}
#topnav nav a:hover{background:var(--bg);text-decoration:none}
#topnav nav a.active{background:var(--primary);color:#fff}
#topnav .user-area{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
/* Main layout */
#main{padding:24px;max-width:1200px;margin:0 auto}
.page-title{font-size:22px;font-weight:700;margin-bottom:20px}
/* Status cards */
.stat-card{background:var(--card);border-radius:10px;padding:20px;border:1px solid var(--border);text-align:center}
.stat-card .stat-value{font-size:32px;font-weight:700;margin-top:4px}
.stat-card .stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
/* Config tabs */
.config-tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.config-tabs .tab-sep{font-size:11px;color:var(--muted);margin:0 4px 0 10px;font-weight:600;letter-spacing:.5px;opacity:.7}
.config-tabs a{padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--text);border:1px solid transparent;transition:all .15s}
.config-tabs a:hover{background:var(--bg);text-decoration:none}
.config-tabs a.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.config-section h3{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.config-section h3 small{font-weight:400;font-size:12px;color:var(--muted)}
/* Actions */
.actions{display:flex;gap:8px;justify-content:center}
.actions button{padding:4px 8px;font-size:11px}
/* Empty state */
.empty{color:var(--muted);font-size:14px;padding:24px;text-align:center}
/* Health dots */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.dot.green{background:#22c55e}
.dot.yellow{background:#eab308}
.dot.orange{background:#f97316}
.dot.red{background:#ef4444}
.dot.gray{background:#9ca3af}
/* Modal overlay */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:var(--card);border-radius:12px;padding:24px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto}
.modal h3{font-size:16px;margin-bottom:16px}
.modal .field{margin-bottom:12px}
.modal .field label{display:block;font-size:12px;font-weight:600;margin-bottom:3px;color:var(--muted)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* Inline JSON */
.json-inline{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:768px){.grid-2,.grid-3{grid-template-columns:1fr}#topnav{padding:0 12px;flex-wrap:wrap;height:auto;padding:8px 12px}#topnav nav{gap:2px}#topnav nav a{padding:6px 10px;font-size:12px}#main{padding:12px;overflow-x:auto}#main table th,#main table td{white-space:nowrap}.stat-card .stat-value{font-size:24px}}
.toast{position:fixed;top:20px;right:20px;z-index:9999;padding:12px 20px;border-radius:8px;color:#fff;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;transform:translateY(-10px);transition:all .3s ease;pointer-events:none;max-width:360px}
.toast.show{opacity:1;transform:translateY(0)}.toast.success{background:var(--success)}.toast.error{background:var(--danger)}.toast.info{background:var(--primary)}
/* KB Dashboard: per-rule reachability rows (Design §12.2) */
.kb-rule-row{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;position:relative}
.kb-rule-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.kb-rule-id{font-family:ui-monospace,monospace;font-size:12px;font-weight:600;flex:1}
.kb-rule-bar-wrap{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-bottom:8px}
.kb-rule-bar{height:100%;background:linear-gradient(90deg,#3b82f6,#10b981);border-radius:3px;transition:width .3s}
.kb-rule-meta{display:flex;gap:12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.kb-rule-reasons{color:var(--warning)}
.kb-rule-detail{margin-top:8px;padding:8px;background:var(--bg);border-radius:6px}
.kb-rule-toggle{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 6px}
.tag-info{background:#dbeafe;color:#1e40af}
/* Sub-tabs (KB page) */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.tabs a{padding:6px 14px;border-radius:6px 6px 0 0;font-size:13px;cursor:pointer;color:var(--text);border:1px solid transparent;border-bottom:none;margin-bottom:-1px;transition:all .15s}
.tabs a:hover{background:var(--bg);text-decoration:none}
.tabs a.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* KB controls: normalize mixed checkbox/select field rows */
.kb-controls .field{display:flex;flex-direction:column;justify-content:flex-end}
.kb-controls .field>label{font-size:12px;color:var(--muted)}
.kb-controls .field select,.kb-controls .field input{margin-top:4px}
.kb-controls .field>label.kb-check{display:flex;align-items:center;gap:6px;min-height:34px}
.kb-controls .field>label.kb-check>input[type=checkbox]{width:auto;margin:0}
</style>
</head>
<body>

<div id="app">
  <div class="toast" :class="[toastType, { show: toastVisible }]">{{ toastMsg }}</div>
  <!-- Login -->
  <div id="login-page" v-if="!store.loggedIn">
    <div class="login-box">
      <h1>VeryNginx</h1>
      <p class="sub">v2.0 — WAF 与反向代理管理</p>
      <div class="error" v-if="loginError">{{ loginError }}</div>
      <div class="field">
        <label>用户名</label>
        <input v-model.trim="loginUser" type="text" placeholder="管理员用户名" @keyup.enter="doLogin">
      </div>
      <div class="field">
        <label>密码</label>
        <input v-model.trim="loginPass" type="password" placeholder="输入密码" @keyup.enter="doLogin">
      </div>
      <button class="primary" :disabled="loading" @click="doLogin">{{ loading ? '登录中…' : '登录' }}</button>
    </div>
  </div>

  <!-- App -->
  <template v-else>
    <div id="topnav">
      <span class="brand">VeryNginx <small>v2{{ versionInfo.commit ? ' · ' + versionInfo.commit.slice(0,8) : '' }}</small></span>
      <nav>
        <a :class="{active:page==='dashboard'}" @click="page='dashboard'">仪表盘</a>
        <a :class="{active:page==='config'}" @click="page='config'">配置</a>
        <a :class="{active:page==='waf'}" @click="page='waf';loadWafData()">WAF</a>
        <a :class="{active:page==='frequency'}" @click="page='frequency';loadFrequencyData()">频率限制</a>
        <a :class="{active:page==='reputation'}" @click="page='reputation';loadRepData()">IP 声誉</a>
        <a :class="{active:page==='geoip'}" @click="page='geoip';loadGeoIP();loadGeoIPStatus()">GeoIP</a>
        <a :class="{active:page==='kb'}" @click="page='kb';loadKbData()">内核封禁</a>
        <a :class="{active:page==='advanced'}" @click="page='advanced'">高级</a>
        <a :class="{active:page==='about'}" @click="page='about'">关于</a>
      </nav>
      <div class="user-area">
        <button class="outline small" @click="toggleTheme" :title="theme==='dark'?'切换到浅色模式':'切换到深色模式'" style="padding:4px 8px">
          {{ theme === 'dark' ? '☀' : '🌙' }}
        </button>
        <span>{{ store.user }}</span>
        <button class="outline small" @click="doLogout">退出</button>
      </div>
    </div>

    <div id="main">
      <!-- Dashboard sub-tabs -->
      <div v-if="page==='dashboard'" class="config-tabs" style="margin-bottom:16px">
        <a :class="{active:dashTab==='overview'}" @click="dashTab='overview'">概览</a>
        <a :class="{active:dashTab==='status'}" @click="dashTab='status'">连接</a>
        <a :class="{active:dashTab==='stats'}" @click="dashTab='stats';loadStats()">统计</a>
      </div>

      <!-- Overview -->
      <div v-if="page==='dashboard' && dashTab==='overview'">
        <h2 class="page-title">系统概览</h2>
        <!-- Top row: connections + upstream -->
        <div class="grid grid-4 mb-16">
          <div class="stat-card">
            <div class="stat-label">活跃连接</div>
            <div class="stat-value" :style="{color: (overview.conn_active||0) > 1000 ? '#ef4444' : ''}">{{ overview.conn_active || 0 }}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">请求/分钟</div>
            <div class="stat-value">{{ formatNumber(overview.req_rate || 0) }}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">上游健康</div>
            <div class="stat-value">
              <span :style="{color: overview.up_healthy === overview.up_total && overview.up_total > 0 ? '#22c55e' : overview.up_healthy > 0 ? '#eab308' : '#ef4444'}">
                {{ overview.up_healthy || 0 }}
              </span>
              <span style="font-size:18px;color:var(--muted)"> / {{ overview.up_total || 0 }}</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-label">WAF 命中/分钟</div>
            <div class="stat-value" :style="{color: (overview.waf_hits||0) > 100 ? '#f97316' : ''}">{{ formatNumber(overview.waf_hits || 0) }}</div>
          </div>
          <div class="stat-card" v-if="overview.flagged !== undefined">
            <div class="stat-label">已标记 IP</div>
            <div class="stat-value" :style="{color: (overview.flagged||0) > 0 ? '#ef4444' : ''}">{{ overview.flagged }}</div>
          </div>
        </div>
        <!-- Second row: memory + errors -->
        <div class="grid grid-3 mb-16">
          <div class="stat-card" v-for="d in overview.dicts || []" :key="d.name">
            <div class="stat-label">共享字典: {{ d.name }}</div>
            <div class="stat-value" style="font-size:20px" :style="{color: d.pct > 80 ? '#ef4444' : d.pct > 60 ? '#eab308' : ''}">{{ d.pct.toFixed(1) }}%</div>
            <div style="font-size:11px;color:var(--muted)">{{ formatBytes(d.used) }} / {{ formatBytes(d.cap) }}</div>
          </div>
        </div>
        <!-- Third row: top URIs + plugin errors -->
        <div class="grid grid-2 mb-16">
          <div class="card">
            <strong>请求最多 URI</strong>
            <table style="font-size:12px;margin-top:8px" v-if="(overview.top_uris || []).length">
              <thead><tr><th>URI</th><th>次数</th><th>流量</th><th>成功率</th></tr></thead>
              <tbody>
                <tr v-for="u in overview.top_uris" :key="u.uri">
                  <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ u.uri }}</td>
                  <td>{{ formatNumber(u.count) }}</td>
                  <td>{{ formatBytes(u.bytes) }}</td>
                  <td><span :class="successClass(u.success_rate)">{{ (u.success_rate || 0).toFixed(1) }}%</span></td>
                </tr>
              </tbody>
            </table>
             <div v-else class="empty">暂无数据</div>
          </div>
          <div class="card">
            <strong>插件性能</strong>
            <table style="font-size:12px;margin-top:8px" v-if="(overview.plugin_perf || []).length">
              <thead><tr><th>插件</th><th>阶段</th><th>平均耗时</th><th>错误</th></tr></thead>
              <tbody>
                 <tr v-for="e in overview.plugin_perf" :key="e.plugin + e.phase">
                   <td>{{ e.plugin }}</td>
                   <td>{{ e.phase }}</td>
                   <td :style="{color: e.avg_ms > 50 ? '#f97316' : ''}">{{ e.avg_ms.toFixed(1) }}ms</td>
                   <td><span :style="{color: e.errors > 0 ? '#ef4444' : ''}">{{ formatNumber(e.errors) }}</span></td>
                </tr>
              </tbody>
            </table>
            <div v-else class="empty">暂无数据</div>
          </div>
        </div>
      </div>

      <!-- Status -->
      <div v-if="page==='dashboard' && dashTab==='status'">
        <h2 class="page-title">连接状态</h2>
        <div class="grid grid-4 mb-16">
          <div class="stat-card"><div class="stat-label">活跃连接</div><div class="stat-value">{{ s.connections_active || 0 }}</div></div>
          <div class="stat-card"><div class="stat-label">读取中</div><div class="stat-value">{{ s.connections_reading || 0 }}</div></div>
          <div class="stat-card"><div class="stat-label">写入中</div><div class="stat-value">{{ s.connections_writing || 0 }}</div></div>
          <div class="stat-card"><div class="stat-label">等待中</div><div class="stat-value">{{ s.connections_waiting || 0 }}</div></div>
        </div>
        <!-- Connection trend chart -->
        <div class="card mb-16" v-if="connHistory.length > 1">
            <strong>连接趋势 (最近 3 分钟)</strong>
          <svg width="100%" height="120" style="margin-top:8px">
            <polyline :points="connLinePoints" fill="none" stroke="#4f8af0" stroke-width="2" />
            <polyline :points="connFillPoints" fill="rgba(79,138,240,0.1)" stroke="none" />
          </svg>
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:2px">
            <span>{{ connHistory.length * 3 }}秒前</span>
            <span>现在</span>
          </div>
        </div>
        <div class="card">
          <div class="flex flex-between mb-8">
            <strong>状态信息</strong>
            <button class="outline small" @click="loadStatus">刷新</button>
          </div>
          <table>
            <tr><th>时间</th><td>{{ formatTime(s.time) }}</td></tr>
            <tr><th>运行状态</th><td><span class="tag tag-ok">在线</span></td></tr>
          </table>
        </div>
      </div>

      <!-- Config -->
      <div v-if="page==='config'">
        <div class="flex flex-between" style="align-items:flex-start">
          <h2 class="page-title" style="margin-bottom:0">配置管理</h2>
          <div class="flex gap-8">
            <button class="outline small" @click="refreshConfig">刷新</button>
            <button class="outline small" @click="exportConfig">导出</button>
            <button class="outline small" @click="importConfig">导入</button>
            <input ref="importFileInput" type="file" accept=".json" style="display:none" @change="onImportFile">
          </div>
        </div>
        <div v-if="configImportError" class="error" style="margin-bottom:8px">{{ configImportError }}</div>
        <div v-if="configImportOk" style="background:#d1fae5;color:#065f46;padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:8px">{{ configImportOk }}</div>
        <div class="config-tabs">
          <a :class="{active:cfgTab==='system'}" @click="cfgTab='system'">系统</a>
          <a :class="{active:cfgTab==='rules'}" @click="cfgTab='rules'">规则</a>
          <a :class="{active:cfgTab==='upstreams'}" @click="cfgTab='upstreams'">上游</a>
          <a :class="{active:cfgTab==='plugins'}" @click="cfgTab='plugins';loadPlugins()">插件</a>
          <span class="tab-sep">高级</span>
          <a :class="{active:cfgTab==='matchers'}" @click="cfgTab='matchers'">匹配器</a>
          <a :class="{active:cfgTab==='responses'}" @click="cfgTab='responses'">响应模板</a>
          <a :class="{active:cfgTab==='json'}" @click="cfgTab='json'">原始 JSON</a>
        </div>

        <!-- Matchers -->
        <div class="config-section" v-if="cfgTab==='matchers'">
          <div class="flex flex-between mb-16">
            <h3>匹配器 <small>{{ matcherKeys.length }} 个已定义</small> <small style="color:var(--muted);font-weight:400">定义请求匹配条件</small></h3>
            <button class="primary small" @click="editMatcher(null)">+ 添加</button>
          </div>
          <table v-if="matcherKeys.length">
             <thead><tr><th>名称</th><th>条件</th><th></th></tr></thead>
            <tbody>
              <tr v-for="name in matcherKeys" :key="name">
                <td><strong>{{ name }}</strong></td>
                <td><span class="json-inline">{{ JSON.stringify(cfg.matcher[name]) }}</span></td>
                <td class="actions">
                  <button class="outline small" @click="editMatcher(name)">编辑</button>
                  <button class="danger small" @click="deleteMatcher(name)">删除</button>
                </td>
              </tr>
            </tbody>
          </table>
          <div v-else class="empty">未定义匹配器。</div>
        </div>

        <!-- Rules -->
        <div class="config-section" v-if="cfgTab==='rules'">
          <h3>规则组</h3>
          <div v-for="(rules, group) in cfg.rule || {}" :key="group" class="card" style="padding:16px">
            <div class="flex flex-between mb-8">
              <strong style="font-size:14px">{{ group }}</strong>
              <div class="flex gap-4">
                 <span class="tag tag-ok" v-if="rules && rules.length">{{ rules.length }} 条规则</span>
                 <span class="tag tag-warn" v-else>空</span>
                 <button class="primary small" @click="ruleOpenCreate(group)">+ 添加</button>
              </div>
            </div>
            <table v-if="rules && rules.length" style="font-size:13px">

                   <td class="actions">
                     <button class="outline small" @click="ruleOpenEdit(r, group, i)">编辑</button>
                     <button class="danger small" @click="ruleDelete(r, group, i)">删除</button>
                   </td>
                </tr>
              </tbody>
            </table>
            <div v-else class="empty">此组中无规则。</div>
          </div>
        </div>

        <!-- Upstreams -->
        <div class="config-section" v-if="cfgTab==='upstreams'">
          <h3>后端上游服务器</h3>
          <div v-for="(up, name) in cfg.backend_upstream || {}" :key="name" class="card" style="padding:16px">
            <strong>{{ name }}</strong>
            <table style="font-size:13px;margin-top:8px">
               <thead><tr><th>健康</th><th>主机</th><th>端口</th><th>权重</th><th>信息</th></tr></thead>
              <tbody>
                <tr v-for="(node,ni) in up.nodes || []" :key="ni">
                  <td>
                    <span v-if="!healthData[name] || !healthData[name][ni]" class="dot gray" title="unknown"></span>
                    <span v-else-if="healthData[name][ni].circuit_open" class="dot orange" title="circuit open"></span>
                    <span v-else-if="!healthData[name][ni].healthy" class="dot red" :title="healthData[name][ni].last_error || 'unhealthy'"></span>
                    <span v-else-if="healthData[name][ni].failures > 0" class="dot yellow" :title="healthData[name][ni].failures + ' failure(s)'"></span>
                    <span v-else class="dot green" title="healthy"></span>
                  </td>
                  <td>{{ node.host }}</td><td>{{ node.port }}</td><td>{{ node.weight || 1 }}</td>
                  <td style="font-size:11px;color:var(--muted)">
                    <template v-if="healthData[name] && healthData[name][ni]">
                       <span v-if="healthData[name][ni].circuit_open">熔断开启</span>
                       <span v-else-if="!healthData[name][ni].healthy">{{ healthData[name][ni].last_error || '下线' }}</span>
                       <span v-else-if="healthData[name][ni].failures > 0">{{ healthData[name][ni].failures }} 次失败</span>
                       <span v-else>正常</span>
                    </template>
                    <span v-else>---</span>
                  </td>
                </tr>
              </tbody>
            </table>
            <div style="font-size:12px;color:var(--muted);margin-top:4px">
              HC: {{ up.health_check?.path || 'none' }} &middot;
              TLS: {{ up.tls?.enable ? 'yes' : 'no' }} &middot;
              Method: {{ up.method || 'round_robin' }}
            </div>
          </div>
          <div v-if="!cfg.backend_upstream || !Object.keys(cfg.backend_upstream).length" class="empty">未定义上游。</div>
        </div>

        <!-- Responses -->
        <div class="config-section" v-if="cfgTab==='responses'">
          <h3>响应模板</h3>
          <table v-if="respKeys.length">

            <tbody>
              <tr v-for="name in respKeys" :key="name">
                <td><strong>{{ name }}</strong></td>
                <td>{{ cfg.response[name].content_type }}</td>

              </tr>
            </tbody>
          </table>
          <div v-else class="empty">没有响应模板。</div>
        </div>

        <!-- Plugins -->
        <div class="config-section" v-if="cfgTab==='plugins'">
          <div class="flex flex-between mb-8">
            <h3>插件设置 <small>启用或停用插件</small></h3>

                <td>{{ p.priority }}</td>
                <td>{{ p.critical ? '✓' : '✗' }}</td>
                <td style="font-size:12px;color:var(--muted)">{{ p.description }}</td>
              </tr>
            </tbody>
          </table>
          <div v-if="!plugins.length" class="empty">没有注册插件。</div>
        </div>

        <div class="config-section" v-if="cfgTab==='system'">

          <table>
            <tbody>
              <tr><td>base_uri</td><td>{{ cfg.base_uri }}</td></tr>
              <tr><td>cookie_prefix</td><td>{{ cfg.cookie_prefix }}</td></tr>
              <tr><td>auth_strategy</td><td>{{ cfg.auth_strategy }}</td></tr>
              <tr><td>body.max_size</td><td>{{ cfg.body?.max_size || '-' }}</td></tr>
              <tr><td>body.on_error</td><td>{{ cfg.body?.on_error || '-' }}</td></tr>
              <tr><td>proxy.health_check_interval</td><td>{{ cfg.proxy?.health_check_interval || '-' }}s</td></tr>
            </tbody>
          </table>
          <h3 style="margin-top:16px">管理员用户</h3>
          <table>
            <thead><tr><th>用户</th><th>启用</th><th>密码</th></tr></thead>
            <tbody>
              <tr v-for="(a,i) in cfg.admin || []" :key="i">
                <td>{{ a.user }}</td>
                 <td>{{ a.enable ? '✓' : '✗' }}</td>
                 <td><span class="json-inline">{{ a.password_hash ? '(已设置)' : '(未设置)' }}</span></td>
              </tr>
            </tbody>
          </table>
          <h3 style="margin-top:16px">共享字典内存 <small>{{ dictUsage.length }} 个字典</small></h3>

                <span>{{ d.name }}</span>
                <span :style="{color: d.pct > 80 ? '#ef4444' : d.pct > 60 ? '#eab308' : 'var(--muted)'}">

                  transition: 'width .3s'
                }"></div>
              </div>
            </div>
          </div>
          <div v-else style="font-size:12px;color:var(--muted);margin-top:8px">
            <button class="outline small" @click="loadDictUsage">加载</button>
          </div>
        </div>

        <div class="config-section" v-if="cfgTab==='json'">

            <h3>原始配置</h3>
            <div class="flex gap-8">
              <button class="outline small" @click="loadConfig">重新加载</button>
              <button class="primary small" :disabled="jsonSaving" @click="saveRawConfig">{{ jsonSaving ? '保存中…' : '保存' }}</button>
            </div>
          </div>
          <div class="error" v-if="jsonError" style="margin-bottom:8px">{{ jsonError }}</div>
          <textarea id="json-editor" v-model="rawJson" spellcheck="false" class="code-editor"></textarea>
        </div>
      </div>

      <!-- Stats -->
      <div v-if="page==='dashboard' && dashTab==='stats'">
        <div class="flex flex-between mb-16">
          <h2 class="page-title" style="margin-bottom:0">请求统计</h2>

            <select v-model="statsType" style="width:auto" @change="loadStats">
               <option value="long">全部</option>
               <option value="medium">5 分钟</option>
               <option value="short">临时</option>
            </select>
             <button class="outline small" @click="loadStats">刷新</button>
          </div>
        </div>
        <div v-if="statsError" class="error" style="margin-bottom:8px">{{ statsError }}</div>
        <div v-if="statsData">
          <h3 style="font-size:14px;margin-bottom:8px;">URI 统计 <small>{{ Object.keys(statsData || {}).length }} 个条目</small></h3>

            <table>
               <thead><tr><th style="width:24px"></th><th>URI</th><th>次数</th><th>大小</th><th>平均大小</th><th>成功率</th><th>耗时</th><th>平均耗时</th></tr></thead>
              <tbody>
                <template v-for="(v,key) in statsData || {}" :key="key">
                  <tr @click="expandedUri = expandedUri === key ? null : key" style="cursor:pointer">
                    <td style="color:var(--muted);font-size:11px">{{ expandedUri === key ? '&#9660;' : '&#9654;' }}</td>
                    <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="key">{{ key }}</td>
                    <td>{{ v.count }}</td>
                    <td>{{ formatBytes(v.bytes) }}</td>
                    <td>{{ v.count ? formatBytes(v.bytes / v.count) : '-' }}</td>
                    <td><span class="tag" :class="successClass(v)">{{ calcSuccess(v) }}%</span></td>
                    <td>{{ v.time != null ? v.time.toFixed(2) : '-' }}s</td>
                    <td>{{ v.count ? (v.time / v.count).toFixed(3) : '-' }}s</td>
                  </tr>
                  <tr v-if="expandedUri === key">
                    <td colspan="8" style="padding:4px 16px 12px 36px">
                      <div style="font-size:12px;color:var(--muted);margin-bottom:4px">状态码分布:</div>
                      <div style="display:flex;gap:12px;flex-wrap:wrap">
                        <span v-for="(cnt, code) in v.status || {}" :key="code" style="white-space:nowrap">
                          <span class="tag" :class="parseInt(code) < 400 ? 'tag-ok' : parseInt(code) < 500 ? 'tag-warn' : 'tag-err'">{{ code }}</span>
                          {{ cnt }}
                        </span>
                        <span v-if="!v.status || !Object.keys(v.status).length" style="color:var(--muted)">无状态数据</span>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
        <!-- Top Paths -->
        <div class="card mt-16" v-if="topPaths.length">

          </div>

            <table>
               <thead><tr><th>#</th><th>URI</th><th>次数</th><th>流量</th><th>平均耗时</th></tr></thead>
              <tbody>

                  <td>{{ formatNumber(tp.count) }}</td>
                  <td>{{ formatBytes(tp.bytes) }}</td>
                  <td>{{ tp.count > 0 ? (tp.time / tp.count * 1000).toFixed(1) + 'ms' : '-' }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

          </div>

          <a :class="{active:wafTab==='history'}" @click="wafTab='history';loadWafHistory()">历史</a>
          <a :class="{active:wafTab==='tester'}" @click="wafTab='tester'">测试</a>
        </div>

        <!-- WAF sub-tabs: Rules -->
        <div v-if="wafTab==='rules'" class="config-tabs" style="margin-bottom:16px;font-size:12px">
          <a :class="{active:wafRuleView==='list'}" @click="wafRuleView='list'">规则列表</a>
          <a :class="{active:wafRuleView==='analytics'}" @click="wafRuleView='analytics';loadWafAnalytics()">效果分析</a>
          <a :class="{active:wafRuleView==='recs'}" @click="wafRuleView='recs';loadRecs()">规则推荐</a>
        </div>
        <!-- WAF sub-tabs: Attacks -->
        <div v-if="wafTab==='attacks'" class="config-tabs" style="margin-bottom:16px;font-size:12px">

          <a :class="{active:wafAttackView==='timeline'}" @click="wafAttackView='timeline';loadWafTimeline()">时间线</a>
          <a :class="{active:wafAttackView==='hits'}" @click="wafAttackView='hits';loadWafHits()">命中</a>

             ⚠ 以下规则 30 天未命中：
            <span v-for="dr in wafAnalytics.dead_rules" :key="dr.id" style="margin-right:8px">
              <strong>{{ dr.name || dr.id }}</strong>
               <span v-if="dr.enable !== false" style="color:#92400e">(启用中)</span>
               <span v-else style="color:#9ca3af">(已禁用)</span>
             </span>
             <span style="color:#6b7280">建议：检查正则是否需要更新，或删除无用的规则</span>
          </div>
          <table class="table">
            <thead>
               <tr><th>规则</th><th>动作</th><th>命中</th><th>拦截</th><th>质询</th><th>通过率</th><th>效果评级</th><th>最后触发</th></tr>
            </thead>
            <tbody>
              <tr v-for="r in wafAnalytics.rules || []" :key="r.id" :style="{opacity: r.dead ? 0.5 : 1}">
                <td>
                  <strong>{{ r.name || r.id }}</strong>
                  <span v-if="r.dead" class="tag" style="background:#fee2e2;color:#991b1b;margin-left:4px;font-size:10px">休眠</span>
                  <span v-if="r.enable === false" class="tag" style="background:#f3f4f6;color:#6b7280;margin-left:4px;font-size:10px">已禁用</span>

                <td>{{ r.hits }}</td>
                <td>{{ r.blocks }}</td>
                <td>{{ r.challenges }}</td>
                <td>{{ r.challenge_pass_rate }}</td>
                <td>
                  <span :class="'grade-' + r.grade" class="tag" :style="gradeStyle(r.grade)">{{ r.grade }}</span>

          </table>

            </select>

               <option value="">全部严重级别</option>

               <option value="medium">中</option>
               <option value="low">低</option>

                 <th style="width:70px">严重级别</th>
                 <th style="width:70px">命中</th>
                 <th style="width:100px">最后触发</th>
                 <th style="width:140px">操作</th>
               </tr></thead>
              <tbody>
                <tr v-for="r in wafRules" :key="r.id">

              </table>

            <div class="card">

               <thead><tr><th>#</th><th>名称</th><th>命中</th></tr></thead>

                <tr v-for="(tr,idx) in wafStatsData.top_rules" :key="tr.id">

              <option value="1">1 小时</option>
              <option value="3">3 小时</option>
              <option value="6">6 小时</option>
              <option value="12">12 小时</option>
              <option value="24">24 小时</option>
            </select>
            <select v-model="wafTimelineBucket" @change="loadWafTimeline" style="width:auto;display:inline-block">
              <option value="1">1 分钟桶</option>
              <option value="5">5 分钟桶</option>
              <option value="15">15 分钟桶</option>
              <option value="30">30 分钟桶</option>
            </select>

            </table>

          <div v-if="!wafHits.length" class="empty">无最近命中</div>
        </div>

        <!-- History -->

             <table style="font-size:13px">
               <thead><tr><th>规则 ID</th><th>暂存时间</th><th>动作</th><th></th></tr></thead>
              <tbody>
                <tr v-for="p in wafPendingChanges" :key="p.rule_id">
                  <td><code>{{ p.rule_id }}</code></td>
                  <td style="color:#6b7280">{{ new Date(p.staged_at * 1000).toLocaleString() }}</td>

                    <span class="tag" style="background:#fef3c7;color:#92400e">{{ p.proposed.action || 'edit' }}</span>
                  </td>

              </tbody>

          <div v-if="recError" class="error" style="margin-bottom:8px">{{ recError }}</div>
          <div v-if="recs.length === 0" class="empty">暂无推荐。点击"分析流量"扫描最近被拦截的命中。</div>
           <table v-else style="font-size:13px">
             <thead><tr><th>模式</th><th>分类</th><th>严重级别</th><th>动作</th><th>命中</th><th>状态</th><th></th></tr></thead>

                <td>{{ r.action }}</td>
                <td>{{ r.hit_count }}</td>
                <td>{{ r.status }}</td>

                  <button v-if="r.status === 'pending'" class="outline small" @click="dismissRec(r.id)">忽略</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div v-if="wafTab==='tester'">

               <label>规则 (JSON)</label>
              <textarea v-model="wafTestRuleJson" spellcheck="false" class="code-editor" style="min-height:100px" placeholder='{"matcher":{"URI":{"operator":"≈","value":"/api/*"}},"action":"block"}'></textarea>
            </div>
             <div class="field">
               <label>测试用例 (JSON 数组)</label>
              <textarea v-model="wafTestCasesJson" spellcheck="false" class="code-editor" style="min-height:120px" placeholder='[{"name":"normal","uri":"/api/users","expected":false},{"name":"attack","uri":"/api/../../etc","expected":true}]'></textarea>
            </div>
            <div class="error" v-if="wafTestError" style="margin-bottom:8px">{{ wafTestError }}</div>

                  <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis">{{ res.uri }}</td>
                  <td>{{ res.matched ? '✓' : '✗' }}</td>
                  <td>{{ res.passed ? '✓' : '✗' }}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <!-- Test History -->

              </tbody>

                  <td>{{ r.window }}s</td>

                   </td>
                </tr>
              </tbody>

             <div class="field"><label>键维度</label>

                <option value="uri">URI</option>

                <option value="host">域名</option>

            <div class="grid grid-2 mb-8">

            </div>
            <div class="modal-actions">
             <button class="outline" @click="freqTemplateModal.show=false">取消</button>
             <button class="primary" @click="applyFreqTemplate">应用</button>
            </div>
          </div>

              <select v-model="freqRuleModal.key" style="width:100%">
                <option value="ip">IP</option>
                <option value="uri">URI</option>
                <option value="user">用户名</option>
                <option value="host">域名</option>
              </select>

               <div class="field"><label>窗口 (秒)</label><input v-model.number="freqRuleModal.window" type="number" min="1" placeholder="60"></div>
            </div>
<div class="grid grid-2 mb-8">
                <div class="field"><label>阻止代码</label><input v-model.number="freqRuleModal.code" type="number" min="100" max="599" placeholder="429"></div>

// Strict IP literal validation (IPv4 0-255 per octet, IPv6 with optional /prefix).
// Mirrors api/helpers.lua is_valid_ip semantics on the client side.
function isValidIpLiteral(ip, allowPrefix) {
  if (!ip || typeof ip !== 'string') return false;
  const s = ip.trim();
  if (!s) return false;
  if (s.includes(':')) {
    // IPv6 literal (optionally with /<prefix>)
    const body = allowPrefix ? s.split('/')[0] : s;
    if (!/^[0-9a-fA-F:]+$/.test(body) || !body.includes(':')) return false;
    if (allowPrefix && s.includes('/')) {
      const p = Number(s.split('/')[1]);
      if (!Number.isInteger(p) || p < 0 || p > 128) return false;
    }
    return true;
  }
  // IPv4 literal (optionally with /<prefix>)
  const body = allowPrefix ? s.split('/')[0] : s;
  const parts = body.split('.');
  if (parts.length !== 4) return false;
  for (const p of parts) {
    if (!/^\d+$/.test(p)) return false;
    const n = Number(p);
    if (n < 0 || n > 255) return false;
    if (p.length > 1 && p[0] === '0') return false; // no leading zeros
  }
  if (allowPrefix && s.includes('/')) {
    const p = Number(s.split('/')[1]);
    if (!Number.isInteger(p) || p < 0 || p > 32) return false;
  }
  return true;
}

// Session-expired errors are raised by api() on 401/403 and already
// handled centrally (store.loggedIn=false → login page). Swallow them at
// the global level so timer-driven refreshes (loadStatus every 3s, etc.)
// don't produce unhandled Promise rejections / console noise.
window.addEventListener('unhandledrejection', (ev) => {
  const reason = ev && ev.reason;
  if (reason && reason.message === 'session_expired') {
    ev.preventDefault();
  }
});

async function api(method, path, body, opts2) {
  const opts = { method, credentials: 'same-origin' };
  if (body) {
    if (body instanceof URLSearchParams) {
      opts.body = body;
    } else if (typeof body === 'object' && !(body instanceof FormData)) {
      opts.headers = { 'Content-Type': 'application/json' };
      opts.body = JSON.stringify(body);
    } else {
      opts.body = body;
    }
  }
  if (method !== 'GET') {
    if (csrfBroken) {
      // Last CSRF refresh failed; try once more before blocking. If the
      // token was only transiently stale this recovers without a reload.
      try {
        const d = await fetch('/verynginx/csrf', { method: 'GET', credentials: 'same-origin' });
        if (d.ok) { const j = await d.json(); csrfToken = j.csrf_token; csrfBroken = false; }
      } catch (e) { /* keep broken */ }
    }
    if (csrfBroken) {
      throw new Error('CSRF 令牌刷新失败，请刷新页面后重试');
    }
    if (csrfToken) {
      opts.headers = opts.headers || {};
      opts.headers['X-CSRF-Token'] = csrfToken;
    }
  }
  const res = await fetch(path, opts);
  if (!res.ok) {
    // Session expired or unauthorized — redirect to login
    if (res.status === 401 || res.status === 403) {
      csrfToken = null;
      if (typeof store !== 'undefined') {
        store.loggedIn = false;
        store.user = null;
      }
      throw new Error('session_expired');
    }
    const text = await res.text().catch(() => '');
    let msg;
    try { const j = JSON.parse(text); msg = j.message || j.err || text; } catch { msg = text || `HTTP ${res.status}`; }
    throw new Error(msg);
  }
  if (opts2 && opts2.text) return res.text();
  return res.json();
}

let csrfBroken = false;

async function refreshCsrf() {
  try {
    const d = await api('GET', '/verynginx/csrf');
    csrfToken = d.csrf_token;
    csrfBroken = false;
  } catch (e) {
    console.warn('CSRF token refresh failed:', e.message);
    if (e.message !== 'session_expired') csrfBroken = true;
  }
}

    function ruleEditModalChanged() {
      // Clear stale fields when action changes
      if (ruleEditModal.action !== 'block') { ruleEditModal.response = ''; }
      if (ruleEditModal.action !== 'redirect' && ruleEditModal.action !== 'block') { ruleEditModal.code = 403; }
      if (ruleEditModal.action !== 'redirect' && ruleEditModal.action !== 'rewrite') { ruleEditModal.to_uri = ''; }
      if (ruleEditModal.action !== 'proxy') { ruleEditModal.upstream = ''; }
      if (ruleEditModal.action !== 'static') { ruleEditModal.root = ''; ruleEditModal.path = ''; ruleEditModal.expires = ''; }
      if (ruleEditModal.action !== 'response') { ruleEditModal.response = ''; }
    }

    function ruleBuildRule() {
      const rule = { enable: ruleEditModal.enable };
      if (ruleEditModal.matcherType === 'inline') {
        try { rule.matcher = JSON.parse(ruleEditModal.matcherJson); } catch { rule.matcher = {}; }
      } else {
        rule.matcher = ruleEditModal.matcherType;
      }
      rule.action = ruleEditModal.action;
      if (ruleEditModal.action === 'block' || ruleEditModal.action === 'response') {
        if (ruleEditModal.code) rule.code = ruleEditModal.code;
        if (ruleEditModal.response) {
          try { rule.response = JSON.parse(ruleEditModal.response); } catch { rule.response = ruleEditModal.response; }
        }
      }
      if (ruleEditModal.action === 'redirect' || ruleEditModal.action === 'rewrite') {
        if (ruleEditModal.to_uri) rule.to_uri = ruleEditModal.to_uri;
      }
      if (ruleEditModal.action === 'redirect') {
        if (ruleEditModal.code) rule.code = ruleEditModal.code;
      }
      if (ruleEditModal.action === 'proxy') {
        if (ruleEditModal.upstream) rule.upstream = ruleEditModal.upstream;
      }
      if (ruleEditModal.action === 'static') {
        if (ruleEditModal.root) rule.root = ruleEditModal.root;
        if (ruleEditModal.path) rule.path = ruleEditModal.path;
        if (ruleEditModal.expires) rule.expires = ruleEditModal.expires;
      }
      return rule;
    }

    // ---- Dict Usage ----
    async function loadDictUsage() {
      try {
        const text = await api('GET', '/verynginx/metrics', null, { text: true });
        const parsed = parsePrometheus(typeof text === 'string' ? text : '');
        const dicts = [];
        const pctMap = {}, usedMap = {}, capMap = {};
        for (const [key, vals] of Object.entries(parsed)) {
          for (const [labels, val] of Object.entries(vals)) {
            const lb = JSON.parse(labels);
            if (key.startsWith('shared_dict_usage_pct')) {
              pctMap[lb.dict] = val;
            } else if (key.startsWith('shared_dict_usage_bytes')) {
              usedMap[lb.dict] = val;
            } else if (key.startsWith('shared_dict_capacity_bytes')) {
              capMap[lb.dict] = val;
            }
          }
        }
        for (const name of Object.keys(pctMap).sort()) {
          dicts.push({
            name,
            pct: pctMap[name] || 0,
            used: usedMap[name] || 0,
            cap: capMap[name] || 0
          });
        }
        dictUsage.value = dicts;

    // ---- Overview ----
    function parsePrometheus(text) {
      const result = {};
      const lines = text.split('\n');
      for (const line of lines) {
        if (line.startsWith('#') || !line.trim()) continue;
        // Match: name{labels} value
        const m = line.match(/^([a-zA-Z_:][a-zA-Z0-9_:]*)\s*(\{.*?\})?\s+([0-9.e+\-]+)/);
        if (!m) continue;
        const name = m[1];
        const labelStr = m[2] || '';
        const value = parseFloat(m[3]);
        // Parse labels
        const labels = {};
        if (labelStr) {
          const inner = labelStr.slice(1, -1);
          for (const pair of inner.split(',')) {
            const eq = pair.indexOf('=');
            if (eq < 0) continue;
            const lk = pair.slice(0, eq).trim();
            const lv = pair.slice(eq + 1).replace(/^"|"$/g, '');
            labels[lk] = lv;
          }
        }
        if (!result[name]) result[name] = {};
        const lk = JSON.stringify(labels);
        result[name][lk] = value;
      }
      return result;
    }

    async function loadOverview() {
      const o = { conn_active: 0, req_rate: 0, up_healthy: 0, up_total: 0, waf_hits: 0, dicts: [], top_uris: [], plugin_errors: [] };
      try {
        // Status: connection counts
        const s = await api('GET', '/verynginx/status');
        o.conn_active = s.connections_active || 0;

        // Health: upstream node status
        const h = await api('GET', '/verynginx/upstreams/health');
        if (h.ret === 'success') {
          for (const [name, nodes] of Object.entries(h.data || {})) {
            for (const n of nodes) {
              o.up_total++;
              if (n.healthy && !n.circuit_open) o.up_healthy++;
            }
          }
        }

        // Metrics: shared dict usage, plugin errors, request total
        const m = await api('GET', '/verynginx/metrics', null, { text: true });
        const parsed = parsePrometheus(typeof m === 'string' ? m : '');

        for (const [key, vals] of Object.entries(parsed)) {
          if (key.startsWith('shared_dict_usage_pct')) {
            for (const [labels, val] of Object.entries(vals)) {
              const lb = JSON.parse(labels);
              if (lb.dict) o.dicts.push({ name: lb.dict, pct: val, used: 0, cap: 0 });
            }
          } else if (key.startsWith('shared_dict_usage_bytes')) {
            for (const [labels, val] of Object.entries(vals)) {
              const lb = JSON.parse(labels);
              const d = (o.dicts || []).find(x => x.name === lb.dict);
              if (d) { d.used = val; if (!d.cap) { const p = parsed['shared_dict_capacity_bytes']; if (p) for (const [lk, v] of Object.entries(p)) { const l = JSON.parse(lk); if (l.dict === lb.dict) d.cap = v; } } }
            }
          } else if (key === 'vn_plugin_errors_total') {
            for (const [labels, val] of Object.entries(vals)) {
              const lb = JSON.parse(labels);
              o.plugin_errors.push({ plugin: lb.plugin || '?', phase: lb.phase || '?', count: val });
            }
          } else if (key === 'plugin_duration_seconds_count') {
            for (const [labels, val] of Object.entries(vals)) {
              const lb = JSON.parse(labels);
              o._plugin_dur_count = o._plugin_dur_count || {};
              const k = (lb.plugin || '?') + '|' + (lb.phase || '?');
              o._plugin_dur_count[k] = val;
            }
          } else if (key === 'plugin_duration_seconds_sum') {
            for (const [labels, val] of Object.entries(vals)) {
              const lb = JSON.parse(labels);
              o._plugin_dur_sum = o._plugin_dur_sum || {};
              const k = (lb.plugin || '?') + '|' + (lb.phase || '?');
              o._plugin_dur_sum[k] = val;
            }
          } else if (key === 'vn_requests_total') {
            o.req_rate = Math.round(Object.values(vals)[0] || 0);
          }
        }

        // Summary: top URIs
        const sum = await api('GET', '/verynginx/summary?type=short');
        if (sum.ret === 'success' && sum.data) {
          const entries = Object.entries(sum.data).map(([uri, v]) => ({
            uri,
            count: v.count || 0,
            bytes: v.bytes || 0,
            success_rate: v.count ? ((v.success || 0) / v.count * 100) : 100
          }));
          entries.sort((a, b) => b.count - a.count);
          o.top_uris = entries.slice(0, 10);
        }

        // WAF hits summary
        try {
          const w = await api('GET', '/verynginx/waf/stats');
          if (w.ret === 'success' && w.data) {
            o.waf_hits = Object.values(w.data).reduce((s, r) => s + (r.hits || 0), 0);
          }
        } catch (e) {
          console.warn('Overview WAF stats failed:', e.message);
        }

        // Reputation summary
        try {
          const r = await api('GET', '/verynginx/reputation/stats');
          if (r.ret === 'success' && r.data) {
            o.flagged = r.data.flagged || 0;
          }
        } catch (e) {
          console.warn('Overview reputation stats failed:', e.message);
        }
      } catch (e) {
        console.warn('Overview load error:', e.message);
      }
      // Merge plugin errors with duration into plugin_perf
      const perfMap = {};
      for (const e of (o.plugin_errors || [])) {
        const k = e.plugin + '|' + e.phase;
        perfMap[k] = { plugin: e.plugin, phase: e.phase, errors: e.count, avg_ms: 0, count: 0 };
      }
      for (const [k, cnt] of Object.entries(o._plugin_dur_count || {})) {
        if (!perfMap[k]) perfMap[k] = { plugin: k.split('|')[0], phase: k.split('|')[1], errors: 0, avg_ms: 0, count: 0 };
        perfMap[k].count = cnt;
      }
      for (const [k, sum] of Object.entries(o._plugin_dur_sum || {})) {
        if (perfMap[k]) {
          perfMap[k].avg_ms = perfMap[k].count > 0 ? (sum / perfMap[k].count) * 1000 : 0;
        }
      }
      o.plugin_perf = Object.values(perfMap).sort((a, b) => b.avg_ms - a.avg_ms);
      delete o.plugin_errors;
      delete o._plugin_dur_count;
      delete o._plugin_dur_sum;
      o.dicts = (o.dicts || []).sort((a, b) => b.pct - a.pct).slice(0, 6);
      overview.value = o;
    }

    // ---- Helpers ----
    function formatTime(t) {
      if (!t) return '-';
      return new Date(t * 1000).toLocaleString();
    }

    function formatBytes(b) {
      if (b == null) return '-';
      if (b < 1024) return b.toFixed(0) + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      return (b / 1048576).toFixed(1) + ' MB';
    }

    function calcSuccess(v) {
      let ok = 0, total = 0;
      for (const code in v.status || {}) {
        const c = v.status[code];
        total += c;
        if (parseInt(code) < 400) ok += c;
      }
      return total ? ((ok / total) * 100).toFixed(1) : '0.0';
    }

    function successClass(v) {
      const p = parseFloat(calcSuccess(v));
      if (p >= 99) return 'tag-ok';
      if (p >= 90) return 'tag-warn';
      return 'tag-err';
    }

    function summarizeRule(r) {
      const parts = [];
      if (r.to_uri) parts.push('→ ' + r.to_uri);
      if (r.upstream) parts.push('→ ' + r.upstream);
      if (r.code) parts.push('HTTP ' + r.code);
      if (r.scheme) parts.push(r.scheme);
      if (r.rate) parts.push(r.rate);
      return parts.join(', ') || '-';
    }

    function actionClass(a) {
      if (a === 'block' || a === 'filter') return 'tag-err';
      if (a === 'accept' || a === 'proxy' || a === 'static') return 'tag-ok';
      return 'tag-warn';
    }

    // ---- WAF Methods ----

      if (s === 'critical') return 'tag-err';
      if (s === 'high') return 'tag-warn';
      return 'tag-ok';
    }

    function fmtTime(ts) {
      if (!ts) return '-';

    async function loadWafRules() {
      wafError.value = '';
      try {
        const params = new URLSearchParams();

    function wafDiffLines() {
      if (wafEditModal.mode === 'create') return [];
      try {
        const orig = JSON.parse(wafEditModal._originalRule);
        const changed = {
          name: wafEditModal.name,
          description: wafEditModal.description || '',
          category: wafEditModal.category,
          severity: wafEditModal.severity,
          action: wafEditModal.action,
          code: wafEditModal.code || 403,
          matcher: JSON.parse(wafEditModal.matcherJson),
          tags: wafEditModal.tagsStr.split(',').map(t => t.trim()).filter(t => t),
          rate_limit: wafEditModal.rateLimitEnabled ? {
            enable: true, max_hits: wafEditModal.rateLimitMax,
            window: wafEditModal.rateLimitWindow, action: wafEditModal.rateLimitAction
          } : {}
        };
        const a = JSON.stringify(orig, null, 2).split('\n');
        const b = JSON.stringify(changed, null, 2).split('\n');
        const diff = [];
        const maxLen = Math.max(a.length, b.length);
        for (let i = 0; i < maxLen; i++) {
          const left = a[i] || '';
          const right = b[i] || '';
          if (left !== right) {
            if (left) diff.push({ type: 'removed', text: left });
            if (right) diff.push({ type: 'added', text: right });
          }
        }
        return diff;
      } catch (e) {
        return [];
      }
    }

    const VALID_CATEGORIES = ['sqli', 'xss', 'rce', 'lfi', 'path_traversal', 'scanner', 'bot', 'brute', 'spam', 'custom'];
    const VALID_SEVERITIES = ['critical', 'high', 'medium', 'low'];
    const VALID_ACTIONS = ['block', 'accept', 'log', 'challenge'];

    async function wafSaveRule() {
      wafEditError.value = '';
      const m = wafEditModal;
      if (!m.name) { wafEditError.value = 'Name is required'; return; }
      if (!m.category) { wafEditError.value = 'Category is required'; return; }
      if (VALID_CATEGORIES.indexOf(m.category) === -1) { wafEditError.value = 'Invalid category: ' + m.category; return; }
      if (!m.severity) { wafEditError.value = 'Severity is required'; return; }
      if (VALID_SEVERITIES.indexOf(m.severity) === -1) { wafEditError.value = 'Invalid severity: ' + m.severity; return; }
      if (!m.action) { wafEditError.value = 'Action is required'; return; }
      if (VALID_ACTIONS.indexOf(m.action) === -1) { wafEditError.value = 'Invalid action: ' + m.action; return; }

      let matcherObj;
      try {
        matcherObj = JSON.parse(m.matcherJson);
      } catch (e) {
        wafEditError.value = 'Invalid matcher JSON: ' + e.message;
        return;
      }

      const tags = m.tagsStr.split(',').map(t => t.trim()).filter(t => t);

      const rule = {
        name: m.name,
        description: m.description || undefined,
        category: m.category,
        severity: m.severity,
        action: m.action,
        code: m.code || undefined,
        matcher: matcherObj,
        tags: tags.length ? tags : undefined
      };

      if (m.rateLimitEnabled) {
        rule.rate_limit = {
          enable: true,
          max_hits: m.rateLimitMax,
          window: m.rateLimitWindow,
          action: m.rateLimitAction
        };
      }

      wafSaving.value = true;
      try {
        let d;
        if (wafEditModal.mode === 'create') {
          d = await api('POST', '/verynginx/waf/rules', rule);
        } else {
          // Stage the change (requires confirmation via History tab)
          d = await api('POST', '/verynginx/waf/rules/' + m.id + '/stage', rule);
        }
        if (d.ret === 'success') {
          wafEditModal.show = false;
          if (wafEditModal.mode === 'edit') {
            showToast('规则变更已暂存，请在 History 标签中确认发布', 'info');
          }
          await loadWafRules();
          loadWafHistory();
        } else {
          wafEditError.value = d.message || 'Save failed';
        }
      } catch (e) {
        wafEditError.value = e.message;
      }
      wafSaving.value = false;
    }

    async function loadFrequencyData() {
      try {

          api('GET', '/verynginx/frequency/rules'),
          api('GET', '/verynginx/frequency/templates'),

        const [statsRes, rulesRes, tmplRes] = results.map(r => (r.status === 'fulfilled' ? r.value : null));
        if (statsRes && statsRes.ret === 'success') freqStats.value = statsRes.data || [];
        if (rulesRes && rulesRes.ret === 'success') freqRules.value = rulesRes.data || [];
        if (tmplRes && tmplRes.ret === 'success') freqTemplates.value = tmplRes.data || [];
        freqTemplatesLoaded.value = true;
        const failures = results.filter(r => r.status === 'rejected').map(r => r.reason.message);
        if (failures.length) {
          console.warn('loadFrequencyData partial failure:', failures.join('; '));
          if (!failures.includes('session_expired')) freqError.value = '部分数据加载失败: ' + failures.join('; ');
        } else {
          freqError.value = '';
        }
      } catch (e) {
        console.warn('loadFrequencyData failed:', e.message);
        freqTemplatesLoaded.value = true;
        if (e.message !== 'session_expired') freqError.value = '加载频率限制数据失败: ' + e.message;
      }
    }

    async function loadGeoIP() {
      try {
        const [cfgRes, statsRes] = await Promise.all([
          api('GET', '/verynginx/geoip/config'),
          api('GET', '/verynginx/geoip/stats'),
        ]);
        if (cfgRes.ret === 'success') {
          const cfg = cfgRes.data || {};
          // Determine mirror source from config
          let mirror = 'auto';
          let custom_mirror_url = '';
          if (cfg.cdn_url || cfg.update_url) {
            const url = cfg.cdn_url || cfg.update_url;
            const MIRROR_MAP = {
              'https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-City.mmdb': 'p3terx',
              'https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb': 'loyalsoldier_raw',
              'https://github.com/Loyalsoldier/geoip/releases/latest/download/Country.mmdb': 'loyalsoldier_release',
            };
            mirror = MIRROR_MAP[url] || 'custom';
            if (mirror === 'custom') custom_mirror_url = url;
          }
          geoipConfig.value = {
            enable: cfg.enable || false,
            geodb_path: cfg.geodb_path || '',
            whitelistStr: (cfg.whitelist || []).join(','),
            blocklistStr: (cfg.blocklist || []).join(','),
            auto_update: cfg.auto_update !== false,
            update_interval_hours: cfg.update_interval_hours || 168,
            mirror, custom_mirror_url,
            license_key: cfg.license_key || '',
          };
        }
        if (statsRes.ret === 'success') geoipStats.value = Object.entries(statsRes.data || {}).map(([code, count]) => ({ code, count })).sort((a, b) => b.count - a.count).slice(0, 20);
      } catch (e) {
        // silent
      }
    }

    async function lookupGeoIP() {
      if (!geoipLookupIP.value) return;
      const ip = geoipLookupIP.value.trim();

    async function loadKbData() {

      else if (kbTab.value === 'timeline') tabRequest = loadKbTimeline();

    async function loadKbEntries(cursor) {
      try {
        let url = '/verynginx/kernel-blocking/entries?page_size=50';
        if (cursor) url += '&cursor=' + cursor;
        if (kbFilterPolicy.value) url += '&policy=' + encodeURIComponent(kbFilterPolicy.value);
        const d = await api('GET', url);
        if (d.ret === 'success') {
          if (cursor) kbEntriesPrev.value.push(cursor);
          else kbEntriesPrev.value = [];
          let entries = d.data.entries || [];
          if (kbFilterPolicy.value) entries = entries.filter(e => (e.policy || '').includes(kbFilterPolicy.value) || (e.list || '').includes(kbFilterPolicy.value));
          if (kbFilterIP.value) {
            const q = kbFilterIP.value.toLowerCase();
            entries = entries.filter(e => String(e.ip || '').toLowerCase().includes(q));
          }
          kbEntries.value = entries;
          kbEntriesNext.value = d.data.next_cursor;
        } else {
          kbError.value = d.message || 'Failed to load entries';
        }
      } catch (e) { kbError.value = e.message; }
    }

    function kbEntriesPagePrev() {
      const prev = kbEntriesPrev.value.pop();
      if (prev) loadKbEntries(prev);
    }

    async function saveFreqRule() {
      try {
        // Client-side validation
        if (!freqRuleModal.key || freqRuleModal.key.trim() === '') {
          showToast('限速键 (key) 不能为空', 'error'); return;
        }
        const limit = Number(freqRuleModal.limit);
        const window = Number(freqRuleModal.window);
        const code = Number(freqRuleModal.code);
        if (!limit || limit < 1) { showToast('limit 必须 >= 1', 'error'); return; }
        if (!window || window < 1) { showToast('window 必须 >= 1 秒', 'error'); return; }
        if (!code || code < 100 || code > 599) { showToast('响应码必须是 100-599 之间的合法状态码', 'error'); return; }

        let matcher = {};
        try {
          if (freqRuleModal._matcherRef) {
            matcher = null;
          } else if (freqRuleModal.matcherJson && freqRuleModal.matcherJson !== '{}') {
            matcher = JSON.parse(freqRuleModal.matcherJson);
          }
        } catch (e) {
          showToast('匹配器 JSON 格式无效: ' + e.message, 'error');
          return;
        }
        const rule = {
          id: freqRuleModal.id,
          key: freqRuleModal.key,
          limit,
          window,
          code,
          enable: freqRuleModal.enable,
        };
        if (freqRuleModal._matcherRef) {
          rule.matcher = freqRuleModal._matcherRef;
        } else if (Object.keys(matcher).length > 0) {
          rule.matcher = matcher;
        }
        const d = await api('POST', '/verynginx/frequency/rules', rule);
        if (d.ret === 'success') {
          freqRuleModal.show = false;
          showToast('规则已保存', 'success');
          await loadFrequencyData();
        } else {
          showToast(d.message || '保存失败', 'error');
        }
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

        if (d.ret === 'success') {
          wafHits.value = d.data || [];
          wafHitsTime.value = wafHits.value.length ? new Date().toLocaleTimeString() : '';
        } else {
          wafHitsError.value = d.message || 'Failed to load hits';
        }
      } catch (e) {
        wafHitsError.value = e.message;
      }
    }

    function wafLoadMoreHits() {
      wafHitsLimit.value = 100;
      loadWafHits();
    }

    // ---- WAF Analytics ----
    async function loadWafAnalytics() {
      try {
        const d = await api('GET', '/verynginx/waf/analytics');
        if (d.ret === 'success') {
          wafAnalytics.value = d.data || { rules: [], dead_rules: [] };
        }
      } catch (e) {
        // silent fail
      }
    }

    function gradeStyle(g) {
      const colors = { 'A+': '#16a34a', A: '#22c55e', B: '#f59e0b', C: '#f97316', D: '#ef4444' };
      return { background: colors[g] || '#6b7280', color: '#fff' };
    }

    // ---- Plugins ----
    async function loadPlugins() {
      pluginsError.value = '';
      try {
        const d = await api('GET', '/verynginx/plugins');
        if (d.ret === 'success') {
          plugins.value = d.data || [];
        } else {
          pluginsError.value = d.message || 'Failed to load plugins';
        }
      } catch (e) {
        pluginsError.value = e.message;
      }
    }

    async function togglePlugin(p) {
      pluginsError.value = '';
      const old = p.enable;
      p.enable = !p.enable;
      try {
        const d = await api('POST', '/verynginx/plugins/' + p.name + '/toggle');
        if (d.ret === 'success') {
          p.enable = d.data.enable;
          if (p.enable !== !old) loadPlugins();
          showToast(p.enable ? '已启用 ' + p.name : '已停用 ' + p.name, p.enable ? 'success' : 'info');
        } else {
          p.enable = old;
          pluginsError.value = d.message || 'Toggle failed';
        }
      } catch (e) {
        p.enable = old;
        pluginsError.value = e.message;
      }
    }

    // ---- Config Export/Import ----
    const importFileInput = ref(null);

    async function exportConfig() {
      try {
        const opts = { method: 'GET', credentials: 'same-origin' };
        if (csrfToken) {
          opts.headers = { 'X-CSRF-Token': csrfToken };
        }
        const res = await fetch('/verynginx/config/export', opts);
        if (!res.ok) { showToast('Export failed: HTTP ' + res.status, 'error'); return; }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'config.json';
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (e) {
        showToast('Export failed: ' + e.message, 'error');
      }
    }

    function importConfig() {
      configImportError.value = '';
      configImportOk.value = '';
      if (importFileInput.value) importFileInput.value.click();
    }

    async function onImportFile(e) {
      configImportError.value = '';
      configImportOk.value = '';
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (file.size > 1048576) { configImportError.value = 'File too large (max 1 MB)'; return; }
      const text = await file.text();
      try {
        const parsed = JSON.parse(text);
        const d = await api('POST', '/verynginx/config/import', parsed);
        if (d.ret === 'success') {
          configImportOk.value = 'Configuration imported successfully.';
          await loadConfig();
        } else {
          configImportError.value = d.message || 'Import failed';
        }
      } catch (e) {
        configImportError.value = e.message;
      }
      e.target.value = '';
    }

    // ---- Top Paths ----
    async function loadTopPaths() {
      try {
        const d = await api('GET', '/verynginx/stats/top-paths?limit=20');
        if (d.ret === 'success') {
          topPaths.value = d.data || [];
        }
      } catch (e) {
        console.warn('Top paths load failed:', e.message);
      }
    }

    async function wafRunTest() {
      wafTestError.value = '';
      wafTestResults.value = null;

      let rule, cases;
      try {
        rule = JSON.parse(wafTestRuleJson.value);
      } catch (e) {
        wafTestError.value = 'Invalid rule JSON: ' + e.message;
        return;
      }
      try {
        cases = JSON.parse(wafTestCasesJson.value);
        if (!Array.isArray(cases) || !cases.length) throw new Error('Must be a non-empty array');
      } catch (e) {
        wafTestError.value = 'Invalid test cases JSON: ' + e.message;
        return;
      }

      wafTesting.value = true;
      try {
        const d = await api('POST', '/verynginx/waf/rules/test', { rule, test_cases: cases });
        if (d.ret === 'success') {
          wafTestResults.value = d.data;
          await loadTestHistory();
        } else {
          wafTestError.value = d.message || 'Test failed';
        }
      } catch (e) {
        wafTestError.value = e.message;
      }
      wafTesting.value = false;
    }

    return {
