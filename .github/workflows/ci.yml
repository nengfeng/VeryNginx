name: VeryNginx v2 CI

on:
  push:
    branches: [ v2, master ]
  pull_request:
    branches: [ v2, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 liblua5.3-dev luarocks
          luarocks --local install luacheck
          echo "$HOME/.luarocks/bin" >> $GITHUB_PATH
      - name: Lint v2 Lua files
        run: |
          luacheck verynginx/core/ --no-color || true
          luacheck verynginx/matcher/ --no-color || true
          luacheck verynginx/action/ --no-color || true
          luacheck verynginx/plugin/ --no-color || true
          luacheck verynginx/api/ --no-color || true

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install busted
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 liblua5.3-dev luarocks
          luarocks --local install busted
          echo "$HOME/.luarocks/bin" >> $GITHUB_PATH
      - name: Run unit tests
        run: busted --helper=test/v2/spec/spec_helper.lua test/v2/spec

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v3
      - name: Generate config.json with default credentials
        run: |
          python3 << 'PYEOF'
          import hashlib, hmac, base64, json
          password = b'verynginx'
          salt = bytes(range(16))
          init_msg = salt + b'\x00\x00\x00\x01'
          u = hmac.new(password, init_msg, 'sha256').digest()
          result = bytearray(u)
          for i in range(2, 12001):
              u = hmac.new(password, u, 'sha256').digest()
              for j, b in enumerate(u):
                  result[j] ^= b
          hash_val = 'p1$12000$' + base64.b64encode(salt).decode() + '$' + base64.b64encode(bytes(result)).decode()
          config = json.load(open('verynginx/configs/config.default.json'))
          config['admin'][0]['password_hash'] = hash_val
          config['security']['session_secret'] = 'test-ci-secret'
          json.dump(config, open('verynginx/configs/config.json', 'w'), indent=2)
          PYEOF
      - name: Docker Compose up
        run: |
          cd test/v2
          docker compose up -d --wait
      - name: Run integration tests
        run: |
          cd test/v2
          pip install -r ../requirements.txt
          python test_integration.py
      - name: Docker Compose down
        if: always()
        run: |
          cd test/v2
          docker compose down

  performance-baseline:
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v3
      - name: Docker Compose up
        run: |
          cd test/v2
          docker compose up -d --wait
      - name: Install wrk
        run: sudo apt-get install -y wrk
      - name: Run performance baseline
        run: |
          echo "=== Performance Baseline ==="
          wrk -t2 -c10 -d10s http://localhost:8080/verynginx/status
          echo ""
          echo "=== Concurrency Test ==="
          wrk -t2 -c100 -d10s http://localhost:8080/ | head -20
      - name: Docker Compose down
        if: always()
        run: |
          cd test/v2
          docker compose down