name: VeryNginx v2 CI

on:
  push:
    branches: [ v2, master ]
  pull_request:
    branches: [ v2, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 liblua5.3-dev luarocks
          luarocks --local install luacheck
          echo "$HOME/.luarocks/bin" >> $GITHUB_PATH
      - name: Lint v2 Lua files
        run: |
          luacheck verynginx/core/ --no-color
          luacheck verynginx/matcher/ --no-color
          luacheck verynginx/action/ --no-color
          luacheck verynginx/plugin/ --no-color
          luacheck verynginx/api/ --no-color
      - name: Check dashboard bindings (template vs export)
        run: |
          node test/v2/check_bindings.js

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install busted
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 liblua5.3-dev luarocks
          luarocks --local install busted
          echo "$HOME/.luarocks/bin" >> $GITHUB_PATH
      - name: Run unit tests
        run: busted --helper=test/v2/spec/spec_helper.lua test/v2/spec

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Generate config.json with default credentials
        run: |
          python3 << 'PYEOF'
          import json, base64
          # Use openssl to compute PBKDF2 hash (matches OpenSSL used by nginx/OpenResty)
          password = b'verynginx'
          salt_hex = "000102030405060708090a0b0c0d0e0f"
          from hashlib import pbkdf2_hmac
          dk = pbkdf2_hmac('sha256', password, bytes.fromhex(salt_hex), 12000)
          hash_b64 = base64.b64encode(dk).decode()
          salt_b64 = base64.b64encode(bytes.fromhex(salt_hex)).decode()
          hash_val = "p1$12000$" + salt_b64 + "$" + hash_b64
          config = json.load(open('verynginx/configs/config.default.json'))
          config['admin'][0]['password_hash'] = hash_val
          config['security']['session_secret'] = 'test-ci-secret'
          json.dump(config, open('verynginx/configs/config.json', 'w'), indent=2)
          PYEOF
          # Make configs writable by container nginx worker (runs as nobody)
          chmod -R 777 verynginx/configs
      - name: Docker Compose up
        run: |
          cd test/v2
          docker compose up -d --wait || (docker compose logs verynginx 2>&1 && exit 1)
      - name: Capture container logs on failure
        if: failure()
        run: |
          docker compose -f test/v2/docker-compose.yml logs verynginx 2>&1 || true
      - name: Run integration tests
        run: |
          cd test/v2
          pip install -r ../requirements.txt
          python test_integration.py
      - name: Docker Compose down
        if: always()
        run: |
          cd test/v2
          docker compose down

  performance-baseline:
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
      - name: Generate config.json with default credentials
        run: |
          python3 << 'PYEOF'
          import json, base64
          # Use openssl to compute PBKDF2 hash (matches OpenSSL used by nginx/OpenResty)
          password = b'verynginx'
          salt_hex = "000102030405060708090a0b0c0d0e0f"
          from hashlib import pbkdf2_hmac
          dk = pbkdf2_hmac('sha256', password, bytes.fromhex(salt_hex), 12000)
          hash_b64 = base64.b64encode(dk).decode()
          salt_b64 = base64.b64encode(bytes.fromhex(salt_hex)).decode()
          hash_val = "p1$12000$" + salt_b64 + "$" + hash_b64
          config = json.load(open('verynginx/configs/config.default.json'))
          config['admin'][0]['password_hash'] = hash_val
          config['security']['session_secret'] = 'test-ci-secret'
          json.dump(config, open('verynginx/configs/config.json', 'w'), indent=2)
          PYEOF
          # Make configs writable by container nginx worker (runs as nobody)
          chmod -R 777 verynginx/configs
      - name: Docker Compose up
        run: |
          cd test/v2
          docker compose up -d --wait || (docker compose logs verynginx 2>&1 && exit 1)
      - name: Install wrk
        run: sudo apt-get install -y wrk
      - name: Run performance baseline
        run: |
          echo "=== Performance Baseline ==="
          wrk -t2 -c10 -d10s http://localhost:8080/verynginx/status
          echo ""
          echo "=== Concurrency Test ==="
          wrk -t2 -c100 -d10s http://localhost:8080/ | head -20
      - name: Docker Compose down
        if: always()
        run: |
          cd test/v2
          docker compose down